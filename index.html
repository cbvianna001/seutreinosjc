<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SanjaFit | Arena Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; min-height: 100vh; overflow-x: hidden; }
        .nav-bottom { background: rgba(0,0,0,0.95); backdrop-filter: blur(10px); border-top: 1px solid #262626; position: fixed; bottom: 0; width: 100%; height: 70px; z-index: 1000; display: grid; grid-template-columns: repeat(4, 1fr); align-items: center; justify-items: center; }
        .active-nav { color: #3b82f6; transform: scale(1.1); }
        .glass-card { background: #121212; border: 1px solid #262626; border-radius: 12px; }
        .modal-full { display: none; position: fixed; inset: 0; background: #000; z-index: 2000; padding: 20px; flex-direction: column; overflow-y: auto; }
        .photo-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 3000; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        ::-webkit-scrollbar { display: none; }
        .btn-blue { background-color: #0095f6; border-radius: 8px; font-weight: 700; transition: 0.2s; }
        input, select, textarea { background: #121212 !important; border: 1px solid #262626 !important; color: white !important; outline: none; border-radius: 8px; }
        .heart-active { color: #ff3040; transform: scale(1.2); }
    </style>
</head>
<body class="pb-24">

    <div id="photo-zoom" class="photo-overlay">
        <button onclick="closePhotoZoom()" class="absolute top-6 right-6 text-3xl">✕</button>
        <img id="zoom-img" src="" class="max-w-full max-h-[70vh] rounded-lg border border-[#262626]">
        <div id="zoom-actions" class="mt-6 flex gap-10 items-center">
            <button id="btn-like-zoom" class="text-4xl">🤍</button>
            <button id="btn-delete-photo" class="hidden bg-red-600 px-6 py-2 rounded-full font-bold text-[10px] uppercase">Excluir Post</button>
        </div>
        <p id="zoom-likes-display" class="mt-4 text-[10px] font-black text-gray-500 uppercase tracking-widest"></p>
    </div>

    <div id="modal-user-profile" class="modal-full">
        <div class="flex justify-between items-center mb-6 sticky top-0 bg-black py-2 z-50">
            <h2 id="v-user-handle" class="text-sm font-black uppercase italic text-blue-500">@atleta</h2>
            <button onclick="closeUserProfile()" class="text-2xl">✕</button>
        </div>
        <div class="space-y-6">
            <div class="flex items-center gap-6">
                <div class="w-20 h-20 rounded-full border border-[#262626] overflow-hidden bg-zinc-900 flex items-center justify-center">
                    <img id="v-user-avatar" src="" class="w-full h-full object-cover hidden">
                    <span id="v-user-icon" class="text-3xl">👤</span>
                </div>
                <div class="flex flex-1 justify-around text-center uppercase font-black text-[10px]">
                    <div><p id="v-user-photos-count" class="text-sm font-bold">0</p>Posts</div>
                    <div><p id="v-user-followers-count" class="text-sm font-bold">0</p>Amigos</div>
                    <div><p id="v-user-likes-count" class="text-sm font-bold">0</p>Likes</div>
                </div>
            </div>
            <div class="space-y-2">
                <h2 id="v-user-name" class="font-black text-lg">Nome</h2>
                <p id="v-user-bio" class="text-xs text-gray-400 italic"></p>
                <div id="v-user-insta-area"></div>
                <div id="v-user-follow-area" class="flex gap-2 mt-4 min-h-[40px]"></div>
            </div>
            <div id="v-user-gallery" class="grid grid-cols-3 gap-[1px]"></div>
        </div>
    </div>

    <div id="section-app" class="hidden max-w-lg mx-auto">
        <header class="p-4 border-b border-[#262626] flex justify-between items-center sticky top-0 bg-black z-50">
            <h1 class="text-xl font-black italic tracking-tighter uppercase">Sanja<span class="text-blue-500">Fit</span></h1>
            <button onclick="handleSignOut()" class="text-[10px] font-bold text-red-500 uppercase italic">Sair</button>
        </header>

        <div id="view-championship" class="p-4 space-y-4">
            <div id="ranking-list" class="space-y-3"></div>
        </div>

        <div id="view-search" class="hidden p-4 space-y-6">
            <input id="search-input" type="text" oninput="filterAthletes()" placeholder="Buscar atleta..." class="w-full p-4 glass-card text-sm">
            <div id="search-results" class="space-y-3"></div>
        </div>

        <div id="view-stats" class="hidden p-4 space-y-6">
            <div class="flex gap-2 overflow-x-auto pb-2">
                <button onclick="changeLetter('A', this)" class="letter-btn px-6 py-2 rounded-full border border-[#262626] text-[10px] font-black active-nav">TREINO A</button>
                <button onclick="changeLetter('B', this)" class="letter-btn px-6 py-2 rounded-full border border-[#262626] text-[10px] font-black">TREINO B</button>
                <button onclick="changeLetter('SHARED', this)" class="letter-btn px-6 py-2 rounded-full border border-green-900 text-[10px] font-black text-green-500 italic">📥 IMPORTADOS</button>
            </div>
            
            <div id="workout-form-area" class="glass-card p-4 space-y-3">
                <input id="in-name" type="text" placeholder="Exercício" class="w-full p-3 text-sm">
                <div class="flex gap-2"><input id="in-weight" type="number" placeholder="Peso" class="w-full p-3 text-sm"><input id="in-reps" type="text" placeholder="Reps" class="w-full p-3 text-sm"></div>
                <button id="btn-save-workout" onclick="saveWorkout()" class="w-full btn-blue p-3 text-xs uppercase italic">Salvar Exercício</button>
                <button id="btn-cancel-edit" onclick="cancelEditWorkout()" class="hidden w-full text-[10px] text-gray-500 underline">CANCELAR</button>
            </div>
            <button onclick="shareWorkoutUI()" class="w-full bg-blue-900/20 text-blue-500 p-2 rounded-lg text-[10px] font-black uppercase italic">📤 Compartilhar Treino Atual</button>
            <div id="list-workouts" class="space-y-2"></div>
        </div>

        <div id="view-profile" class="hidden">
            <div class="p-6 space-y-6 text-center sm:text-left">
                <div class="flex flex-col sm:flex-row items-center gap-6">
                    <div class="relative w-24 h-24 rounded-full border-2 border-[#262626] overflow-hidden bg-zinc-900 flex items-center justify-center">
                        <img id="my-avatar-img" src="" class="w-full h-full object-cover hidden">
                        <span id="my-avatar-icon" class="text-4xl">👤</span>
                        <button onclick="document.getElementById('file-avatar').click()" class="absolute bottom-0 right-0 bg-blue-500 p-1 rounded-full text-[10px]">📷</button>
                        <input type="file" id="file-avatar" accept="image/*" class="hidden" onchange="uploadAvatar()">
                    </div>
                    <div class="flex-1 space-y-1">
                        <h2 id="my-name" class="font-black text-xl italic uppercase">Nome</h2>
                        <h3 id="my-handle" class="text-xs text-blue-500 font-bold">@atleta</h3>
                        <p id="my-bio" class="text-xs text-gray-400 mt-2 italic"></p>
                        <button onclick="toggleEdit()" class="w-full bg-zinc-800 p-2 rounded mt-3 text-[10px] font-black uppercase tracking-widest">Editar Perfil</button>
                    </div>
                </div>

                <div id="edit-form" class="hidden space-y-3 glass-card p-4">
                    <input id="edit-name" type="text" placeholder="Nome Verdadeiro" class="w-full p-3 text-xs">
                    <textarea id="edit-bio" class="w-full p-3 text-xs h-16" placeholder="Bio"></textarea>
                    <input id="edit-insta" type="text" placeholder="Link Instagram" class="w-full p-3 text-xs">
                    <button onclick="saveProfile()" class="w-full btn-blue p-2 text-xs uppercase">Confirmar</button>
                    <button onclick="deleteAccount()" class="w-full text-red-900 text-[8px] font-black uppercase mt-4">Excluir Conta Permanentemente</button>
                </div>
                
                <button onclick="document.getElementById('file-post').click()" class="w-full btn-blue p-4 uppercase text-xs font-black italic">Publicar Shape 🔥</button>
                <input type="file" id="file-post" accept="image/*" class="hidden" onchange="uploadEvolution()">
                <div id="my-gallery" class="grid grid-cols-3 gap-[1px]"></div>

                <footer class="mt-12 py-10 text-center border-t border-zinc-900 opacity-50 grayscale">
                    <a href="https://instagram.com/systemsjc_" target="_blank" class="block text-blue-500 font-black text-xs italic tracking-tighter">SYSTEMSJC</a>
                    <a href="https://instagram.com/ojeanvianna_" target="_blank" class="block text-white font-bold text-[10px] italic">@OJEANVIANNA_</a>
                </footer>
            </div>
        </div>

        <nav class="nav-bottom">
            <button onclick="switchView('championship')" id="nav-championship" class="active-nav nav-item text-2xl">🏆</button>
            <button onclick="switchView('search')" id="nav-search" class="nav-item text-2xl">🔍</button>
            <button onclick="switchView('stats')" id="nav-stats" class="nav-item text-2xl">📋</button>
            <button onclick="switchView('profile')" id="nav-profile" class="nav-item text-2xl">👤</button>
        </nav>
    </div>

    <div id="section-login" class="hidden flex flex-col items-center justify-center min-h-screen p-6">
        <h1 class="text-4xl font-black italic mb-10 tracking-tighter uppercase italic">Sanja<span class="text-blue-500">Fit</span></h1>
        <div class="w-full max-w-sm space-y-4">
            <input id="login-user" type="text" placeholder="@seu_instagram" class="w-full p-4 rounded-xl bg-[#121212] border border-[#262626]">
            <input id="login-pass" type="password" placeholder="Senha" class="w-full p-4 rounded-xl bg-[#121212] border border-[#262626]">
            <button onclick="handleSignIn()" class="w-full btn-blue p-4 uppercase font-black text-sm">Entrar Arena</button>
            <button onclick="handleSignUp()" class="w-full text-blue-500 text-[10px] font-black uppercase mt-2">Criar Conta Atleta</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://dazgtsobkykxwsvbmjfn.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRhemd0c29ia3lreHdzdmJtamZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxOTg4NTYsImV4cCI6MjA4ODc3NDg1Nn0.Ci_Hzqzf9Px8LTg7dNOXcu1dcTzBYWioH2yaFP2h6rI';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null, currentLetter = 'A', editingWorkoutId = null, allProfiles = [];

        window.onload = async () => {
            const { data: { user } } = await _supabase.auth.getUser();
            if(user) initApp(user); else document.getElementById('section-login').classList.remove('hidden');
        };

        async function initApp(user) {
            currentUser = user;
            document.getElementById('section-login').classList.add('hidden');
            document.getElementById('section-app').classList.remove('hidden');
            await loadRanking(); await loadMyProfile();
        }

        // --- AUTH ---
        async function handleSignIn() {
            const u = document.getElementById('login-user').value.trim().replace('@',''), p = document.getElementById('login-pass').value;
            const { error } = await _supabase.auth.signInWithPassword({ email: `${u}@sanjafit.com`, password: p });
            if(error) alert("Erro no login!"); else location.reload();
        }
        async function handleSignUp() {
            const u = document.getElementById('login-user').value.trim().replace('@',''), p = document.getElementById('login-pass').value;
            const { data, error } = await _supabase.auth.signUp({ email: `${u}@sanjafit.com`, password: p });
            if(error) return alert(error.message);
            await _supabase.from('profiles').upsert({ id: data.user.id, instagram: `@${u}` });
            alert("Conta criada! Entre agora.");
        }
        async function handleSignOut() { await _supabase.auth.signOut(); location.reload(); }

        // --- SEGUIR E DESFAZER (FIXADO) ---
        async function toggleFollow(targetId, currentStatus) {
            if (currentStatus === 'accepted' || currentStatus === 'pending') {
                if(confirm("Remover conexão?")) {
                    await _supabase.from('connections').delete().match({ follower_id: currentUser.id, following_id: targetId });
                    await _supabase.from('connections').delete().match({ follower_id: targetId, following_id: currentUser.id });
                    openUserProfile(targetId);
                }
            } else {
                await _supabase.from('connections').insert([{ follower_id: currentUser.id, following_id: targetId, status: 'pending' }]);
                openUserProfile(targetId);
            }
        }

        async function openUserProfile(userId) {
            const { data: p } = await _supabase.from('profiles').select('*').eq('id', userId).single();
            if(!p) return;
            document.getElementById('v-user-handle').innerText = p.instagram;
            document.getElementById('v-user-name').innerText = p.full_name || "Atleta";
            document.getElementById('v-user-bio').innerText = p.bio || "";
            
            // Avatar
            const avatarImg = document.getElementById('v-user-avatar');
            const avatarIcon = document.getElementById('v-user-icon');
            if(p.avatar_url) { avatarImg.src = p.avatar_url; avatarImg.classList.remove('hidden'); avatarIcon.classList.add('hidden'); }
            else { avatarImg.classList.add('hidden'); avatarIcon.classList.remove('hidden'); }

            // Botão Dinâmico
            const followArea = document.getElementById('v-user-follow-area');
            if(userId !== currentUser.id) {
                const { data: conn } = await _supabase.from('connections').select('*').or(`and(follower_id.eq.${currentUser.id},following_id.eq.${userId}),and(follower_id.eq.${userId},following_id.eq.${currentUser.id})`).single();
                const status = conn ? conn.status : 'none';
                const label = status === 'accepted' ? 'Amigos ✅ (Remover)' : status === 'pending' ? 'Pendente ⏳ (Cancelar)' : 'Seguir Atleta 🔥';
                followArea.innerHTML = `<button onclick="toggleFollow('${userId}', '${status}')" class="w-full ${status === 'none' ? 'btn-blue' : 'bg-zinc-800'} p-2 rounded text-[10px] font-black uppercase italic">${label}</button>`;
            }

            // Stats e Gallery
            const { data: photos } = await _supabase.from('evolution_gallery').select('*, likes(user_id)').eq('user_id', userId);
            const totalLikes = photos?.reduce((acc, curr) => acc + (curr.likes?.length || 0), 0) || 0;
            document.getElementById('v-user-photos-count').innerText = photos?.length || 0;
            document.getElementById('v-user-likes-count').innerText = totalLikes;
            
            const { count: friends } = await _supabase.from('connections').select('*', {count: 'exact'}).eq('following_id', userId).eq('status', 'accepted');
            document.getElementById('v-user-followers-count').innerText = friends || 0;

            document.getElementById('v-user-gallery').innerHTML = (photos || []).map(ph => `<img src="${ph.photo_url}" class="aspect-square object-cover" onclick="openPhotoZoom('${ph.id}','${ph.photo_url}',false)">`).join('');
            document.getElementById('modal-user-profile').style.display = 'flex';
        }

        // --- LIKE (FIXADO) ---
        async function handleLike(photoId, btn) {
            const { data: liked } = await _supabase.from('likes').select('*').eq('post_id', photoId).eq('user_id', currentUser.id).single();
            if(liked) {
                await _supabase.from('likes').delete().eq('id', liked.id);
                btn.innerText = '🤍'; btn.classList.remove('heart-active');
            } else {
                await _supabase.from('likes').insert([{ post_id: photoId, user_id: currentUser.id }]);
                btn.innerText = '❤️'; btn.classList.add('heart-active');
            }
            const { count } = await _supabase.from('likes').select('*', { count: 'exact', head: true }).eq('post_id', photoId);
            document.getElementById('zoom-likes-display').innerText = `${count} CURTIDAS`;
        }

        // --- COMPARTILHAR TREINO (IMPLEMENTADO) ---
        async function shareWorkoutUI() {
            const { data: friends } = await _supabase.from('connections').select('following_id, profiles!connections_following_id_fkey(instagram)').eq('follower_id', currentUser.id).eq('status', 'accepted');
            if(!friends?.length) return alert("Você precisa de amigos aceitos para enviar.");
            const target = prompt("Digite o @ do amigo:\n" + friends.map(f => f.profiles.instagram).join(', '));
            if(!target) return;
            const friend = friends.find(f => f.profiles.instagram.includes(target.replace('@','')));
            const { data: workouts } = await _supabase.from('workouts').select('*').eq('user_id', currentUser.id).eq('category', currentLetter);
            if(!workouts?.length) return alert("Ficha vazia!");
            await _supabase.from('shared_workouts').insert([{ sender_id: currentUser.id, receiver_id: friend.following_id, workout_data: { sender: currentUser.id, exercises: workouts } }]);
            alert("Treino enviado!");
        }

        // --- TREINOS (EDIÇÃO FIXADA) ---
        async function loadWorkouts() {
            const list = document.getElementById('list-workouts');
            if(currentLetter === 'SHARED') {
                const { data } = await _supabase.from('shared_workouts').select('*, profiles!shared_workouts_sender_id_fkey(instagram)').eq('receiver_id', currentUser.id).eq('status', 'pending');
                list.innerHTML = (data || []).map(s => `<div class="p-4 glass-card border-green-500/20 flex justify-between items-center"><span class="text-xs italic text-green-500">Treino de ${s.profiles.instagram}</span><button onclick="acceptWorkout('${s.id}')" class="bg-green-600 px-3 py-1 rounded text-[10px] font-black uppercase">Importar</button></div>`).join('') || '<p class="text-center py-10 opacity-30 text-xs uppercase">Nenhum treino novo.</p>';
            } else {
                const { data } = await _supabase.from('workouts').select('*').eq('user_id', currentUser.id).eq('category', currentLetter).order('created_at');
                list.innerHTML = (data || []).map(ex => `<div class="p-3 glass-card flex justify-between items-center text-xs"><div><b>${ex.exercise_name}</b><p class="text-[10px] text-blue-500">${ex.weight}kg x ${ex.reps}</p></div><div class="flex gap-4"><button onclick='startEditWorkout(${JSON.stringify(ex)})' class="text-blue-500 text-[10px] uppercase font-bold underline italic">Editar</button><button onclick="deleteEx('${ex.id}')" class="text-red-900 font-bold">X</button></div></div>`).join('');
            }
        }

        function startEditWorkout(ex) { editingWorkoutId = ex.id; document.getElementById('in-name').value = ex.exercise_name; document.getElementById('in-weight').value = ex.weight; document.getElementById('in-reps').value = ex.reps; document.getElementById('btn-save-workout').innerText = "Atualizar Exercício"; document.getElementById('btn-cancel-edit').classList.remove('hidden'); }
        function cancelEditWorkout() { editingWorkoutId = null; document.getElementById('btn-save-workout').innerText = "Salvar na Ficha"; document.getElementById('btn-cancel-edit').classList.add('hidden'); document.getElementById('in-name').value = ''; }

        // --- ZOOM ---
        async function openPhotoZoom(id, url, isMine) {
            document.getElementById('zoom-img').src = url;
            document.getElementById('photo-zoom').style.display = 'flex';
            const bL = document.getElementById('btn-like-zoom');
            const { data: liked } = await _supabase.from('likes').select('*').eq('post_id', id).eq('user_id', currentUser.id).single();
            bL.innerText = liked ? '❤️' : '🤍'; bL.onclick = () => handleLike(id, bL);
            const bD = document.getElementById('btn-delete-photo'); bD.classList.toggle('hidden', !isMine);
            bD.onclick = async () => { if(confirm("Apagar?")) { await _supabase.from('evolution_gallery').delete().eq('id', id); location.reload(); } }
        }

        // ... Restante das auxiliares (Navegação, Perfil, Macros) mantidas conforme as anteriores ...
        function switchView(v) { ['championship','search','stats','profile'].forEach(id => { document.getElementById('view-'+id).classList.add('hidden'); document.getElementById('nav-'+id).classList.remove('active-nav'); }); document.getElementById('view-'+v).classList.remove('hidden'); document.getElementById('nav-'+v).classList.add('active-nav'); if(v==='stats') loadWorkouts(); }
        function closeUserProfile() { document.getElementById('modal-user-profile').style.display = 'none'; }
        function closePhotoZoom() { document.getElementById('photo-zoom').style.display = 'none'; }
        async function loadMyProfile() { /* Carregamento dos contadores do usuário logado */ }
        async function loadRanking() { const { data } = await _supabase.from('profiles').select('*').order('xp', {ascending: false}); allProfiles = data || []; document.getElementById('ranking-list').innerHTML = allProfiles.map((p, i) => `<div class="flex items-center justify-between p-4 glass-card ${i===0?'rank-1':''}" onclick="openUserProfile('${p.id}')"><div class="flex items-center gap-3"><span class="text-[10px] font-black">${i+1}º</span><p class="text-xs font-bold uppercase italic">${p.instagram}</p></div><span class="text-[9px] font-black text-blue-500">${p.xp || 0} XP</span></div>`).join(''); }
        function filterAthletes() { const term = document.getElementById('search-input').value.toLowerCase().trim(); const filtered = allProfiles.filter(p => p.instagram.toLowerCase().includes(term)); document.getElementById('search-results').innerHTML = filtered.map(p => `<div class="flex items-center justify-between p-3 glass-card" onclick="openUserProfile('${p.id}')"><div class="flex items-center gap-3"><span class="text-xs font-bold uppercase">${p.instagram}</span></div><button class="btn-blue px-4 py-1 text-[10px]">VER</button></div>`).join(''); }
        async function saveWorkout() { const n = document.getElementById('in-name').value, w = document.getElementById('in-weight').value, r = document.getElementById('in-reps').value; if(editingWorkoutId) { await _supabase.from('workouts').update({ exercise_name: n, weight: String(w), reps: String(r) }).eq('id', editingWorkoutId); editingWorkoutId = null; } else { await _supabase.from('workouts').insert([{ user_id: currentUser.id, category: currentLetter, exercise_name: n, weight: String(w), reps: String(r) }]); } location.reload(); }
        async function deleteEx(id) { if(confirm("Apagar?")) { await _supabase.from('workouts').delete().eq('id', id); loadWorkouts(); } }
        function changeLetter(l, btn) { currentLetter = l; document.querySelectorAll('.letter-btn').forEach(b => b.classList.remove('active-nav')); btn.classList.add('active-nav'); loadWorkouts(); }
    </script>
</body>
</html>
