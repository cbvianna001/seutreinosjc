<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SanjaFit | Arena Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; min-height: 100vh; overflow-x: hidden; }
        .nav-bottom { background: rgba(0,0,0,0.95); border-top: 1px solid #262626; position: fixed; bottom: 0; width: 100%; height: 70px; z-index: 1000; display: grid; grid-template-columns: repeat(4, 1fr); align-items: center; justify-items: center; }
        .active-nav { color: #3b82f6; transform: scale(1.1); }
        .glass-card { background: #121212; border: 1px solid #262626; border-radius: 12px; }
        .modal-full { display: none; position: fixed; inset: 0; background: #000; z-index: 2000; padding: 20px; flex-direction: column; overflow-y: auto; }
        .photo-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 3000; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        input, select, textarea { background: #121212 !important; border: 1px solid #262626 !important; color: white !important; outline: none; border-radius: 8px; width: 100%; padding: 12px; }
        .btn-blue { background-color: #0095f6; border-radius: 8px; font-weight: 700; transition: 0.2s; }
        .btn-blue:active { transform: scale(0.95); }
    </style>
</head>
<body class="pb-24">

    <div id="photo-zoom" class="photo-overlay">
        <button onclick="closePhotoZoom()" class="absolute top-6 right-6 text-3xl">✕</button>
        <img id="zoom-img" src="" class="max-w-full max-h-[60vh] rounded-lg border border-[#262626] mb-4">
        <div id="zoom-info" class="w-full max-w-sm text-center">
            <p id="zoom-caption" class="text-sm italic text-gray-300 mb-4 px-4"></p>
            <div id="edit-caption-area" class="hidden mb-4">
                <input id="in-edit-caption" type="text" placeholder="Nova legenda..." class="text-xs mb-2">
                <button onclick="saveNewCaption()" class="bg-blue-500 text-[10px] px-4 py-1 rounded font-bold uppercase">Salvar Legenda</button>
            </div>
            <div id="zoom-actions" class="flex justify-center gap-10 items-center">
                <button id="btn-like-zoom" class="text-4xl">🤍</button>
                <button id="btn-edit-photo" class="hidden text-xs text-blue-500 font-bold uppercase underline">Legenda</button>
                <button id="btn-delete-photo" class="hidden text-xs text-red-500 font-bold uppercase underline">Apagar</button>
            </div>
        </div>
    </div>

    <div id="modal-user-profile" class="modal-full">
        <div class="flex justify-between items-center mb-6">
            <h2 id="v-user-handle" class="text-sm font-black uppercase text-blue-500 italic">@atleta</h2>
            <button onclick="closeUserProfile()" class="text-2xl">✕</button>
        </div>
        <div id="v-user-content" class="space-y-6">
            <div class="flex items-center gap-6">
                <div class="w-20 h-20 rounded-full border border-[#262626] overflow-hidden bg-zinc-900 flex items-center justify-center">
                    <img id="v-user-avatar" src="" class="w-full h-full object-cover hidden">
                    <span id="v-user-icon" class="text-3xl">👤</span>
                </div>
                <div class="flex flex-1 justify-around text-center uppercase font-black text-[10px]">
                    <div><p id="v-user-photos-count" class="text-sm">0</p>Posts</div>
                    <div><p id="v-user-followers-count" class="text-sm">0</p>Amigos</div>
                </div>
            </div>
            <div class="space-y-2">
                <h2 id="v-user-name" class="font-black text-lg">Nome</h2>
                <p id="v-user-bio" class="text-xs text-gray-400 italic"></p>
                <div id="v-user-follow-area"></div>
            </div>
            <div id="v-user-gallery" class="grid grid-cols-3 gap-[1px]"></div>
        </div>
    </div>

    <div id="section-app" class="hidden max-w-lg mx-auto">
        <header class="p-4 border-b border-[#262626] flex justify-between items-center sticky top-0 bg-black z-50">
            <h1 class="text-xl font-black italic tracking-tighter uppercase">Sanja<span class="text-blue-500">Fit</span></h1>
            <button onclick="handleSignOut()" class="text-[10px] font-bold text-red-500 uppercase">Sair</button>
        </header>

        <div id="view-championship" class="p-4 space-y-4">
            <div id="ranking-list" class="space-y-3"></div>
        </div>

        <div id="view-search" class="hidden p-4 space-y-6">
            <input id="search-input" type="text" oninput="filterAthletes()" placeholder="Pesquisar atleta..." class="glass-card">
            <div id="search-results" class="space-y-3"></div>
        </div>

        <div id="view-stats" class="hidden p-4 space-y-6">
            <div class="flex gap-2 overflow-x-auto pb-2">
                <button onclick="changeLetter('A', this)" class="letter-btn px-6 py-2 rounded-full border border-[#262626] text-[10px] font-black active-nav">TREINO A</button>
                <button onclick="changeLetter('B', this)" class="letter-btn px-6 py-2 rounded-full border border-[#262626] text-[10px] font-black">TREINO B</button>
            </div>
            <div class="glass-card p-4 space-y-3">
                <input id="in-name" type="text" placeholder="Nome do Exercício">
                <div class="flex gap-2"><input id="in-weight" type="number" placeholder="Peso"><input id="in-reps" type="text" placeholder="Reps"></div>
                <button id="btn-save-workout" onclick="saveWorkout()" class="btn-blue p-3 text-xs uppercase italic w-full">Salvar na Ficha</button>
            </div>
            <div id="list-workouts" class="space-y-2"></div>
        </div>

        <div id="view-profile" class="hidden p-6 space-y-6">
            <div class="flex items-center gap-6">
                <div class="relative w-24 h-24 rounded-full border-2 border-[#262626] overflow-hidden bg-zinc-900 flex items-center justify-center">
                    <img id="my-avatar-img" src="" class="w-full h-full object-cover hidden">
                    <span id="my-avatar-icon" class="text-4xl">👤</span>
                    <button onclick="document.getElementById('file-avatar').click()" class="absolute bottom-0 right-0 bg-blue-500 p-1 rounded-full text-[10px]">📷</button>
                    <input type="file" id="file-avatar" accept="image/*" class="hidden" onchange="uploadAvatar()">
                </div>
                <div class="flex flex-1 justify-around text-center uppercase font-black text-[10px]">
                    <div><p id="my-photos-count" class="text-sm">0</p>Posts</div>
                    <div><p id="my-followers-count" class="text-sm">0</p>Amigos</div>
                </div>
            </div>
            <div class="space-y-1">
                <h2 id="my-name" class="font-black text-xl italic uppercase leading-none">Atleta</h2>
                <h3 id="my-handle" class="text-xs text-blue-500 font-bold uppercase">@atleta</h3>
                <p id="my-bio" class="text-xs text-gray-400 mt-2 italic"></p>
                <button onclick="toggleEdit()" class="w-full bg-zinc-800 p-2 rounded mt-3 text-[10px] font-bold uppercase">Editar Perfil</button>
            </div>

            <div id="edit-form" class="hidden space-y-3 glass-card p-4">
                <input id="edit-name-real" type="text" placeholder="Seu Nome Real">
                <textarea id="edit-bio-text" placeholder="Sua bio"></textarea>
                <button onclick="saveProfileData()" class="w-full btn-blue p-2 text-xs uppercase">Confirmar Alterações</button>
            </div>

            <div class="pt-4 border-t border-[#262626] space-y-4">
                <input id="in-caption" type="text" placeholder="Legenda do shape..." class="text-xs">
                <button onclick="document.getElementById('file-post').click()" class="w-full btn-blue p-4 uppercase text-xs font-black italic">Publicar Shape 🔥</button>
                <input type="file" id="file-post" accept="image/*" class="hidden" onchange="uploadEvolution()">
            </div>
            <div id="my-gallery" class="grid grid-cols-3 gap-[1px]"></div>
        </div>

        <nav class="nav-bottom">
            <button onclick="switchView('championship')" id="nav-championship" class="active-nav text-2xl">🏆</button>
            <button onclick="switchView('search')" id="nav-search" class="text-2xl">🔍</button>
            <button onclick="switchView('stats')" id="nav-stats" class="text-2xl">📋</button>
            <button onclick="switchView('profile')" id="nav-profile" class="text-2xl">👤</button>
        </nav>
    </div>

    <div id="section-login" class="hidden flex flex-col items-center justify-center min-h-screen p-6">
        <h1 class="text-4xl font-black italic mb-10 uppercase text-center italic">SANJA<span class="text-blue-500">FIT</span></h1>
        <div class="w-full max-w-sm space-y-4">
            <input id="login-user" type="text" placeholder="@instagram" class="rounded-xl">
            <input id="login-pass" type="password" placeholder="Senha" class="rounded-xl">
            <button onclick="handleSignIn()" class="w-full btn-blue p-4 uppercase font-black text-sm">Entrar</button>
            <button onclick="handleSignUp()" class="w-full text-blue-500 text-xs font-bold uppercase mt-2">Criar conta</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://dazgtsobkykxwsvbmjfn.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRhemd0c29ia3lreHdzdmJtamZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxOTg4NTYsImV4cCI6MjA4ODc3NDg1Nn0.Ci_Hzqzf9Px8LTg7dNOXcu1dcTzBYWioH2yaFP2h6rI';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null, currentLetter = 'A', allProfiles = [], selectedPhotoId = null;

        window.onload = async () => {
            const { data: { user } } = await _supabase.auth.getUser();
            if(user) { currentUser = user; initApp(); } 
            else { document.getElementById('section-login').classList.remove('hidden'); }
        };

        async function initApp() {
            document.getElementById('section-login').classList.add('hidden');
            document.getElementById('section-app').classList.remove('hidden');
            loadRanking(); loadMyProfile(); loadWorkouts();
        }

        // --- PERFIL (CORRIGIDO) ---
        function toggleEdit() { document.getElementById('edit-form').classList.toggle('hidden'); }

        async function saveProfileData() {
            const newName = document.getElementById('edit-name-real').value;
            const newBio = document.getElementById('edit-bio-text').value;
            const { error } = await _supabase.from('profiles').update({ full_name: newName, bio: newBio }).eq('id', currentUser.id);
            if(error) alert("Erro ao salvar perfil!"); else location.reload();
        }

        async function loadMyProfile() {
            const { data: p } = await _supabase.from('profiles').select('*').eq('id', currentUser.id).single();
            if(!p) return;
            document.getElementById('my-name').innerText = p.full_name || "Atleta";
            document.getElementById('my-handle').innerText = p.instagram;
            document.getElementById('my-bio').innerText = p.bio || "";
            document.getElementById('edit-name-real').value = p.full_name || "";
            document.getElementById('edit-bio-text').value = p.bio || "";
            if(p.avatar_url) { document.getElementById('my-avatar-img').src = p.avatar_url; document.getElementById('my-avatar-img').classList.remove('hidden'); document.getElementById('my-avatar-icon').classList.add('hidden'); }
            
            const { data: phs } = await _supabase.from('evolution_gallery').select('*').eq('user_id', currentUser.id).order('created_at', {ascending: false});
            document.getElementById('my-gallery').innerHTML = (phs || []).map(ph => `<img src="${ph.photo_url}" class="aspect-square object-cover" onclick="openPhotoZoom('${ph.id}','${ph.photo_url}','${ph.caption || ""}',true)">`).join('');
            document.getElementById('my-photos-count').innerText = phs?.length || 0;
        }

        // --- ZOOM E LEGENDA ---
        function openPhotoZoom(id, url, caption, isMine) {
            selectedPhotoId = id;
            document.getElementById('zoom-img').src = url;
            document.getElementById('zoom-caption').innerText = caption || "";
            document.getElementById('photo-zoom').style.display = 'flex';
            document.getElementById('btn-delete-photo').classList.toggle('hidden', !isMine);
            document.getElementById('btn-edit-photo').classList.toggle('hidden', !isMine);
            
            if(isMine) {
                document.getElementById('btn-delete-photo').onclick = async () => { if(confirm("Apagar shape?")) { await _supabase.from('evolution_gallery').delete().eq('id', id); location.reload(); } };
                document.getElementById('btn-edit-photo').onclick = () => { document.getElementById('edit-caption-area').classList.toggle('hidden'); document.getElementById('in-edit-caption').value = caption; };
            }
        }

        async function saveNewCaption() {
            const txt = document.getElementById('in-edit-caption').value;
            await _supabase.from('evolution_gallery').update({ caption: txt }).eq('id', selectedPhotoId);
            location.reload();
        }

        // --- TREINOS ---
        async function loadWorkouts() {
            const { data } = await _supabase.from('workouts').select('*').eq('user_id', currentUser.id).eq('category', currentLetter).order('created_at');
            document.getElementById('list-workouts').innerHTML = (data || []).map(ex => `
                <div class="p-3 glass-card flex justify-between items-center text-xs">
                    <div><b>${ex.exercise_name}</b><p class="text-blue-500">${ex.weight}kg x ${ex.reps}</p></div>
                    <button onclick="deleteEx('${ex.id}')" class="text-red-900 font-bold">X</button>
                </div>`).join('');
        }

        async function saveWorkout() {
            const n = document.getElementById('in-name').value, w = document.getElementById('in-weight').value, r = document.getElementById('in-reps').value;
            if(!n) return;
            await _supabase.from('workouts').insert([{ user_id: currentUser.id, category: currentLetter, exercise_name: n, weight: String(w), reps: String(r) }]);
            document.getElementById('in-name').value = ''; loadWorkouts();
        }

        // --- COMPARTILHAMENTO E RANKING ---
        async function openUserProfile(userId) {
            const { data: p } = await _supabase.from('profiles').select('*').eq('id', userId).single();
            document.getElementById('v-user-handle').innerText = p.instagram;
            document.getElementById('v-user-name').innerText = p.full_name || "Atleta";
            document.getElementById('v-user-bio').innerText = p.bio || "";
            const { data: phs } = await _supabase.from('evolution_gallery').select('*').eq('user_id', userId);
            document.getElementById('v-user-gallery').innerHTML = (phs || []).map(ph => `<img src="${ph.photo_url}" class="aspect-square object-cover" onclick="openPhotoZoom('${ph.id}','${ph.photo_url}','${ph.caption || ""}',false)">`).join('');
            document.getElementById('modal-user-profile').style.display = 'flex';
        }

        async function uploadEvolution() {
            const f = document.getElementById('file-post').files[0], cap = document.getElementById('in-caption').value;
            const name = `shape_${Date.now()}.jpg`;
            await _supabase.storage.from('shapes').upload(name, f);
            const { data: url } = _supabase.storage.from('shapes').getPublicUrl(name);
            await _supabase.from('evolution_gallery').insert([{ user_id: currentUser.id, photo_url: url.publicUrl, caption: cap }]);
            location.reload();
        }

        // --- AUX ---
        function switchView(v) { ['championship','search','stats','profile'].forEach(id => { document.getElementById('view-'+id).classList.add('hidden'); document.getElementById('nav-'+id).classList.remove('active-nav'); }); document.getElementById('view-'+v).classList.remove('hidden'); document.getElementById('nav-'+v).classList.add('active-nav'); if(v==='stats') loadWorkouts(); }
        async function handleSignIn() { const u = document.getElementById('login-user').value.trim().replace('@',''), p = document.getElementById('login-pass').value; await _supabase.auth.signInWithPassword({ email: `${u}@sanjafit.com`, password: p }); location.reload(); }
        async function handleSignUp() { const u = document.getElementById('login-user').value.trim().replace('@',''), p = document.getElementById('login-pass').value; await _supabase.auth.signUp({ email: `${u}@sanjafit.com`, password: p }); await _supabase.from('profiles').upsert({ id: (await _supabase.auth.getUser()).data.user.id, instagram: `@${u}` }); alert("Criado!"); }
        async function handleSignOut() { await _supabase.auth.signOut(); location.reload(); }
        async function loadRanking() { const { data } = await _supabase.from('profiles').select('*').order('xp', {ascending: false}); document.getElementById('ranking-list').innerHTML = (data || []).map((p, i) => `<div class="flex items-center justify-between p-4 glass-card" onclick="openUserProfile('${p.id}')"><div>${p.instagram}</div><span>${p.xp || 0} XP</span></div>`).join(''); }
        function closeUserProfile() { document.getElementById('modal-user-profile').style.display = 'none'; }
        function closePhotoZoom() { document.getElementById('photo-zoom').style.display = 'none'; document.getElementById('edit-caption-area').classList.add('hidden'); }
        async function deleteEx(id) { await _supabase.from('workouts').delete().eq('id', id); loadWorkouts(); }
        function changeLetter(l, btn) { currentLetter = l; document.querySelectorAll('.letter-btn').forEach(b => b.classList.remove('active-nav')); btn.classList.add('active-nav'); loadWorkouts(); }
        async function uploadAvatar() { const f = document.getElementById('file-avatar').files[0]; await _supabase.storage.from('shapes').upload(`avatar_${currentUser.id}.jpg`, f, { upsert: true }); const { data: url } = _supabase.storage.from('shapes').getPublicUrl(`avatar_${currentUser.id}.jpg`); await _supabase.from('profiles').update({ avatar_url: url.publicUrl }).eq('id', currentUser.id); location.reload(); }
    </script>
</body>
</html>
