<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SanjaFit | Professional Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.95)), 
                        url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=2070&auto=format&fit=crop');
            background-size: cover; background-position: center; background-attachment: fixed;
        }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .active-tab { background: #3b82f6 !important; border: none !important; box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }
        .trophy-on { opacity: 1 !important; grayscale: 0 !important; filter: drop-shadow(0 0 8px gold); }
        .active-view { border-bottom: 3px solid #3b82f6; color: white !important; }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col">

    <div id="section-login" class="flex flex-col items-center justify-center min-h-screen p-6 text-center">
        <h1 class="text-5xl font-black italic text-blue-500 uppercase mb-8 tracking-tighter">SANJA<span class="text-white">FIT</span></h1>
        <div class="glass p-8 rounded-[2rem] w-full max-w-md shadow-2xl">
            <input id="login-user" type="text" placeholder="@seu_instagram" class="w-full p-4 mb-4 rounded-xl bg-black/40 border border-white/10 outline-none focus:border-blue-500 text-white">
            <input id="login-pass" type="password" placeholder="Senha" class="w-full p-4 mb-8 rounded-xl bg-black/40 border border-white/10 outline-none focus:border-blue-500 text-white">
            <button onclick="handleSignIn()" class="w-full bg-blue-600 hover:bg-blue-700 p-4 rounded-xl font-black uppercase tracking-widest shadow-lg active:scale-95 transition-all">Entrar</button>
            <button onclick="handleSignUp()" class="w-full mt-6 text-[10px] text-gray-400 font-bold uppercase hover:text-white transition-colors">Criar Conta Atleta</button>
        </div>
    </div>

    <div id="section-app" class="hidden flex-grow max-w-2xl mx-auto p-4 w-full">
        <header class="flex justify-between items-center py-6 mb-4">
            <h2 id="display-name" class="text-2xl font-black italic uppercase text-blue-500 tracking-tighter">@USUARIO</h2>
            <button onclick="location.reload()" class="text-red-400 text-[10px] font-black uppercase border border-red-900/30 px-4 py-2 rounded-xl">Sair</button>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
            <div class="glass p-6 rounded-3xl text-center">
                <p class="text-[9px] font-black uppercase text-gray-500 mb-2 italic">Meta Mensal (20)</p>
                <div class="w-full bg-white/5 rounded-full h-2 mb-2 overflow-hidden"><div id="bar-goal" class="bg-blue-600 h-full w-0 transition-all duration-1000"></div></div>
                <p id="txt-goal" class="text-[10px] font-bold text-blue-400">0/20 Treinos</p>
            </div>
            <div class="glass p-6 rounded-3xl flex justify-around items-center">
                <span id="t1" class="text-3xl opacity-10 grayscale transition-all">🏆</span>
                <span id="t2" class="text-3xl opacity-10 grayscale transition-all">🔥</span>
                <span id="t3" class="text-3xl opacity-10 grayscale transition-all">👑</span>
            </div>
        </div>

        <div class="grid grid-cols-4 gap-2 mb-8 text-center">
            <button onclick="changeLetter('A', this)" class="letter-btn p-4 rounded-xl glass font-black active-tab">A</button>
            <button onclick="changeLetter('B', this)" class="letter-btn p-4 rounded-xl glass font-black">B</button>
            <button onclick="changeLetter('C', this)" class="letter-btn p-4 rounded-xl glass font-black">C</button>
            <button onclick="changeLetter('D', this)" class="letter-btn p-4 rounded-xl glass font-black">D</button>
        </div>

        <div class="glass p-6 rounded-[2rem] mb-8 border border-white/5 shadow-2xl">
            <h3 class="text-xs font-black uppercase mb-4 text-blue-500 italic">Gestão de Exercício - Treino <span id="label-letter">A</span></h3>
            <div class="grid grid-cols-2 gap-3 mb-4">
                <input id="in-name" type="text" placeholder="Exercício" class="col-span-2 p-3 rounded-xl bg-black/40 border border-white/10 outline-none text-xs text-white">
                <input id="in-weight" type="text" placeholder="Peso (kg)" class="p-3 rounded-xl bg-black/40 border border-white/10 outline-none text-xs text-white">
                <input id="in-reps" type="text" placeholder="Séries (3x12)" class="p-3 rounded-xl bg-black/40 border border-white/10 outline-none text-xs text-white">
                <input id="in-notes" type="text" placeholder="Observações" class="col-span-2 p-3 rounded-xl bg-black/40 border border-white/10 outline-none text-xs text-white">
            </div>
            <button id="btn-save" onclick="saveWorkout()" class="w-full bg-blue-600 hover:bg-blue-500 p-4 rounded-xl font-black uppercase text-xs tracking-widest transition-all">Salvar Exercício</button>
            <button id="btn-cancel" onclick="cancelEdit()" class="hidden w-full mt-2 text-[10px] text-gray-500 uppercase font-bold underline">Cancelar Edição</button>
        </div>

        <div id="list-workouts" class="space-y-4 mb-8"></div>
        
        <button onclick="finishSession()" class="w-full bg-green-600 p-5 rounded-2xl font-black uppercase italic shadow-lg shadow-green-900/20 mb-10 active:scale-95 transition-all">Finalizar Treino de Hoje</button>
        
        <div class="mt-10 pt-8 border-t border-white/10">
            <h3 class="text-xs font-black uppercase mb-6 text-blue-500 italic text-center">Frequência Semanal</h3>
            <div class="glass p-4 rounded-3xl mb-8"><canvas id="freqChart" height="150"></canvas></div>
            
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xs font-black uppercase text-gray-500 italic">Histórico</h3>
                <button onclick="clearHistory()" class="text-[9px] text-red-500 font-bold uppercase underline">Limpar Tudo</button>
            </div>
            <div id="history-list" class="space-y-2"></div>
        </div>

        <footer class="mt-20 py-8 border-t border-white/5 text-center">
            <p class="text-[9px] font-black text-gray-600 uppercase tracking-widest mb-4 italic">Developed by</p>
            <div class="flex flex-col gap-2">
                <a href="https://instagram.com/systemsjc_" target="_blank" class="text-blue-500 font-bold text-xs hover:text-white transition-colors tracking-tighter italic">@SYSTEMSJC_</a>
                <a href="https://instagram.com/ojeanvianna_" target="_blank" class="text-gray-400 font-bold text-[10px] hover:text-white transition-colors tracking-tighter">@OJEANVIANNA_</a>
            </div>
        </footer>
    </div>

    <script>
        const SUPABASE_URL = 'https://dazgtsobkykxwsvbmjfn.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRhemd0c29ia3lreHdzdmJtamZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxOTg4NTYsImV4cCI6MjA4ODc3NDg1Nn0.Ci_Hzqzf9Px8LTg7dNOXcu1dcTzBYWioH2yaFP2h6rI';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let currentLetter = 'A';
        let editingId = null;
        let myChart = null;

        async function handleSignIn() {
            const user = document.getElementById('login-user').value.trim().replace('@','');
            const pass = document.getElementById('login-pass').value;
            const { data, error } = await _supabase.auth.signInWithPassword({ email: `${user}@sanjafit.com`, password: pass });
            if(error) return alert("Verifique Usuário e Senha.");
            initApp(data.user);
        }

        async function handleSignUp() {
            const user = document.getElementById('login-user').value.trim().replace('@','');
            const pass = document.getElementById('login-pass').value;
            const { error } = await _supabase.auth.signUp({ email: `${user}@sanjafit.com`, password: pass, options: { data: { instagram: `@${user}` } } });
            if(error) alert(error.message); else alert("Conta criada! Entre agora.");
        }

        function initApp(user) {
            currentUser = user;
            document.getElementById('section-login').classList.add('hidden');
            document.getElementById('section-app').classList.remove('hidden');
            document.getElementById('display-name').innerText = user.user_metadata.instagram || "@Atleta";
            loadWorkouts();
            updateStats();
        }

        async function saveWorkout() {
            const name = document.getElementById('in-name').value;
            const weight = document.getElementById('in-weight').value;
            const reps = document.getElementById('in-reps').value;
            const notes = document.getElementById('in-notes').value;
            if(!name) return alert("O nome do exercício é obrigatório!");

            const payload = { user_id: currentUser.id, category: currentLetter, exercise_name: name, weight: String(weight), reps: String(reps), notes: notes };

            if(editingId) {
                await _supabase.from('workouts').update(payload).eq('id', editingId);
                editingId = null;
            } else {
                await _supabase.from('workouts').insert([payload]);
            }
            
            cancelEdit();
            loadWorkouts();
        }

        async function loadWorkouts() {
            const { data } = await _supabase.from('workouts').select('*').eq('user_id', currentUser.id).eq('category', currentLetter).order('created_at');
            document.getElementById('list-workouts').innerHTML = (data || []).map(ex => `
                <div class="glass p-5 rounded-2xl border border-white/5 flex justify-between items-center">
                    <div class="flex-grow">
                        <h4 class="font-black uppercase text-sm italic italic tracking-tighter">${ex.exercise_name}</h4>
                        <p class="text-[10px] text-blue-500 font-bold mt-1 italic">${ex.weight}kg • ${ex.reps}</p>
                        ${ex.notes ? `<p class="text-[9px] text-gray-500 mt-2 italic border-l border-blue-500 pl-2">Obs: ${ex.notes}</p>` : ''}
                    </div>
                    <div class="flex gap-4 ml-4">
                        <button onclick='editEx(${JSON.stringify(ex)})' class="text-blue-400 text-[10px] font-black uppercase italic underline">Editar</button>
                        <button onclick="deleteEx('${ex.id}')" class="text-red-900 text-[10px] font-black uppercase italic">Deletar</button>
                    </div>
                </div>
            `).join('') || '<p class="text-center py-5 text-gray-700 text-xs italic">Treino Vazio</p>';
        }

        function editEx(ex) {
            editingId = ex.id;
            document.getElementById('in-name').value = ex.exercise_name;
            document.getElementById('in-weight').value = ex.weight;
            document.getElementById('in-reps').value = ex.reps;
            document.getElementById('in-notes').value = ex.notes || '';
            document.getElementById('btn-save').innerText = "Atualizar Exercício";
            document.getElementById('btn-save').classList.replace('bg-blue-600', 'bg-yellow-600');
            document.getElementById('btn-cancel').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEdit() {
            editingId = null;
            document.getElementById('in-name').value = '';
            document.getElementById('in-weight').value = '';
            document.getElementById('in-reps').value = '';
            document.getElementById('in-notes').value = '';
            document.getElementById('btn-save').innerText = "Salvar Exercício";
            document.getElementById('btn-save').classList.replace('bg-yellow-600', 'bg-blue-600');
            document.getElementById('btn-cancel').classList.add('hidden');
        }

        async function updateStats() {
            const { data } = await _supabase.from('workout_history').select('*').eq('user_id', currentUser.id).order('completed_at', {ascending: false});
            const count = data ? data.length : 0;
            const percent = Math.min((count/20)*100, 100);
            document.getElementById('bar-goal').style.width = percent + '%';
            document.getElementById('txt-goal').innerText = `${count}/20`;
            document.getElementById('t1').classList.toggle('trophy-on', count >= 1);
            document.getElementById('t2').classList.toggle('trophy-on', count >= 10);
            document.getElementById('t3').classList.toggle('trophy-on', count >= 20);
            renderChart(data || []);

            document.getElementById('history-list').innerHTML = (data || []).slice(0, 5).map(h => `
                <div class="flex justify-between items-center text-[10px] bg-white/5 p-3 rounded-lg font-bold italic">
                    <span class="text-blue-500 uppercase tracking-widest">Sessão ${h.category}</span>
                    <span class="text-gray-500">${new Date(h.completed_at).toLocaleDateString()}</span>
                </div>
            `).join('') || '<p class="text-[9px] text-gray-600 italic">Nenhum histórico.</p>';
        }

        function renderChart(history) {
            const counts = [0, 0, 0, 0];
            history.forEach(h => {
                const day = new Date(h.completed_at).getDate();
                const week = Math.min(Math.floor((day - 1) / 7), 3);
                counts[week]++;
            });
            const ctx = document.getElementById('freqChart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'line',
                data: { labels: ['S1', 'S2', 'S3', 'S4'], datasets: [{ data: counts, borderColor: '#3b82f6', tension: 0.4, fill: true, backgroundColor: 'rgba(59,130,246,0.1)' }] },
                options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: '#222' } } } }
            });
        }

        async function finishSession() {
            await _supabase.from('workout_history').insert([{ user_id: currentUser.id, category: currentLetter }]);
            alert("Boa! Treino concluído."); updateStats();
        }

        async function clearHistory() { if(confirm("Apagar todo o histórico de treinos?")) { await _supabase.from('workout_history').delete().eq('user_id', currentUser.id); updateStats(); } }
        async function deleteEx(id) { if(confirm("Remover exercício?")) { await _supabase.from('workouts').delete().eq('id', id); loadWorkouts(); } }
        function changeLetter(l, btn) { currentLetter = l; document.getElementById('label-letter').innerText = l; document.querySelectorAll('.letter-btn').forEach(b => b.classList.remove('active-tab')); btn.classList.add('active-tab'); cancelEdit(); loadWorkouts(); }
        function switchView(v) { document.getElementById('view-workouts').classList.toggle('hidden', v !== 'workouts'); document.getElementById('nav-workouts').classList.toggle('active-view', v === 'workouts'); }
    </script>
</body>
</html>
