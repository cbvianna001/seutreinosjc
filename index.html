<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SanjaFit | Elite Professional</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22SanjaFit%22,%22short_name%22:%22SanjaFit%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22#000000%22,%22theme_color%22:%22#3b82f6%22}">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.6)), 
                        url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=2070&auto=format&fit=crop');
            background-size: cover; background-position: center; background-attachment: fixed;
            color: white; overflow-x: hidden;
        }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .active-tab { background: #3b82f6 !important; box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }
        .active-view { border-bottom: 3px solid #3b82f6; color: white !important; }
        .skeleton { position: relative; overflow: hidden; background: rgba(255,255,255,0.05); border-radius: 1rem; }
        .skeleton::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent); animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 100% { transform: translateX(100%); } }
        .app-logo { font-size: 2rem; font-weight: 900; font-style: italic; text-transform: uppercase; color: #3b82f6; }
        .badge-off { filter: grayscale(1); opacity: 0.1; }
        .member-counter { font-family: 'Orbitron', sans-serif; background: #000; color: #3b82f6; padding: 5px 12px; border-radius: 8px; border: 1px solid #1e3a8a; }
        
        /* Overlay de Sucesso Lottie */
        #success-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center; flex-direction: column; }
    </style>
</head>
<body>

    <div id="success-overlay">
        <lottie-player id="lottie-anim" src="https://assets10.lottiefiles.com/packages/lf20_pqnfmone.json" background="transparent" speed="1" style="width: 300px; height: 300px;" autoplay></lottie-player>
        <h2 class="text-2xl font-black italic uppercase text-blue-500 mt-4">Missão Cumprida!</h2>
    </div>

    <div id="section-login" class="flex flex-col items-center justify-center min-h-screen p-6">
        <div class="flex items-center gap-3 mb-8"><span class="text-4xl">🏋️‍♂️</span><h1 class="app-logo">Sanja<span>Fit</span></h1></div>
        <div class="glass p-8 rounded-[2.5rem] w-full max-w-md">
            <input id="login-user" type="text" placeholder="@seu_instagram" class="w-full p-4 mb-4 rounded-xl bg-black/40 border border-white/10 outline-none">
            <input id="login-pass" type="password" placeholder="Senha" class="w-full p-4 mb-8 rounded-xl bg-black/40 border border-white/10 outline-none">
            <button onclick="handleSignIn()" class="w-full bg-blue-600 p-4 rounded-xl font-black uppercase tracking-widest active:scale-95">Acessar</button>
            <button onclick="handleSignUp()" class="w-full mt-6 text-[10px] text-gray-400 font-bold uppercase text-center">Criar Conta</button>
        </div>
    </div>

    <div id="section-app" class="hidden max-w-2xl mx-auto p-4 w-full">
        <header class="flex justify-between items-center py-6">
            <div class="app-logo text-lg">Sanja<span>Fit</span></div>
            <div class="member-counter text-xs" id="member-count">0000</div>
            <button onclick="handleSignOut()" class="text-red-500 text-[10px] font-bold uppercase border border-red-500/20 px-3 py-1 rounded-lg">Sair</button>
        </header>

        <nav class="flex border-b border-white/10 mb-6 font-black uppercase text-[9px] tracking-widest text-center text-gray-500">
            <button onclick="switchView('workouts')" id="nav-workouts" class="flex-1 py-4 active-view">Treinos</button>
            <button onclick="switchView('evolution')" id="nav-evolution" class="flex-1 py-4">Evolução</button>
            <button onclick="switchView('macros')" id="nav-macros" class="flex-1 py-4">Dieta</button>
        </nav>

        <div id="view-workouts" class="space-y-6">
            <div class="glass p-4 rounded-3xl flex justify-around items-center">
                <div id="badge-10" class="badge-off flex flex-col items-center gap-1 text-[8px] font-bold text-center"><span>🥉</span>10 Treinos</div>
                <div id="badge-50" class="badge-off flex flex-col items-center gap-1 text-[8px] font-bold text-center"><span>🥈</span>50 Treinos</div>
                <div id="badge-100" class="badge-off flex flex-col items-center gap-1 text-[8px] font-bold text-center"><span>🥇</span>ELITE</div>
            </div>

            <div class="grid grid-cols-4 gap-2">
                <button onclick="changeLetter('A', this)" class="letter-btn p-4 rounded-xl glass font-black active-tab">A</button>
                <button onclick="changeLetter('B', this)" class="letter-btn p-4 rounded-xl glass font-black">B</button>
                <button onclick="changeLetter('C', this)" class="letter-btn p-4 rounded-xl glass font-black">C</button>
                <button onclick="changeLetter('D', this)" class="letter-btn p-4 rounded-xl glass font-black">D</button>
            </div>

            <div id="list-workouts" class="space-y-3"></div>
            <button onclick="finishSession()" class="w-full bg-green-600 p-4 rounded-2xl font-black uppercase italic shadow-lg active:scale-95">Registrar Treino <span id="finish-label">A</span></button>

            <div class="pt-6 border-t border-white/10">
                <div class="flex justify-between items-center mb-4 text-[10px] font-black uppercase italic text-gray-400">
                    <span>Histórico Recente</span>
                    <select onchange="updateStats(this.value)" class="bg-black border border-white/10 p-1 rounded">
                        <option value="ALL">TODOS</option>
                        <option value="A">SÓ A</option><option value="B">SÓ B</option><option value="C">SÓ C</option><option value="D">SÓ D</option>
                    </select>
                </div>
                <div id="history-list" class="space-y-2"></div>
            </div>
        </div>

        <div id="view-evolution" class="hidden space-y-6">
            <div class="glass p-4 rounded-3xl">
                <h3 class="text-[10px] font-black text-blue-500 mb-4 italic">Análise de Força</h3>
                <select id="select-exercise-chart" onchange="loadLoadChart(this.value)" class="w-full bg-black text-[10px] mb-4 p-2 rounded border border-white/10">
                    <option value="">Selecione o Exercício</option>
                </select>
                <canvas id="loadChart" height="150"></canvas>
            </div>
            <div class="glass p-6 rounded-[2rem] text-center">
                <h3 class="text-xs font-black uppercase text-blue-500 mb-4 italic">Postar Shape</h3>
                <input type="file" id="file-photo" accept="image/*" class="text-[10px] mb-4">
                <input type="number" id="input-weight-evo" placeholder="Peso Atual (kg)" class="w-full p-3 rounded-lg bg-white/5 outline-none text-xs mb-4">
                <button onclick="uploadEvolution()" class="w-full bg-blue-600 p-3 rounded-lg font-black text-xs">UPLOAD</button>
            </div>
            <div id="list-gallery" class="grid grid-cols-1 gap-4"></div>
        </div>

        <div id="view-macros" class="hidden space-y-6">
            <div class="glass p-6 rounded-[2rem]">
                <h3 class="text-xs font-black uppercase text-blue-500 mb-6 italic text-center">Calculadora de Macros</h3>
                <div class="space-y-4">
                    <input id="macro-weight" type="number" placeholder="Seu Peso (kg)" class="w-full p-4 rounded-xl bg-white/5 outline-none">
                    <select id="macro-goal" class="w-full p-4 rounded-xl bg-black border border-white/10">
                        <option value="lose">Emagrecer</option>
                        <option value="gain">Ganhar Massa</option>
                    </select>
                    <button onclick="calculateMacros()" class="w-full bg-blue-600 p-4 rounded-xl font-black uppercase text-xs">Calcular</button>
                </div>
                <div id="macro-result" class="hidden mt-8 grid grid-cols-3 gap-2 text-center text-[10px] font-black italic">
                    <div class="p-3 bg-blue-500/10 rounded-xl">PROT <p id="res-p" class="text-blue-500 text-lg"></p></div>
                    <div class="p-3 bg-green-500/10 rounded-xl">CARB <p id="res-c" class="text-green-500 text-lg"></p></div>
                    <div class="p-3 bg-yellow-500/10 rounded-xl">GORD <p id="res-g" class="text-yellow-500 text-lg"></p></div>
                </div>
            </div>
            <div class="glass p-6 rounded-[2rem]">
                <h3 class="text-[10px] font-black uppercase text-gray-400 mb-4 italic text-center">Top 3 SanjaFit</h3>
                <div id="ranking-list" class="space-y-3 text-xs font-bold"></div>
            </div>
        </div>

        <footer class="mt-10 py-6 text-center italic text-[9px] text-gray-600">
            Developed by <a href="https://instagram.com/systemsjc_" class="text-blue-500">@SYSTEMSJC_</a> | <a href="https://instagram.com/ojeanvianna_" class="text-gray-400">@OJEANVIANNA_</a>
        </footer>
    </div>

    <script>
        const SUPABASE_URL = 'https://dazgtsobkykxwsvbmjfn.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRhemd0c29ia3lreHdzdmJtamZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxOTg4NTYsImV4cCI6MjA4ODc3NDg1Nn0.Ci_Hzqzf9Px8LTg7dNOXcu1dcTzBYWioH2yaFP2h6rI';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null, currentLetter = 'A', loadChart;

        // ANIMAÇÃO DE SUCESSO
        function playSuccess() {
            const overlay = document.getElementById('success-overlay');
            overlay.style.display = 'flex';
            setTimeout(() => overlay.style.display = 'none', 2500);
        }

        // AUTH
        async function handleSignIn() {
            const user = document.getElementById('login-user').value.trim().replace('@','');
            const pass = document.getElementById('login-pass').value;
            const { data, error } = await _supabase.auth.signInWithPassword({ email: `${user}@sanjafit.com`, password: pass });
            if(error) return alert("Erro no Login.");
            initApp(data.user);
        }

        async function handleSignOut() {
            await _supabase.auth.signOut(); localStorage.clear(); window.location.reload();
        }

        window.onload = async () => {
            const { data: { user } } = await _supabase.auth.getUser();
            if(user) initApp(user);
            updateMemberCount();
        };

        function initApp(user) {
            currentUser = user;
            document.getElementById('section-login').classList.add('hidden');
            document.getElementById('section-app').classList.remove('hidden');
            loadWorkouts(); updateStats(); loadGallery(); loadRanking();
        }

        // --- CALCULADORA ---
        function calculateMacros() {
            const w = parseFloat(document.getElementById('macro-weight').value);
            const goal = document.getElementById('macro-goal').value;
            if(!w) return alert("Peso?");
            let p = w*2, g = w*0.8, c = goal === 'lose' ? w*1.5 : w*4;
            document.getElementById('res-p').innerText = p.toFixed(0) + 'g';
            document.getElementById('res-c').innerText = c.toFixed(0) + 'g';
            document.getElementById('res-g').innerText = g.toFixed(0) + 'g';
            document.getElementById('macro-result').classList.remove('hidden');
        }

        // --- RANKING ---
        async function loadRanking() {
            const { data } = await _supabase.from('workout_history').select('user_id');
            const counts = data.reduce((acc, c) => { acc[c.user_id] = (acc[c.user_id] || 0) + 1; return acc; }, {});
            const sorted = Object.entries(counts).sort((a,b) => b[1] - a[1]).slice(0, 3);
            document.getElementById('ranking-list').innerHTML = sorted.map((r, i) => `
                <div class="flex justify-between items-center p-3 glass rounded-xl">
                    <span>${i+1}º Atleta</span><span class="text-blue-500 font-black">${r[1]} Treinos</span>
                </div>`).join('');
        }

        // --- TREINOS ---
        async function loadWorkouts() {
            const { data } = await _supabase.from('workouts').select('*').eq('user_id', currentUser.id).eq('category', currentLetter).order('created_at');
            const select = document.getElementById('select-exercise-chart');
            select.innerHTML = `<option value="">Analisar Evolução de...</option>` + (data || []).map(ex => `<option value="${ex.exercise_name}">${ex.exercise_name}</option>`).join('');
            
            document.getElementById('list-workouts').innerHTML = (data || []).map(ex => `
                <div class="glass p-4 rounded-2xl flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <input type="checkbox" class="w-5 h-5 rounded-full border-2 border-blue-500 bg-transparent checked:bg-blue-600">
                        <div><h4 class="font-black uppercase text-xs italic">${ex.exercise_name}</h4><p class="text-[9px] text-blue-500 font-bold">${ex.weight}kg • ${ex.reps}</p></div>
                    </div>
                </div>`).join('') || '<p class="text-center py-4 text-gray-700 text-[10px] italic">Nenhum exercício.</p>';
        }

        async function updateStats(filter = 'ALL') {
            let q = _supabase.from('workout_history').select('*').eq('user_id', currentUser.id).order('completed_at', {ascending: false});
            if(filter !== 'ALL') q = q.eq('category', filter);
            const { data } = await q;
            const total = data.length;
            document.getElementById('badge-10').classList.toggle('badge-off', total < 10);
            document.getElementById('badge-50').classList.toggle('badge-off', total < 50);
            document.getElementById('badge-100').classList.toggle('badge-off', total < 100);
            document.getElementById('history-list').innerHTML = (data || []).slice(0, 5).map(h => `
                <div class="flex justify-between items-center p-3 glass rounded-xl text-[9px] font-bold italic">
                    <span>Sessão ${h.category}</span><span>${new Date(h.completed_at).toLocaleDateString()}</span>
                </div>`).join('');
        }

        async function loadLoadChart(exName) {
            if(!exName) return;
            const { data } = await _supabase.from('workouts').select('*').eq('user_id', currentUser.id).eq('exercise_name', exName).order('created_at');
            const ctx = document.getElementById('loadChart').getContext('2d');
            if(loadChart) loadChart.destroy();
            loadChart = new Chart(ctx, {
                type: 'line',
                data: { labels: data.map(d => new Date(d.created_at).toLocaleDateString()), datasets: [{ data: data.map(d => parseFloat(d.weight)), borderColor: '#3b82f6', tension: 0.3 }] },
                options: { plugins: { legend: { display: false } } }
            });
        }

        async function uploadEvolution() {
            const file = document.getElementById('file-photo').files[0];
            const weight = document.getElementById('input-weight-evo').value;
            if(!file || !weight) return alert("Dados incompletos!");
            const compressedFile = await imageCompression(file, { maxSizeMB: 0.2, maxWidthOrHeight: 1024 });
            const name = `${Date.now()}_shape.jpg`;
            await _supabase.storage.from('shapes').upload(name, compressedFile);
            const { data: urlData } = _supabase.storage.from('shapes').getPublicUrl(name);
            await _supabase.from('evolution_gallery').insert([{ user_id: currentUser.id, photo_url: urlData.publicUrl, body_weight: weight }]);
            playSuccess(); loadGallery();
        }

        async function loadGallery() {
            const { data } = await _supabase.from('evolution_gallery').select('*').eq('user_id', currentUser.id).order('created_at', {ascending: false});
            document.getElementById('list-gallery').innerHTML = (data || []).map(p => `<div class="glass rounded-[2rem] overflow-hidden"><img src="${p.photo_url}" class="w-full h-48 object-cover"></div>`).join('');
        }

        async function updateMemberCount() {
            const { data } = await _supabase.from('workouts').select('user_id');
            const unique = [...new Set((data || []).map(u => u.user_id))].length;
            document.getElementById('member-count').innerText = String(unique).padStart(4, '0');
        }

        function switchView(v) {
            document.getElementById('view-workouts').classList.toggle('hidden', v !== 'workouts');
            document.getElementById('view-evolution').classList.toggle('hidden', v !== 'evolution');
            document.getElementById('view-macros').classList.toggle('hidden', v !== 'macros');
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-view'));
            document.getElementById('nav-' + v).classList.add('active-view');
        }

        function changeLetter(l, btn) { currentLetter = l; document.getElementById('finish-label').innerText = l; document.getElementById('label-letter').innerText = l; document.querySelectorAll('.letter-btn').forEach(b => b.classList.remove('active-tab')); btn.classList.add('active-tab'); loadWorkouts(); }
        async function finishSession() { await _supabase.from('workout_history').insert([{ user_id: currentUser.id, category: currentLetter }]); playSuccess(); updateStats(); loadRanking(); }
        function startRestTimer() { let s = 30; const d = document.getElementById('timer-display'); const t = setInterval(() => { s--; d.innerText = `00:${s < 10 ? '0' + s : s}`; if (s <= 0) { clearInterval(t); d.innerText = "00:30"; alert("Fim do Descanso!"); } }, 1000); }
        async function handleSignUp() {
            const user = document.getElementById('login-user').value.trim().replace('@','');
            const pass = document.getElementById('login-pass').value;
            await _supabase.auth.signUp({ email: `${user}@sanjafit.com`, password: pass, options: { data: { instagram: `@${user}` } } });
            alert("Conta Criada! Faça o login.");
        }
    </script>
</body>
</html>
