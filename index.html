<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SanjaFit | Arena Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #000; color: #fff; min-height: 100vh; overflow-x: hidden; }
        .nav-bottom { background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); border-top: 1px solid #262626; position: fixed; bottom: 0; width: 100%; height: 70px; z-index: 1000; display: grid; grid-template-columns: repeat(4, 1fr); align-items: center; justify-items: center; }
        .active-nav { color: #3b82f6; transform: scale(1.1); }
        .glass-card { background: #121212; border: 1px solid #262626; border-radius: 12px; padding: 15px; }
        .modal-full { display: none; position: fixed; inset: 0; background: #000; z-index: 2000; padding: 20px; overflow-y: auto; flex-direction: column; }
        .btn-blue { background: #0095f6; border-radius: 8px; font-weight: 700; width: 100%; padding: 12px; text-transform: uppercase; font-size: 11px; color: white; }
        input, select, textarea { background: #121212 !important; border: 1px solid #262626 !important; color: white !important; border-radius: 8px; padding: 12px; width: 100%; margin-bottom: 10px; }
        .workout-done { opacity: 0.3; text-decoration: line-through; border-color: #059669 !important; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-24">

    <div id="modal-user-profile" class="modal-full">
        <div class="flex justify-between items-center mb-6">
            <h2 id="v-user-handle" class="text-sm font-black text-blue-500 uppercase italic">@atleta</h2>
            <button onclick="closeUserProfile()" class="text-2xl">✕</button>
        </div>
        <div class="space-y-6">
            <div class="flex items-center gap-6">
                <div class="w-20 h-20 rounded-full border border-zinc-800 overflow-hidden bg-zinc-900 flex items-center justify-center">
                    <img id="v-user-avatar" src="" class="w-full h-full object-cover hidden">
                    <span id="v-user-icon" class="text-2xl text-zinc-600">👤</span>
                </div>
                <div class="flex flex-1 justify-around text-center uppercase font-black text-[10px]">
                    <div><p id="v-user-photos-count" class="text-sm">0</p>Posts</div>
                    <div><p id="v-user-followers-count" class="text-sm">0</p>Amigos</div>
                </div>
            </div>
            <div id="v-user-follow-area" class="min-h-[45px]"></div>
            <div id="v-user-gallery" class="grid grid-cols-3 gap-1"></div>
        </div>
    </div>

    <div id="section-app" class="hidden max-w-lg mx-auto">
        <header class="p-4 border-b border-[#262626] flex justify-between items-center sticky top-0 bg-black z-50">
            <h1 class="text-xl font-black italic tracking-tighter uppercase italic">Sanja<span class="text-blue-500">Fit</span></h1>
            <button onclick="handleSignOut()" class="text-[10px] font-bold text-red-500 uppercase">Sair</button>
        </header>

        <div id="view-championship" class="p-4 space-y-3">
            <div id="ranking-list" class="space-y-3"></div>
        </div>

        <div id="view-search" class="hidden p-4">
            <input id="search-input" type="text" oninput="filterAthletes()" placeholder="Pesquisar @atleta..." class="mb-4">
            <div id="search-results" class="space-y-2"></div>
        </div>

        <div id="view-stats" class="hidden p-4 space-y-6">
            <div class="flex gap-2 overflow-x-auto pb-2" id="tabs-container"></div>
            
            <div class="glass-card" id="form-workout">
                <input id="in-name" type="text" placeholder="Nome do Exercício">
                <div class="flex gap-2"><input id="in-weight" type="number" placeholder="Kg"><input id="in-reps" type="text" placeholder="Reps"></div>
                <button id="btn-save-workout" onclick="saveWorkout()" class="btn-blue">Salvar</button>
                <button id="btn-cancel-edit" onclick="cancelEditWorkout()" class="hidden w-full text-[10px] mt-2 text-zinc-500 underline uppercase">Cancelar</button>
            </div>

            <button onclick="shareWorkoutUI()" class="w-full bg-blue-900/20 text-blue-500 p-3 rounded-lg text-[10px] font-black uppercase border border-blue-500/20">📤 Enviar Ficha para Amigo</button>
            <div id="list-workouts" class="space-y-2"></div>
        </div>

        <div id="view-profile" class="hidden p-6 space-y-6">
            <div class="flex items-center gap-6">
                <div class="relative w-24 h-24 rounded-full border-2 border-blue-500 overflow-hidden bg-zinc-900">
                    <img id="my-avatar-img" src="" class="w-full h-full object-cover hidden">
                    <button onclick="document.getElementById('file-avatar').click()" class="absolute bottom-0 right-0 bg-blue-500 p-1.5 rounded-full text-[10px]">📷</button>
                    <input type="file" id="file-avatar" accept="image/*" class="hidden" onchange="uploadAvatar()">
                </div>
                <div class="flex flex-1 justify-around text-center uppercase font-black text-[9px]">
                    <div><p id="my-photos-count" class="text-sm">0</p>Posts</div>
                    <div><p id="my-followers-count" class="text-sm">0</p>Amigos</div>
                </div>
            </div>
            <div>
                <h2 id="my-name" class="font-black text-xl italic uppercase">Atleta</h2>
                <div class="flex gap-2 mt-4">
                    <button onclick="toggleEdit()" class="flex-1 bg-zinc-800 p-2 rounded text-[10px] font-bold uppercase">Configurar Perfil</button>
                </div>
            </div>
            <div id="edit-form" class="hidden glass-card">
                <input id="edit-name" type="text" placeholder="Nome Real">
                <textarea id="edit-bio" placeholder="Sua bio"></textarea>
                <button onclick="saveProfile()" class="btn-blue">Salvar Alterações</button>
            </div>
            <button onclick="document.getElementById('file-post').click()" class="w-full btn-blue p-4 font-black italic">POSTAR EVOLUÇÃO 🔥</button>
            <input type="file" id="file-post" accept="image/*" class="hidden" onchange="uploadEvolution()">
            <div id="my-gallery" class="grid grid-cols-3 gap-1"></div>
        </div>

        <nav class="nav-bottom">
            <button onclick="switchView('championship')" id="nav-championship" class="active-nav text-2xl">🏆</button>
            <button onclick="switchView('search')" id="nav-search" class="text-2xl">🔍</button>
            <button onclick="switchView('stats')" id="nav-stats" class="text-2xl">📋</button>
            <button onclick="switchView('profile')" id="nav-profile" class="text-2xl">👤</button>
        </nav>
    </div>

    <div id="section-login" class="hidden flex flex-col items-center justify-center min-h-screen p-6 text-center">
        <h1 class="text-5xl font-black italic mb-10 tracking-tighter uppercase italic text-white">SANJA<span class="text-blue-500">FIT</span></h1>
        <div class="w-full max-w-sm space-y-4">
            <input id="login-user" type="text" placeholder="@seu_instagram">
            <input id="login-pass" type="password" placeholder="Senha">
            <button onclick="handleSignIn()" class="btn-blue">Entrar na Arena</button>
            <button onclick="handleSignUp()" class="text-blue-500 text-[10px] font-bold uppercase mt-4 italic underline">Criar Nova Conta</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://dazgtsobkykxwsvbmjfn.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRhemd0c29ia3lreHdzdmJtamZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxOTg4NTYsImV4cCI6MjA4ODc3NDg1Nn0.Ci_Hzqzf9Px8LTg7dNOXcu1dcTzBYWioH2yaFP2h6rI';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null, currentLetter = 'A', allProfiles = [], editingWorkoutId = null;

        window.onload = async () => {
            const { data: { user } } = await _supabase.auth.getUser();
            if(user) { currentUser = user; initApp(); } 
            else { document.getElementById('section-login').classList.remove('hidden'); }
        };

        async function initApp() {
            document.getElementById('section-login').classList.add('hidden');
            document.getElementById('section-app').classList.remove('hidden');
            renderTabs(); await loadRanking(); await loadMyProfile(); loadWorkouts();
        }

        // --- RANKING (FIXED CLIQUE) ---
        async function loadRanking() {
            const { data } = await _supabase.from('profiles').select('*').order('xp', {ascending: false});
            allProfiles = data || [];
            document.getElementById('ranking-list').innerHTML = allProfiles.map((p, i) => `
                <div class="glass-card flex items-center justify-between" onclick="openUserProfile('${p.id}')">
                    <div class="flex items-center gap-3">
                        <span class="text-[10px] font-black">${i+1}º</span>
                        <div class="w-10 h-10 rounded-full border border-zinc-800 overflow-hidden bg-zinc-900 flex items-center justify-center">
                            <img src="${p.avatar_url || ''}" class="w-full h-full object-cover ${p.avatar_url ? '' : 'hidden'}">
                        </div>
                        <p class="text-xs uppercase font-bold italic">${p.instagram}</p>
                    </div>
                    <span class="text-blue-500 font-black text-xs">${p.xp || 0} XP</span>
                </div>`).join('');
        }

        // --- PERFIL AMIGOS (FIXED) ---
        async function openUserProfile(userId) {
            try {
                const { data: p } = await _supabase.from('profiles').select('*').eq('id', userId).single();
                if(!p) return;
                document.getElementById('v-user-handle').innerText = p.instagram;
                document.getElementById('v-user-name').innerText = p.full_name || "Atleta";
                document.getElementById('v-user-bio').innerText = p.bio || "";
                
                const avatar = document.getElementById('v-user-avatar');
                const avatarIcon = document.getElementById('v-user-icon');
                if(p.avatar_url) { avatar.src = p.avatar_url; avatar.classList.remove('hidden'); avatarIcon.classList.add('hidden'); }
                else { avatar.classList.add('hidden'); avatarIcon.classList.remove('hidden'); }

                const { count: posts } = await _supabase.from('evolution_gallery').select('*', {count:'exact', head:true}).eq('user_id', userId);
                const { count: friends } = await _supabase.from('connections').select('*', {count:'exact', head:true}).eq('following_id', userId).eq('status', 'accepted');
                document.getElementById('v-user-photos-count').innerText = posts || 0;
                document.getElementById('v-user-followers-count').innerText = friends || 0;

                const { data: phs } = await _supabase.from('evolution_gallery').select('photo_url').eq('user_id', userId).order('created_at', {ascending: false});
                document.getElementById('v-user-gallery').innerHTML = (phs || []).map(ph => `<img src="${ph.photo_url}" class="aspect-square object-cover rounded">`).join('');

                const { data: conn } = await _supabase.from('connections').select('*').or(`and(follower_id.eq.${currentUser.id},following_id.eq.${userId}),and(follower_id.eq.${userId},following_id.eq.${currentUser.id})`).single();
                
                if(userId !== currentUser.id) {
                    const label = conn ? (conn.status === 'accepted' ? 'Amigo ✅ (Remover)' : 'Pendente ⏳') : 'Seguir Atleta 🔥';
                    document.getElementById('v-user-follow-area').innerHTML = `<button onclick="toggleFollow('${userId}', ${!!conn})" class="btn-blue ${conn?'bg-zinc-800':''}">${label}</button>`;
                } else { document.getElementById('v-user-follow-area').innerHTML = ''; }

                document.getElementById('modal-user-profile').style.display = 'flex';
            } catch (err) { console.error(err); }
        }

        async function toggleFollow(id, exists) {
            if(exists) await _supabase.from('connections').delete().match({ follower_id: currentUser.id, following_id: id });
            else await _supabase.from('connections').insert([{ follower_id: currentUser.id, following_id: id, status: 'accepted' }]);
            openUserProfile(id); loadMyProfile();
        }

        // --- TREINOS (CONCLUIR E SHARE FIXED) ---
        async function loadWorkouts() {
            const list = document.getElementById('list-workouts');
            if(currentLetter === 'SHARED') {
                const { data } = await _supabase.from('shared_workouts').select('*, profiles!shared_workouts_sender_id_fkey(instagram)').eq('receiver_id', currentUser.id).eq('status', 'pending');
                list.innerHTML = (data || []).map(s => `<div class="glass-card flex justify-between items-center mb-2"><span class="text-xs italic">De: ${s.profiles.instagram}</span><button onclick="acceptWorkout('${s.id}')" class="bg-green-600 px-3 py-1 rounded text-[10px] font-black">IMPORTAR</button></div>`).join('') || '<p class="text-center py-10 opacity-30 text-xs">Sem treinos novos.</p>';
            } else {
                const { data } = await _supabase.from('workouts').select('*').eq('user_id', currentUser.id).eq('category', currentLetter).order('created_at');
                list.innerHTML = (data || []).map(ex => `
                    <div class="glass-card flex justify-between items-center mb-2 ${ex.done ? 'workout-done' : ''}" id="ex-${ex.id}">
                        <div class="flex items-center gap-3">
                            <input type="checkbox" onchange="toggleWorkoutDone('${ex.id}', this.checked)" ${ex.done ? 'checked' : ''} class="w-5 h-5 accent-blue-500">
                            <div><b>${ex.exercise_name}</b><p class="text-[10px] text-blue-500">${ex.weight}kg x ${ex.reps}</p></div>
                        </div>
                        <div class="flex gap-3">
                            <button onclick='startEditWorkout(${JSON.stringify(ex)})' class="text-blue-500 text-[10px] underline">EDITAR</button>
                            <button onclick="deleteEx('${ex.id}')" class="text-red-900 font-bold">X</button>
                        </div>
                    </div>`).join('');
            }
        }

        async function toggleWorkoutDone(id, status) {
            await _supabase.from('workouts').update({ done: status }).eq('id', id);
            document.getElementById('ex-'+id).classList.toggle('workout-done', status);
            if(status) {
                const { data } = await _supabase.from('profiles').select('xp').eq('id', currentUser.id).single();
                await _supabase.from('profiles').update({ xp: (data.xp || 0) + 1 }).eq('id', currentUser.id);
            }
        }

        async function shareWorkoutUI() {
            const { data: friends } = await _supabase.from('connections').select('following_id, profiles!connections_following_id_fkey(instagram)').eq('follower_id', currentUser.id);
            if(!friends?.length) return alert("Siga alguém primeiro para enviar!");
            const target = prompt("Digite o @ do amigo:\n" + friends.map(f => f.profiles.instagram).join(', '));
            if(!target) return;
            const fr = friends.find(f => f.profiles.instagram.toLowerCase().includes(target.toLowerCase().replace('@','')));
            const { data: wks } = await _supabase.from('workouts').select('*').eq('user_id', currentUser.id).eq('category', currentLetter);
            await _supabase.from('shared_workouts').insert([{ sender_id: currentUser.id, receiver_id: fr.following_id, workout_data: { exercises: wks } }]);
            alert("Enviado!");
        }

        // --- AUXILIARES ---
        function switchView(v) { ['championship','search','stats','profile'].forEach(id => { document.getElementById('view-'+id).classList.add('hidden'); document.getElementById('nav-'+id).classList.remove('active-nav'); }); document.getElementById('view-'+v).classList.remove('hidden'); document.getElementById('nav-'+v).classList.add('active-nav'); if(v==='stats') loadWorkouts(); }
        function renderTabs() { document.getElementById('tabs-container').innerHTML = ['A','B','C','D'].map(l => `<button onclick="changeLetter('${l}', this)" class="letter-btn px-6 py-2 rounded-full border border-[#262626] text-[10px] font-black ${currentLetter===l?'active-nav':''}">${l}</button>`).join('') + `<button onclick="changeLetter('SHARED', this)" class="letter-btn px-6 py-2 rounded-full border border-green-900 text-green-500 text-[10px] font-black italic ${currentLetter==='SHARED'?'active-nav':''}">📥</button>`; }
        function changeLetter(l, btn) { currentLetter = l; renderTabs(); loadWorkouts(); }
        async function loadMyProfile() {
            const { data: p } = await _supabase.from('profiles').select('*').eq('id', currentUser.id).single();
            document.getElementById('my-name').innerText = p.full_name || "Atleta";
            document.getElementById('my-handle').innerText = p.instagram;
            if(p.avatar_url) { document.getElementById('my-avatar-img').src = p.avatar_url; document.getElementById('my-avatar-img').classList.remove('hidden'); }
            const { data: phs } = await _supabase.from('evolution_gallery').select('photo_url').eq('user_id', currentUser.id).order('created_at', {ascending: false});
            document.getElementById('my-gallery').innerHTML = (phs || []).map(ph => `<img src="${ph.photo_url}" class="aspect-square object-cover">`).join('');
            const { count: posts } = await _supabase.from('evolution_gallery').select('*', {count:'exact', head:true}).eq('user_id', currentUser.id);
            const { count: friends } = await _supabase.from('connections').select('*', {count:'exact', head:true}).eq('following_id', currentUser.id).eq('status', 'accepted');
            document.getElementById('my-photos-count').innerText = posts || 0;
            document.getElementById('my-followers-count').innerText = friends || 0;
        }
        function startEditWorkout(ex) { editingWorkoutId = ex.id; document.getElementById('in-name').value = ex.exercise_name; document.getElementById('in-weight').value = ex.weight; document.getElementById('in-reps').value = ex.reps; document.getElementById('btn-save-workout').innerText = "Atualizar"; document.getElementById('btn-cancel-edit').classList.remove('hidden'); }
        function cancelEditWorkout() { editingWorkoutId = null; document.getElementById('btn-save-workout').innerText = "Salvar"; document.getElementById('btn-cancel-edit').classList.add('hidden'); document.getElementById('in-name').value = ''; }
        async function saveWorkout() { 
            const payload = { exercise_name: document.getElementById('in-name').value, weight: document.getElementById('in-weight').value, reps: document.getElementById('in-reps').value };
            if(editingWorkoutId) await _supabase.from('workouts').update(payload).eq('id', editingWorkoutId);
            else await _supabase.from('workouts').insert([{ ...payload, user_id: currentUser.id, category: currentLetter }]);
            location.reload();
        }
        async function handleSignIn() { const u = document.getElementById('login-user').value.trim().replace('@',''), p = document.getElementById('login-pass').value; const { error } = await _supabase.auth.signInWithPassword({ email: `${u}@sanjafit.com`, password: p }); if(error) alert("Erro!"); else location.reload(); }
        async function handleSignUp() { const u = document.getElementById('login-user').value.trim().replace('@',''), p = document.getElementById('login-pass').value; const { data } = await _supabase.auth.signUp({ email: `${u}@sanjafit.com`, password: p }); await _supabase.from('profiles').upsert({ id: data.user.id, instagram: `@${u}` }); alert("Criado!"); }
        function handleSignOut() { _supabase.auth.signOut(); location.reload(); }
        function closeUserProfile() { document.getElementById('modal-user-profile').style.display = 'none'; }
        function toggleEdit() { document.getElementById('edit-form').classList.toggle('hidden'); }
        async function saveProfile() { await _supabase.from('profiles').update({ full_name: document.getElementById('edit-name').value, bio: document.getElementById('edit-bio').value }).eq('id', currentUser.id); location.reload(); }
        async function deleteEx(id) { await _supabase.from('workouts').delete().eq('id', id); loadWorkouts(); }
    </script>
</body>
</html>
