<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SanjaFit | Arena Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; min-height: 100vh; overflow-x: hidden; }
        .nav-bottom { background: rgba(0,0,0,0.95); backdrop-filter: blur(10px); border-top: 1px solid #262626; position: fixed; bottom: 0; width: 100%; height: 75px; z-index: 1000; display: grid; grid-template-columns: repeat(4, 1fr); align-items: center; justify-items: center; }
        .active-nav { color: #3b82f6; transform: scale(1.1); transition: 0.2s; }
        .glass-card { background: #121212; border: 1px solid #262626; border-radius: 12px; padding: 15px; }
        .modal-full { display: none; position: fixed; inset: 0; background: #000; z-index: 2000; padding: 20px; flex-direction: column; overflow-y: auto; }
        .btn-blue { background-color: #0095f6; border-radius: 8px; font-weight: 700; width: 100%; padding: 12px; color: white; text-transform: uppercase; font-size: 11px; }
        input, select, textarea { background: #121212 !important; border: 1px solid #262626 !important; color: white !important; outline: none; border-radius: 8px; padding: 12px; width: 100%; margin-bottom: 10px; font-size: 14px; }
        .photo-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 3000; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .heart-active { color: #ff3040; transform: scale(1.2); }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-28">

    <div id="photo-zoom" class="photo-overlay">
        <button onclick="closePhotoZoom()" class="absolute top-6 right-6 text-3xl">✕</button>
        <img id="zoom-img" src="" class="max-w-full max-h-[55vh] rounded-lg border border-[#262626] mb-4">
        <div id="zoom-info" class="w-full max-w-sm text-center">
            <p id="zoom-caption" class="text-sm italic text-gray-300 mb-4 px-4"></p>
            <div id="area-edit-caption" class="hidden mb-4">
                <input id="in-new-caption" type="text" placeholder="Editar legenda..." class="text-xs">
                <button onclick="updateCaption()" class="text-[10px] bg-blue-600 px-3 py-1 rounded font-bold uppercase">Salvar Legenda</button>
            </div>
            <div id="zoom-actions" class="flex justify-center gap-8 items-center border-t border-white/5 pt-4">
                <button id="btn-like-zoom" class="text-4xl transition-all">🤍</button>
                <button id="btn-edit-zoom" class="hidden text-[10px] font-black uppercase text-blue-500 underline">Legenda</button>
                <button id="btn-delete-zoom" class="hidden text-[10px] font-black uppercase text-red-500 underline">Apagar</button>
            </div>
            <p id="zoom-likes-total" class="mt-4 text-[9px] font-black text-gray-500 uppercase"></p>
        </div>
    </div>

    <div id="modal-user-profile" class="modal-full">
        <div class="flex justify-between items-center mb-6">
            <h2 id="v-user-handle" class="text-sm font-black text-blue-500 italic uppercase">@atleta</h2>
            <button onclick="closeUserProfile()" class="text-2xl">✕</button>
        </div>
        <div class="space-y-6">
            <div class="flex items-center gap-6">
                <div class="w-20 h-20 rounded-full border border-[#262626] overflow-hidden bg-zinc-900 flex items-center justify-center">
                    <img id="v-user-avatar" src="" class="w-full h-full object-cover hidden">
                    <span id="v-user-icon" class="text-3xl">👤</span>
                </div>
                <div class="flex flex-1 justify-around text-center uppercase font-black text-[10px]">
                    <div><p id="v-user-photos-count" class="text-sm">0</p>Posts</div>
                    <div><p id="v-user-followers-count" class="text-sm">0</p>Amigos</div>
                </div>
            </div>
            <div class="space-y-2">
                <h2 id="v-user-name" class="font-black text-lg">Nome</h2>
                <p id="v-user-bio" class="text-xs text-gray-400 italic mb-4"></p>
                <div id="v-user-insta-link"></div>
                <div id="v-user-follow-area" class="mt-4"></div>
            </div>
            <div id="v-user-gallery" class="grid grid-cols-3 gap-[1px]"></div>
        </div>
    </div>

    <div id="section-app" class="hidden max-w-lg mx-auto">
        <header class="p-4 border-b border-[#262626] flex justify-between items-center sticky top-0 bg-black z-50">
            <h1 class="text-xl font-black italic tracking-tighter uppercase">Sanja<span class="text-blue-500">Fit</span></h1>
            <button onclick="handleSignOut()" class="text-[10px] font-bold text-red-500 uppercase">Sair</button>
        </header>

        <div id="view-championship" class="p-4 space-y-3">
            <div id="ranking-list" class="space-y-3"></div>
        </div>

        <div id="view-search" class="hidden p-4">
            <input id="search-input" type="text" oninput="filterAthletes()" placeholder="Pesquisar @atleta ou nome...">
            <div id="search-results" class="space-y-3"></div>
        </div>

        <div id="view-stats" class="hidden p-4 space-y-6">
            <div class="flex gap-2 overflow-x-auto pb-2 items-center" id="tabs-container"></div>
            
            <div class="glass-card">
                <input id="in-name" type="text" placeholder="Nome Exercício">
                <div class="flex gap-2"><input id="in-weight" type="number" placeholder="Kg"><input id="in-reps" type="text" placeholder="Reps"></div>
                <button id="btn-save-workout" onclick="saveWorkout()" class="btn-blue mb-0">Salvar Exercício</button>
                <button id="btn-cancel-edit" onclick="cancelEditWorkout()" class="hidden w-full mt-2 text-[10px] text-gray-500 underline uppercase italic">Cancelar Edição</button>
            </div>
            
            <button onclick="shareWorkoutUI()" class="w-full bg-blue-900/20 text-blue-500 p-3 rounded-lg text-[10px] font-black uppercase italic border border-blue-500/20">📤 Enviar Ficha para Amigo</button>
            <div id="list-workouts" class="space-y-2"></div>
        </div>

        <div id="view-profile" class="hidden p-6 space-y-6">
            <div class="flex items-center gap-6">
                <div class="relative w-24 h-24 rounded-full border-2 border-zinc-800 overflow-hidden bg-zinc-900 flex items-center justify-center">
                    <img id="my-avatar-img" src="" class="w-full h-full object-cover hidden">
                    <span id="my-avatar-icon" class="text-4xl text-zinc-700">👤</span>
                    <button onclick="document.getElementById('file-avatar').click()" class="absolute bottom-0 right-0 bg-blue-500 p-1.5 rounded-full text-[10px]">📷</button>
                    <input type="file" id="file-avatar" accept="image/*" class="hidden" onchange="uploadAvatar()">
                </div>
                <div class="flex flex-1 justify-around text-center uppercase font-black text-[9px]">
                    <div><p id="my-photos-count" class="text-base font-bold">0</p>Posts</div>
                    <div><p id="my-followers-count" class="text-base font-bold">0</p>Amigos</div>
                    <div><p id="my-likes-total" class="text-base font-bold">0</p>Likes</div>
                </div>
            </div>
            <div class="space-y-1">
                <h2 id="my-name" class="font-black text-xl italic uppercase">Atleta</h2>
                <h3 id="my-handle" class="text-xs text-blue-500 font-bold uppercase italic tracking-widest leading-none">@atleta</h3>
                <p id="my-bio" class="text-xs text-gray-400 mt-2 italic"></p>
                <div class="flex gap-2 pt-2">
                    <button onclick="toggleEdit()" class="flex-1 bg-zinc-800 p-2 rounded text-[10px] font-black uppercase">Editar</button>
                    <button onclick="deleteAccount()" class="px-4 bg-red-900/20 text-red-500 rounded text-[10px] font-black uppercase">Excluir</button>
                </div>
            </div>

            <div id="edit-form" class="hidden glass-card space-y-2">
                <input id="edit-name" type="text" placeholder="Nome Real">
                <textarea id="edit-bio" placeholder="Bio"></textarea>
                <input id="edit-insta" type="text" placeholder="URL do Instagram">
                <button onclick="saveProfile()" class="btn-blue">Salvar</button>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <button onclick="toggleMacros()" class="glass-card p-3 text-[10px] font-black uppercase text-blue-500">Calculadora Macros</button>
                <button onclick="toggleChart()" class="glass-card p-3 text-[10px] font-black uppercase text-green-500">Gráfico de Carga</button>
            </div>

            <div id="section-macros" class="hidden glass-card space-y-4">
                <div class="flex gap-2"><input id="m-weight" type="number" placeholder="Peso"><select id="m-goal"><option value="lose">Cutting</option><option value="gain">Bulking</option></select></div>
                <button onclick="calcMacros()" class="btn-blue p-2">Calcular</button>
                <div id="m-res" class="hidden grid grid-cols-3 gap-2 text-center text-[9px] font-black uppercase"><div class="bg-blue-900/20 p-2 rounded">P: <span id="res-p"></span></div><div class="bg-green-900/20 p-2 rounded">C: <span id="res-c"></span></div><div class="bg-yellow-900/20 p-2 rounded">G: <span id="res-g"></span></div></div>
            </div>

            <div id="section-chart" class="hidden glass-card">
                <select id="chart-select" onchange="loadLoadChart(this.value)" class="mb-4 text-xs"></select>
                <canvas id="performanceChart"></canvas>
            </div>

            <div class="space-y-4 pt-4 border-t border-zinc-900">
                <input id="in-caption" type="text" placeholder="Legenda do shape..." class="text-xs">
                <button onclick="document.getElementById('file-post').click()" class="w-full btn-blue p-4 uppercase font-black italic">Publicar 🔥</button>
                <input type="file" id="file-post" accept="image/*" class="hidden" onchange="uploadEvolution()">
            </div>
            <div id="my-gallery" class="grid grid-cols-3 gap-[1px]"></div>
            
            <footer class="mt-20 py-10 text-center border-t border-zinc-900 opacity-40">
                <a href="https://instagram.com/systemsjc_" target="_blank" class="block text-blue-500 font-black text-xs italic mb-1">SYSTEMSJC</a>
                <a href="https://instagram.com/ojeanvianna_" target="_blank" class="block text-white text-[9px] font-bold">@OJEANVIANNA_</a>
            </footer>
        </div>

        <nav class="nav-bottom">
            <button onclick="switchView('championship')" id="nav-championship" class="active-nav text-2xl">🏆</button>
            <button onclick="switchView('search')" id="nav-search" class="text-2xl">🔍</button>
            <button onclick="switchView('stats')" id="nav-stats" class="text-2xl">📋</button>
            <button onclick="switchView('profile')" id="nav-profile" class="text-2xl">👤</button>
        </nav>
    </div>

    <div id="section-login" class="hidden flex flex-col items-center justify-center min-h-screen p-6 text-center">
        <h1 class="text-5xl font-black italic mb-10 italic uppercase">Sanja<span class="text-blue-500">Fit</span></h1>
        <div class="w-full max-w-sm space-y-4">
            <input id="login-user" type="text" placeholder="@seu_instagram">
            <input id="login-pass" type="password" placeholder="Senha">
            <button onclick="handleSignIn()" class="btn-blue">Acessar Arena</button>
            <button onclick="handleSignUp()" class="text-blue-500 text-[10px] font-bold uppercase mt-4 italic underline">Criar Nova Conta</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://dazgtsobkykxwsvbmjfn.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRhemd0c29ia3lreHdzdmJtamZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxOTg4NTYsImV4cCI6MjA4ODc3NDg1Nn0.Ci_Hzqzf9Px8LTg7dNOXcu1dcTzBYWioH2yaFP2h6rI';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null, currentLetter = 'A', editingWorkoutId = null, allProfiles = [], myChart = null, activePhotoId = null;

        window.onload = async () => {
            const { data: { user } } = await _supabase.auth.getUser();
            if(user) { currentUser = user; initApp(); } 
            else { document.getElementById('section-login').classList.remove('hidden'); }
        };

        async function initApp() {
            document.getElementById('section-login').classList.add('hidden');
            document.getElementById('section-app').classList.remove('hidden');
            renderTabs(); await loadRanking(); await loadMyProfile(); loadWorkouts();
        }

        // --- AUTH ---
        async function handleSignIn() {
            const u = document.getElementById('login-user').value.trim().replace('@',''), p = document.getElementById('login-pass').value;
            const { error } = await _supabase.auth.signInWithPassword({ email: `${u}@sanjafit.com`, password: p });
            if(error) alert("Erro: @ ou senha inválidos."); else location.reload();
        }
        async function handleSignUp() {
            const u = document.getElementById('login-user').value.trim().replace('@',''), p = document.getElementById('login-pass').value;
            const { data, error } = await _supabase.auth.signUp({ email: `${u}@sanjafit.com`, password: p });
            if(error) return alert(error.message);
            await _supabase.from('profiles').upsert({ id: data.user.id, instagram: `@${u}`, xp: 0 });
            alert("Conta criada! Entre agora.");
        }
        function handleSignOut() { _supabase.auth.signOut(); location.reload(); }

        // --- AMIZADE (FIXED) ---
        async function openUserProfile(userId) {
            const { data: p } = await _supabase.from('profiles').select('*').eq('id', userId).single();
            if(!p) return;
            document.getElementById('v-user-handle').innerText = p.instagram;
            document.getElementById('v-user-name').innerText = p.full_name || "Atleta";
            document.getElementById('v-user-bio').innerText = p.bio || "";
            document.getElementById('v-user-insta-link').innerHTML = p.instagram_link ? `<a href="${p.instagram_link}" target="_blank" class="text-pink-500 font-bold text-xs uppercase underline">Instagram 📸</a>` : '';

            const avatar = document.getElementById('v-user-avatar');
            if(p.avatar_url) { avatar.src = p.avatar_url; avatar.classList.remove('hidden'); document.getElementById('v-user-icon').classList.add('hidden'); }
            else { avatar.classList.add('hidden'); document.getElementById('v-user-icon').classList.remove('hidden'); }

            const { data: conn } = await _supabase.from('connections').select('*').eq('follower_id', currentUser.id).eq('following_id', userId).single();
            const isFollowing = !!conn;
            document.getElementById('v-user-follow-area').innerHTML = userId === currentUser.id ? '' : `
                <button onclick="toggleFollow('${userId}', ${isFollowing})" class="btn-blue ${isFollowing?'bg-zinc-800':''}">${isFollowing?'Desfazer Amizade ❌':'Seguir Atleta 🔥'}</button>`;

            const { data: phs } = await _supabase.from('evolution_gallery').select('*').eq('user_id', userId).order('created_at', {ascending: false});
            document.getElementById('v-user-gallery').innerHTML = (phs || []).map(ph => `<img src="${ph.photo_url}" class="aspect-square object-cover" onclick="openPhotoZoom('${ph.id}','${ph.photo_url}','${ph.caption||""}',false)">`).join('');
            document.getElementById('modal-user-profile').style.display = 'flex';
        }

        async function toggleFollow(id, exists) {
            if(exists) await _supabase.from('connections').delete().match({ follower_id: currentUser.id, following_id: id });
            else await _supabase.from('connections').insert([{ follower_id: currentUser.id, following_id: id, status: 'accepted' }]);
            openUserProfile(id); loadMyProfile();
        }

        // --- ZOOM, LEGENDA E LIKES (FIXED) ---
        async function openPhotoZoom(id, url, caption, isMine) {
            activePhotoId = id;
            document.getElementById('zoom-img').src = url;
            document.getElementById('zoom-caption').innerText = caption || "";
            document.getElementById('photo-zoom').style.display = 'flex';
            const bL = document.getElementById('btn-like-zoom');
            const bD = document.getElementById('btn-delete-zoom');
            const bE = document.getElementById('btn-edit-zoom');
            
            bD.classList.toggle('hidden', !isMine);
            bE.classList.toggle('hidden', !isMine);
            
            if(!isMine) {
                bL.style.display = 'block';
                const { data: liked } = await _supabase.from('likes').select('*').eq('post_id', id).eq('user_id', currentUser.id).single();
                bL.innerText = liked ? '❤️' : '🤍';
                bL.classList.toggle('heart-active', !!liked);
                bL.onclick = () => handleLike(id, bL);
            } else { bL.style.display = 'none'; bE.onclick = () => document.getElementById('area-edit-caption').classList.toggle('hidden'); }
            
            const { count } = await _supabase.from('likes').select('*', {count: 'exact', head: true}).eq('post_id', id);
            document.getElementById('zoom-likes-total').innerText = `${count || 0} CURTIDAS`;
        }

        async function updateCaption() {
            const txt = document.getElementById('in-new-caption').value;
            await _supabase.from('evolution_gallery').update({ caption: txt }).eq('id', activePhotoId);
            location.reload();
        }

        async function handleLike(post_id, btn) {
            const { data: existing } = await _supabase.from('likes').select('*').eq('post_id', post_id).eq('user_id', currentUser.id).single();
            if(existing) { await _supabase.from('likes').delete().eq('id', existing.id); btn.innerText = '🤍'; }
            else { await _supabase.from('likes').insert([{ post_id, user_id: currentUser.id }]); btn.innerText = '❤️'; }
            const { count } = await _supabase.from('likes').select('*', { count: 'exact', head: true }).eq('post_id', post_id);
            document.getElementById('zoom-likes-total').innerText = `${count || 0} CURTIDAS`;
        }

        // --- TREINOS (EDIÇÃO E CARREGAMENTO) ---
        function renderTabs() {
            const container = document.getElementById('tabs-container');
            const custom = JSON.parse(localStorage.getItem('tabs_' + currentUser.id) || "[]");
            let html = ['A','B','C','D'].map(l => `<button onclick="changeLetter('${l}', this)" class="letter-btn px-6 py-2 rounded-full border border-[#262626] text-[10px] font-black ${currentLetter===l?'active-nav':''}">${l}</button>`).join('');
            html += custom.map(l => `<button onclick="changeLetter('${l}', this)" class="letter-btn px-6 py-2 rounded-full border border-[#262626] text-[10px] font-black ${currentLetter===l?'active-nav':''}">${l}</button>`).join('');
            html += `<button onclick="addTab()" class="px-4 py-2 border border-dashed border-zinc-600 rounded-full text-[10px] text-zinc-500">+</button>`;
            html += `<button onclick="changeLetter('SHARED', this)" class="letter-btn px-6 py-2 rounded-full border border-green-900 text-green-500 text-[10px] font-black italic ${currentLetter==='SHARED'?'active-nav':''}">IMPORTADOS</button>`;
            container.innerHTML = html;
        }
        function addTab() { const n = prompt("Nome da ficha:"); if(n) { const t = JSON.parse(localStorage.getItem('tabs_'+currentUser.id)||"[]"); t.push(n.toUpperCase()); localStorage.setItem('tabs_'+currentUser.id, JSON.stringify(t)); renderTabs(); } }

        async function loadWorkouts() {
            const list = document.getElementById('list-workouts');
            if(currentLetter === 'SHARED') {
                const { data } = await _supabase.from('shared_workouts').select('*, profiles!shared_workouts_sender_id_fkey(instagram)').eq('receiver_id', currentUser.id).eq('status', 'pending');
                list.innerHTML = (data || []).map(s => `<div class="glass-card flex justify-between items-center mb-2"><span class="text-xs italic">De: ${s.profiles.instagram}</span><button onclick="acceptWorkout('${s.id}')" class="bg-green-600 px-3 py-1 rounded text-[10px] font-black">IMPORTAR</button></div>`).join('') || '<p class="text-center py-10 opacity-30 text-xs">Vazio.</p>';
            } else {
                const { data } = await _supabase.from('workouts').select('*').eq('user_id', currentUser.id).eq('category', currentLetter).order('created_at');
                list.innerHTML = (data || []).map(ex => `<div class="glass-card flex justify-between items-center mb-2 text-xs"><div><b>${ex.exercise_name}</b><p class="text-[10px] text-blue-500 font-bold">${ex.weight}kg x ${ex.reps}</p></div><div class="flex gap-4"><button onclick='startEditWorkout(${JSON.stringify(ex)})' class="text-blue-500 text-[10px] font-black underline italic">Editar</button><button onclick="deleteEx('${ex.id}')" class="text-red-900 font-bold text-xs">X</button></div></div>`).join('');
                const unique = [...new Set((data || []).map(e => e.exercise_name))];
                document.getElementById('chart-select').innerHTML = `<option value="">Ver Gráfico de...</option>` + unique.map(e => `<option value="${e}">${e}</option>`).join('');
            }
        }

        async function saveWorkout() {
            const n = document.getElementById('in-name').value, w = document.getElementById('in-weight').value, r = document.getElementById('in-reps').value;
            if(!n) return;
            if(editingWorkoutId) await _supabase.from('workouts').update({ exercise_name: n, weight: String(w), reps: String(r) }).eq('id', editingWorkoutId);
            else { 
                await _supabase.from('workouts').insert([{ user_id: currentUser.id, category: currentLetter, exercise_name: n, weight: String(w), reps: String(r) }]);
                const { data } = await _supabase.from('profiles').select('xp').eq('id', currentUser.id).single();
                await _supabase.from('profiles').update({ xp: (data.xp || 0) + 5 }).eq('id', currentUser.id);
            }
            location.reload();
        }

        function startEditWorkout(ex) { editingWorkoutId = ex.id; document.getElementById('in-name').value = ex.exercise_name; document.getElementById('in-weight').value = ex.weight; document.getElementById('in-reps').value = ex.reps; document.getElementById('btn-save-workout').innerText = "Atualizar"; document.getElementById('btn-cancel-edit').classList.remove('hidden'); }
        function cancelEditWorkout() { editingWorkoutId = null; document.getElementById('btn-save-workout').innerText = "Salvar"; document.getElementById('btn-cancel-edit').classList.add('hidden'); }
        async function deleteEx(id) { if(confirm("Apagar?")) { await _supabase.from('workouts').delete().eq('id', id); loadWorkouts(); } }

        // --- COMPARTILHAR TREINO ---
        async function shareWorkoutUI() {
            const { data: friends } = await _supabase.from('connections').select('following_id, profiles!connections_following_id_fkey(instagram)').eq('follower_id', currentUser.id);
            if(!friends?.length) return alert("Você precisa seguir alguém para compartilhar!");
            const target = prompt("Digite o @ do amigo para enviar "+currentLetter+":\n" + friends.map(f => f.profiles.instagram).join(', '));
            if(!target) return;
            const fr = friends.find(f => f.profiles.instagram.toLowerCase().includes(target.replace('@','').toLowerCase()));
            const { data: wks } = await _supabase.from('workouts').select('*').eq('user_id', currentUser.id).eq('category', currentLetter);
            await _supabase.from('shared_workouts').insert([{ sender_id: currentUser.id, receiver_id: fr.following_id, workout_data: { exercises: wks } }]);
            alert("Enviado!");
        }

        // --- AUX MEU PERFIL (SOMA LIKES + TOOLS) ---
        async function loadMyProfile() {
            const { data: p } = await _supabase.from('profiles').select('*').eq('id', currentUser.id).single();
            document.getElementById('my-name').innerText = p.full_name || "Atleta";
            document.getElementById('my-handle').innerText = p.instagram;
            document.getElementById('edit-name').value = p.full_name || "";
            document.getElementById('edit-bio').value = p.bio || "";
            document.getElementById('edit-insta').value = p.instagram_link || "";
            if(p.avatar_url) { document.getElementById('my-avatar-img').src = p.avatar_url; document.getElementById('my-avatar-img').classList.remove('hidden'); document.getElementById('my-avatar-icon').classList.add('hidden'); }
            const { data: phs } = await _supabase.from('evolution_gallery').select('*, likes(user_id)').eq('user_id', currentUser.id);
            document.getElementById('my-gallery').innerHTML = (phs || []).map(ph => `<img src="${ph.photo_url}" class="aspect-square object-cover" onclick="openPhotoZoom('${ph.id}','${ph.photo_url}','${ph.caption||""}',true)">`).join('');
            document.getElementById('my-likes-total').innerText = phs?.reduce((acc, curr) => acc + (curr.likes?.length || 0), 0) || 0;
            const { count } = await _supabase.from('connections').select('*', {count: 'exact', head: true}).eq('following_id', currentUser.id).eq('status', 'accepted');
            document.getElementById('my-followers-count').innerText = count || 0;
        }

        async function saveProfile() {
            const n = document.getElementById('edit-name').value, b = document.getElementById('edit-bio').value, i = document.getElementById('edit-insta').value;
            await _supabase.from('profiles').update({ full_name: n, bio: b, instagram_link: i }).eq('id', currentUser.id);
            location.reload();
        }

        // --- TOOLS ---
        function toggleMacros() { document.getElementById('section-macros').classList.toggle('hidden'); }
        function toggleChart() { document.getElementById('section-chart').classList.toggle('hidden'); loadWorkouts(); }
        async function loadLoadChart(ex) { const { data } = await _supabase.from('workouts').select('weight, created_at').eq('user_id', currentUser.id).eq('exercise_name', ex).order('created_at'); const ctx = document.getElementById('performanceChart').getContext('2d'); if(myChart) myChart.destroy(); myChart = new Chart(ctx, { type: 'line', data: { labels: data.map(d => new Date(d.created_at).toLocaleDateString()), datasets: [{ label: 'Kg', data: data.map(d => parseFloat(d.weight)), borderColor: '#3b82f6', tension: 0.3 }] } }); }
        function calcMacros() { const w = document.getElementById('m-weight').value; document.getElementById('res-p').innerText = (w*2.2).toFixed(0)+'g'; document.getElementById('res-c').innerText = (document.getElementById('m-goal').value==='lose'?w*1.5:w*4.5).toFixed(0)+'g'; document.getElementById('res-g').innerText = (w*0.8).toFixed(0)+'g'; document.getElementById('m-res').classList.remove('hidden'); }

        // --- NAVEGAÇÃO ---
        function switchView(v) { ['championship','search','stats','profile'].forEach(id => { document.getElementById('view-'+id).classList.add('hidden'); document.getElementById('nav-'+id).classList.remove('active-nav'); }); document.getElementById('view-'+v).classList.remove('hidden'); document.getElementById('nav-'+v).classList.add('active-nav'); if(v==='stats') loadWorkouts(); }
        async function loadRanking() { const { data } = await _supabase.from('profiles').select('*').order('xp', {ascending: false}); document.getElementById('ranking-list').innerHTML = (data || []).map((p, i) => `<div class="glass-card flex justify-between items-center mb-2" onclick="openUserProfile('${p.id}')"><div class="flex items-center gap-3"><span class="text-[10px] font-black italic text-zinc-600">${i+1}º</span><p class="text-xs font-bold uppercase">${p.instagram}</p></div><span class="text-[9px] font-black text-blue-500">${p.xp || 0} XP</span></div>`).join(''); }
        function filterAthletes() { const term = document.getElementById('search-input').value.toLowerCase().trim(); document.getElementById('search-results').innerHTML = allProfiles.filter(p => p.instagram.toLowerCase().includes(term)).map(p => `<div class="flex items-center justify-between p-3 glass-card" onclick="openUserProfile('${p.id}')"><span class="text-xs font-bold">${p.instagram}</span><button class="btn-blue !w-fit !p-2 !px-4">VER</button></div>`).join(''); }
        function changeLetter(l, btn) { currentLetter = l; renderTabs(); loadWorkouts(); }
        function toggleEdit() { document.getElementById('edit-form').classList.toggle('hidden'); }
        function closePhotoZoom() { document.getElementById('photo-zoom').style.display = 'none'; document.getElementById('area-edit-caption').classList.add('hidden'); }
        function closeUserProfile() { document.getElementById('modal-user-profile').style.display = 'none'; }
        async function uploadEvolution() { const f = document.getElementById('file-post').files[0], c = document.getElementById('in-caption').value; const name = `shape_${Date.now()}.jpg`; await _supabase.storage.from('shapes').upload(name, f); const { data: url } = _supabase.storage.from('shapes').getPublicUrl(name); await _supabase.from('evolution_gallery').insert([{ user_id: currentUser.id, photo_url: url.publicUrl, caption: c }]); location.reload(); }
        async function uploadAvatar() { const f = document.getElementById('file-avatar').files[0]; await _supabase.storage.from('shapes').upload(`avatar_${currentUser.id}.jpg`, f, { upsert: true }); const { data: url } = _supabase.storage.from('shapes').getPublicUrl(`avatar_${currentUser.id}.jpg`); await _supabase.from('profiles').update({ avatar_url: url.publicUrl }).eq('id', currentUser.id); location.reload(); }
        async function deleteAccount() { if(confirm("Apagar tudo permanentemente?")) { await _supabase.from('profiles').delete().eq('id', currentUser.id); await _supabase.auth.signOut(); location.reload(); } }
        async function acceptWorkout(id) { const { data: s } = await _supabase.from('shared_workouts').select('*').eq('id', id).single(); const letter = prompt("Salvar em qual ficha?").toUpperCase(); if(letter) { const batch = s.workout_data.exercises.map(e => ({ user_id: currentUser.id, category: letter, exercise_name: e.exercise_name, weight: e.weight, reps: e.reps })); await _supabase.from('workouts').insert(batch); await _supabase.from('shared_workouts').update({ status: 'accepted' }).eq('id', id); location.reload(); } }
    </script>
</body>
</html>
