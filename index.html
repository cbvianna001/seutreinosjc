<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SanjaFit | Arena Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #000; color: #fff; min-height: 100vh; overflow-x: hidden; }
        .nav-bottom { background: rgba(10,10,10,0.95); backdrop-filter: blur(10px); border-top: 1px solid #262626; position: fixed; bottom: 0; width: 100%; height: 75px; z-index: 1000; display: grid; grid-template-columns: repeat(4, 1fr); align-items: center; justify-items: center; }
        .active-nav { color: #3b82f6; transform: scale(1.1); }
        .glass-card { background: #121212; border: 1px solid #262626; border-radius: 12px; padding: 15px; }
        .modal-full { display: none; position: fixed; inset: 0; background: #000; z-index: 2000; padding: 20px; overflow-y: auto; flex-direction: column; }
        .btn-blue { background: #0095f6; border-radius: 8px; font-weight: 700; width: 100%; padding: 12px; text-transform: uppercase; font-size: 11px; color: white; border: none; cursor: pointer; }
        input, select, textarea { background: #121212 !important; border: 1px solid #262626 !important; color: white !important; border-radius: 8px; padding: 12px; width: 100%; margin-bottom: 10px; font-size: 14px; }
        .photo-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 3000; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .workout-done { opacity: 0.3; text-decoration: line-through; border-color: #059669 !important; }
        ::-webkit-scrollbar { display: none; }
        .gallery-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 6px; background: #1a1a1a; cursor: pointer; }
    </style>
</head>
<body class="pb-28">

    <div id="photo-zoom" class="photo-overlay">
        <button onclick="closePhotoZoom()" class="absolute top-6 right-6 text-3xl">✕</button>
        <img id="zoom-img" src="" class="max-w-full max-h-[50vh] rounded-lg border border-[#262626] mb-4">
        <div class="w-full max-w-sm text-center">
            <p id="zoom-caption" class="text-sm italic text-gray-300 mb-4 px-4"></p>
            <div id="edit-caption-box" class="hidden mb-4">
                <input id="in-new-caption" type="text" placeholder="Nova legenda..." class="text-xs">
                <button onclick="saveNewCaption()" class="bg-blue-600 text-[10px] px-3 py-1 rounded font-bold">SALVAR</button>
            </div>
            <div class="flex justify-center gap-6 items-center border-t border-zinc-800 pt-4">
                <button id="btn-like-zoom" class="text-4xl">🤍</button>
                <button id="btn-edit-zoom" class="hidden text-[10px] font-black uppercase text-blue-500 underline">Legenda</button>
                <button id="btn-delete-zoom" class="hidden text-[10px] font-black uppercase text-red-500 underline">Apagar</button>
            </div>
            <p id="zoom-likes-display" class="mt-4 text-[9px] font-black text-gray-500"></p>
        </div>
    </div>

    <div id="modal-user-profile" class="modal-full">
        <div class="flex justify-between items-center mb-6">
            <h2 id="v-user-handle" class="text-sm font-black text-blue-500 uppercase italic">@atleta</h2>
            <button onclick="closeUserProfile()" class="text-2xl">✕</button>
        </div>
        <div class="space-y-6">
            <div class="flex items-center gap-6">
                <div class="w-20 h-20 rounded-full border border-zinc-800 overflow-hidden bg-zinc-900 flex items-center justify-center">
                    <img id="v-user-avatar" src="" class="w-full h-full object-cover hidden">
                    <span id="v-user-icon" class="text-2xl">👤</span>
                </div>
                <div class="flex flex-1 justify-around text-center uppercase font-black text-[10px]">
                    <div><p id="v-user-photos-count" class="text-sm">0</p>Posts</div>
                    <div><p id="v-user-followers-count" class="text-sm">0</p>Amigos</div>
                </div>
            </div>
            <div class="space-y-1">
                <h2 id="v-user-name" class="font-black text-lg">Nome</h2>
                <p id="v-user-bio" class="text-xs text-gray-400 italic"></p>
                <div id="v-user-insta-area"></div>
            </div>
            <div id="v-user-follow-area" class="min-h-[45px]"></div>
            <div id="v-user-gallery" class="grid grid-cols-3 gap-1"></div>
        </div>
    </div>

    <div id="section-app" class="hidden max-w-lg mx-auto">
        <header class="p-4 border-b border-[#262626] flex justify-between items-center sticky top-0 bg-black z-50">
            <h1 class="text-xl font-black italic tracking-tighter uppercase italic">Sanja<span class="text-blue-500">Fit</span></h1>
            <button onclick="handleSignOut()" class="text-[10px] font-bold text-red-500">SAIR</button>
        </header>

        <div id="view-championship" class="p-4 space-y-3">
            <div id="ranking-list" class="space-y-3"></div>
        </div>

        <div id="view-search" class="hidden p-4">
            <input id="search-input" type="text" oninput="filterAthletes()" placeholder="Buscar atleta...">
            <div id="search-results" class="space-y-2"></div>
        </div>

        <div id="view-stats" class="hidden p-4 space-y-6">
            <div class="flex gap-2 overflow-x-auto pb-2 items-center" id="tabs-container"></div>
            
            <div class="glass-card">
                <input id="in-name" type="text" placeholder="Nome do Exercício">
                <div class="flex gap-2"><input id="in-weight" type="number" placeholder="Kg"><input id="in-reps" type="text" placeholder="Reps"></div>
                <button id="btn-save-workout" onclick="saveWorkout()" class="btn-blue">Salvar Exercício</button>
                <button id="btn-cancel-edit" onclick="cancelEditWorkout()" class="hidden w-full text-[10px] mt-2 text-zinc-500 underline">CANCELAR EDIÇÃO</button>
            </div>

            <button onclick="shareWorkoutUI()" class="w-full bg-blue-900/20 text-blue-500 p-3 rounded-lg text-[10px] font-black uppercase italic border border-blue-500/20">📤 Enviar Ficha para Amigo</button>
            <div id="list-workouts" class="space-y-2"></div>
        </div>

        <div id="view-profile" class="hidden p-6 space-y-6">
            <div class="flex items-center gap-6">
                <div class="relative w-24 h-24 rounded-full border-2 border-blue-500 overflow-hidden bg-zinc-900 flex items-center justify-center">
                    <img id="my-avatar-img" src="" class="w-full h-full object-cover hidden">
                    <button onclick="document.getElementById('file-avatar').click()" class="absolute bottom-0 right-0 bg-blue-500 p-1 rounded-full text-[10px]">📷</button>
                    <input type="file" id="file-avatar" accept="image/*" class="hidden" onchange="uploadAvatar()">
                </div>
                <div class="flex flex-1 justify-around text-center uppercase font-black text-[9px]">
                    <div><p id="my-photos-count" class="text-sm">0</p>Posts</div>
                    <div><p id="my-followers-count" class="text-sm">0</p>Amigos</div>
                    <div><p id="my-likes-total" class="text-sm">0</p>Likes</div>
                </div>
            </div>
            
            <div class="space-y-1">
                <h2 id="my-name" class="font-black text-xl italic uppercase">Atleta</h2>
                <h3 id="my-handle" class="text-xs text-blue-500 font-bold uppercase italic">@atleta</h3>
                <p id="my-bio" class="text-xs text-gray-400 italic mt-1"></p>
                <button onclick="toggleEdit()" class="w-full bg-zinc-800 p-2 rounded mt-2 text-[10px] font-black uppercase">Editar Perfil</button>
            </div>

            <div id="edit-form" class="hidden glass-card">
                <input id="edit-name" type="text" placeholder="Nome Verdadeiro">
                <textarea id="edit-bio" placeholder="Sua bio..."></textarea>
                <input id="edit-insta" type="text" placeholder="Link do Instagram">
                <button onclick="saveProfile()" class="btn-blue">Salvar</button>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <button onclick="toggleMacros()" class="glass-card p-3 text-[10px] font-black text-blue-500 italic">CALCULADORA</button>
                <button onclick="toggleChart()" class="glass-card p-3 text-[10px] font-black text-green-500 italic">GRÁFICO</button>
            </div>

            <div id="section-macros" class="hidden glass-card space-y-4">
                <div class="flex gap-2"><input id="m-weight" type="number" placeholder="Peso"><select id="m-goal"><option value="lose">Cutting</option><option value="gain">Bulking</option></select></div>
                <button onclick="calcMacros()" class="btn-blue p-2">Calcular</button>
                <div id="m-res" class="hidden grid grid-cols-3 gap-2 text-center text-[9px] font-black"><div class="bg-zinc-900 p-2 rounded">P: <span id="res-p"></span></div><div class="bg-zinc-900 p-2 rounded">C: <span id="res-c"></span></div><div class="bg-zinc-900 p-2 rounded">G: <span id="res-g"></span></div></div>
            </div>

            <div id="section-chart" class="hidden glass-card">
                <select id="chart-select" onchange="loadLoadChart(this.value)" class="text-xs"></select>
                <canvas id="performanceChart"></canvas>
            </div>

            <div class="pt-4 border-t border-zinc-900">
                <input id="in-caption" type="text" placeholder="Legenda do shape...">
                <button onclick="document.getElementById('file-post').click()" class="w-full btn-blue p-4 font-black italic">POSTAR NO FEED 🔥</button>
                <input type="file" id="file-post" accept="image/*" class="hidden" onchange="uploadEvolution()">
            </div>
            <div id="my-gallery" class="grid grid-cols-3 gap-1"></div>
        </div>

        <nav class="nav-bottom">
            <button onclick="switchView('championship')" id="nav-championship" class="active-nav text-2xl">🏆</button>
            <button onclick="switchView('search')" id="nav-search" class="text-2xl">🔍</button>
            <button onclick="switchView('stats')" id="nav-stats" class="text-2xl">📋</button>
            <button onclick="switchView('profile')" id="nav-profile" class="text-2xl">👤</button>
        </nav>
    </div>

    <div id="section-login" class="hidden flex flex-col items-center justify-center min-h-screen p-6 text-center">
        <h1 class="text-4xl font-black italic mb-10 uppercase italic text-white">SANJA<span class="text-blue-500">FIT</span></h1>
        <div class="w-full max-w-sm space-y-4">
            <input id="login-user" type="text" placeholder="@seu_instagram">
            <input id="login-pass" type="password" placeholder="Senha">
            <button onclick="handleSignIn()" class="btn-blue">Acessar Arena</button>
            <button onclick="handleSignUp()" class="text-blue-500 text-[10px] font-bold uppercase mt-4 underline">Registrar Atleta</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://dazgtsobkykxwsvbmjfn.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRhemd0c29ia3lreHdzdmJtamZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxOTg4NTYsImV4cCI6MjA4ODc3NDg1Nn0.Ci_Hzqzf9Px8LTg7dNOXcu1dcTzBYWioH2yaFP2h6rI';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null, currentLetter = 'A', editingWorkoutId = null, allProfiles = [], myChart = null, activePhotoId = null;

        window.onload = async () => {
            const { data: { user } } = await _supabase.auth.getUser();
            if(user) { currentUser = user; initApp(); } 
            else { document.getElementById('section-login').classList.remove('hidden'); }
        };

        async function initApp() {
            document.getElementById('section-login').classList.add('hidden');
            document.getElementById('section-app').classList.remove('hidden');
            renderTabs(); await loadRanking(); await loadMyProfile(); loadWorkouts();
        }

        // --- GESTÃO DE PERFIL E BIO (FIXED) ---
        async function loadMyProfile() {
            const { data: p } = await _supabase.from('profiles').select('*').eq('id', currentUser.id).single();
            if(!p) return;
            document.getElementById('my-name').innerText = p.full_name || "Atleta";
            document.getElementById('my-handle').innerText = p.instagram;
            document.getElementById('my-bio').innerText = p.bio || "Edite para adicionar bio.";
            document.getElementById('edit-name').value = p.full_name || "";
            document.getElementById('edit-bio').value = p.bio || "";
            document.getElementById('edit-insta').value = p.instagram_link || "";

            if(p.avatar_url) { document.getElementById('my-avatar-img').src = p.avatar_url; document.getElementById('my-avatar-img').classList.remove('hidden'); document.getElementById('my-avatar-icon').classList.add('hidden'); }
            
            const { data: phs } = await _supabase.from('evolution_gallery').select('*, likes(user_id)').eq('user_id', currentUser.id).order('created_at', {ascending: false});
            document.getElementById('my-gallery').innerHTML = (phs || []).map(ph => `<img src="${ph.photo_url}" class="gallery-img" onclick="openPhotoZoom('${ph.id}','${ph.photo_url}','${ph.caption||""}',true)">`).join('');
            document.getElementById('my-photos-count').innerText = phs?.length || 0;
            document.getElementById('my-likes-total').innerText = phs?.reduce((acc, curr) => acc + (curr.likes?.length || 0), 0) || 0;
            
            const { count } = await _supabase.from('connections').select('*', {count: 'exact', head: true}).eq('following_id', currentUser.id).eq('status', 'accepted');
            document.getElementById('my-followers-count').innerText = count || 0;
        }

        async function saveProfile() {
            const name = document.getElementById('edit-name').value;
            const bio = document.getElementById('edit-bio').value;
            const insta = document.getElementById('edit-insta').value;
            await _supabase.from('profiles').update({ full_name: name, bio: bio, instagram_link: insta }).eq('id', currentUser.id);
            location.reload();
        }

        // --- AMIZADE E PERFIL AMIGO (FIXED) ---
        async function openUserProfile(userId) {
            const { data: p } = await _supabase.from('profiles').select('*').eq('id', userId).single();
            if(!p) return;
            document.getElementById('v-user-handle').innerText = p.instagram;
            document.getElementById('v-user-name').innerText = p.full_name || "Atleta";
            document.getElementById('v-user-bio').innerText = p.bio || "";
            document.getElementById('v-user-insta-area').innerHTML = p.instagram_link ? `<a href="${p.instagram_link}" target="_blank" class="text-pink-500 font-bold text-[10px] underline uppercase">Instagram 📸</a>` : '';

            const avatar = document.getElementById('v-user-avatar');
            if(p.avatar_url) { avatar.src = p.avatar_url; avatar.classList.remove('hidden'); document.getElementById('v-user-icon').classList.add('hidden'); }
            else { avatar.classList.add('hidden'); document.getElementById('v-user-icon').classList.remove('hidden'); }

            const { data: phs } = await _supabase.from('evolution_gallery').select('*').eq('user_id', userId).order('created_at', {ascending: false});
            document.getElementById('v-user-gallery').innerHTML = (phs || []).map(ph => `<img src="${ph.photo_url}" class="gallery-img" onclick="openPhotoZoom('${ph.id}','${ph.photo_url}','${ph.caption||""}',false)">`).join('');
            document.getElementById('v-user-photos-count').innerText = phs?.length || 0;

            const { count } = await _supabase.from('connections').select('*', {count: 'exact', head: true}).eq('following_id', userId).eq('status', 'accepted');
            document.getElementById('v-user-followers-count').innerText = count || 0;

            const { data: conn } = await _supabase.from('connections').select('*').eq('follower_id', currentUser.id).eq('following_id', userId).single();
            document.getElementById('v-user-follow-area').innerHTML = userId === currentUser.id ? '' : `
                <button onclick="toggleFollow('${userId}', ${!!conn})" class="btn-blue ${conn?'bg-zinc-800':''}">${conn?'REMOVER AMIGO':'SEGUIR ATLETA'}</button>`;

            document.getElementById('modal-user-profile').style.display = 'flex';
        }

        async function toggleFollow(id, exists) {
            if(exists) await _supabase.from('connections').delete().match({ follower_id: currentUser.id, following_id: id });
            else await _supabase.from('connections').insert([{ follower_id: currentUser.id, following_id: id, status: 'accepted' }]);
            openUserProfile(id); loadMyProfile();
        }

        // --- TREINOS (CONCLUIR E EDITAR FIXED) ---
        async function loadWorkouts() {
            const list = document.getElementById('list-workouts');
            if(currentLetter === 'SHARED') {
                const { data } = await _supabase.from('shared_workouts').select('*, profiles!shared_workouts_sender_id_fkey(instagram)').eq('receiver_id', currentUser.id).eq('status', 'pending');
                list.innerHTML = (data || []).map(s => `<div class="glass-card flex justify-between items-center mb-2"><span class="text-xs italic">De: ${s.profiles.instagram}</span><button onclick="acceptWorkout('${s.id}')" class="bg-green-600 px-3 py-1 rounded text-[10px] font-black">IMPORTAR</button></div>`).join('') || '<p class="text-center py-10 opacity-30 text-xs">Vazio.</p>';
            } else {
                const { data } = await _supabase.from('workouts').select('*').eq('user_id', currentUser.id).eq('category', currentLetter).order('created_at');
                list.innerHTML = (data || []).map(ex => `
                    <div class="glass-card flex justify-between items-center mb-2 ${ex.done ? 'workout-done' : ''}" id="ex-${ex.id}">
                        <div class="flex items-center gap-3">
                            <input type="checkbox" onchange="toggleDone('${ex.id}', this.checked)" ${ex.done ? 'checked' : ''} class="w-5 h-5 accent-blue-500">
                            <div><b>${ex.exercise_name}</b><p class="text-[10px] text-blue-500 font-bold">${ex.weight}kg x ${ex.reps}</p></div>
                        </div>
                        <div class="flex gap-4">
                            <button onclick='startEdit(${JSON.stringify(ex)})' class="text-blue-500 text-[10px] underline">EDITAR</button>
                            <button onclick="deleteEx('${ex.id}')" class="text-red-900 font-bold">X</button>
                        </div>
                    </div>`).join('');
                const unique = [...new Set((data || []).map(e => e.exercise_name))];
                document.getElementById('chart-select').innerHTML = `<option value="">Ver Evolução de...</option>` + unique.map(e => `<option value="${e}">${e}</option>`).join('');
            }
        }

        async function toggleDone(id, status) {
            await _supabase.from('workouts').update({ done: status }).eq('id', id);
            document.getElementById('ex-'+id).classList.toggle('workout-done', status);
            if(status) {
                const { data } = await _supabase.from('profiles').select('xp').eq('id', currentUser.id).single();
                await _supabase.from('profiles').update({ xp: (data.xp || 0) + 1 }).eq('id', currentUser.id);
                loadRanking();
            }
        }

        async function saveWorkout() {
            const n = document.getElementById('in-name').value, w = document.getElementById('in-weight').value, r = document.getElementById('in-reps').value;
            if(!n) return;
            if(editingWorkoutId) await _supabase.from('workouts').update({ exercise_name: n, weight: w, reps: r }).eq('id', editingWorkoutId);
            else await _supabase.from('workouts').insert([{ user_id: currentUser.id, category: currentLetter, exercise_name: n, weight: w, reps: r }]);
            location.reload();
        }

        // --- FOTO ZOOM: LIKES E LEGENDA (FIXED) ---
        async function openPhotoZoom(id, url, caption, isMine) {
            activePhotoId = id;
            document.getElementById('zoom-img').src = url;
            document.getElementById('zoom-caption').innerText = caption || "";
            document.getElementById('photo-zoom').style.display = 'flex';
            const bL = document.getElementById('btn-like-zoom');
            const bD = document.getElementById('btn-delete-zoom');
            const bE = document.getElementById('btn-edit-zoom');
            
            bD.classList.toggle('hidden', !isMine);
            bE.classList.toggle('hidden', !isMine);
            
            if(!isMine) {
                const { data: liked } = await _supabase.from('likes').select('*').eq('post_id', id).eq('user_id', currentUser.id).single();
                bL.innerText = liked ? '❤️' : '🤍'; bL.onclick = () => handleLike(id, bL);
            } else {
                bL.style.display = 'none';
                bD.onclick = async () => { if(confirm("Apagar shape?")) { await _supabase.from('evolution_gallery').delete().eq('id', id); location.reload(); } };
                bE.onclick = () => document.getElementById('edit-caption-box').classList.toggle('hidden');
            }
            const { count } = await _supabase.from('likes').select('*', {count:'exact', head:true}).eq('post_id', id);
            document.getElementById('zoom-likes-display').innerText = `${count || 0} CURTIDAS`;
        }

        async function saveNewCaption() {
            const txt = document.getElementById('in-new-caption').value;
            await _supabase.from('evolution_gallery').update({ caption: txt }).eq('id', activePhotoId);
            location.reload();
        }

        async function handleLike(post_id, btn) {
            const { data: existing } = await _supabase.from('likes').select('*').eq('post_id', post_id).eq('user_id', currentUser.id).single();
            if(existing) { await _supabase.from('likes').delete().eq('id', existing.id); btn.innerText = '🤍'; }
            else { await _supabase.from('likes').insert([{ post_id, user_id: currentUser.id }]); btn.innerText = '❤️'; }
            const { count } = await _supabase.from('likes').select('*', { count: 'exact', head: true }).eq('post_id', post_id);
            document.getElementById('zoom-likes-display').innerText = `${count || 0} CURTIDAS`;
        }

        // --- COMPARTILHAR TREINO ---
        async function shareWorkoutUI() {
            const { data: friends } = await _supabase.from('connections').select('following_id, profiles!connections_following_id_fkey(instagram)').eq('follower_id', currentUser.id).eq('status', 'accepted');
            if(!friends?.length) return alert("Siga um atleta para compartilhar!");
            const target = prompt("Digite o @ para enviar sua ficha "+currentLetter+":\n" + friends.map(f => f.profiles.instagram).join(', '));
            if(!target) return;
            const fr = friends.find(f => f.profiles.instagram.toLowerCase().includes(target.toLowerCase().replace('@','')));
            const { data: wks } = await _supabase.from('workouts').select('*').eq('user_id', currentUser.id).eq('category', currentLetter);
            await _supabase.from('shared_workouts').insert([{ sender_id: currentUser.id, receiver_id: fr.following_id, workout_data: { exercises: wks } }]);
            alert("Enviado!");
        }

        // --- AUX GERAIS ---
        function switchView(v) { ['championship','search','stats','profile'].forEach(id => { document.getElementById('view-'+id).classList.add('hidden'); document.getElementById('nav-'+id).classList.remove('active-nav'); }); document.getElementById('view-'+v).classList.remove('hidden'); document.getElementById('nav-'+v).classList.add('active-nav'); }
        async function loadRanking() { const { data } = await _supabase.from('profiles').select('*').order('xp', {ascending: false}); document.getElementById('ranking-list').innerHTML = (data || []).map((p, i) => `<div class="glass-card flex items-center justify-between" onclick="openUserProfile('${p.id}')"><div class="flex items-center gap-3"><span class="text-[10px] font-black">${i+1}º</span><div class="w-10 h-10 rounded-full bg-zinc-900 border border-zinc-800 overflow-hidden"><img src="${p.avatar_url || ''}" class="w-full h-full object-cover ${p.avatar_url?'':'hidden'}"></div><p class="text-xs font-bold uppercase italic">${p.instagram}</p></div><span class="text-blue-500 font-black text-xs">${p.xp || 0} XP</span></div>`).join(''); }
        function renderTabs() { document.getElementById('tabs-container').innerHTML = ['A','B','C','D'].map(l => `<button onclick="changeLetter('${l}', this)" class="letter-btn px-6 py-2 rounded-full border border-[#262626] text-[10px] font-black ${currentLetter===l?'active-nav':''}">${l}</button>`).join('') + `<button onclick="addTab()" class="px-4 py-2 border border-dashed border-zinc-600 rounded-full text-[10px] text-zinc-500">+</button>` + `<button onclick="changeLetter('SHARED', this)" class="letter-btn px-6 py-2 rounded-full border border-green-900 text-green-500 text-[10px] font-black italic ${currentLetter==='SHARED'?'active-nav':''}">📥</button>`; }
        function changeLetter(l, btn) { currentLetter = l; renderTabs(); loadWorkouts(); }
        function startEdit(ex) { editingWorkoutId = ex.id; document.getElementById('in-name').value = ex.exercise_name; document.getElementById('in-weight').value = ex.weight; document.getElementById('in-reps').value = ex.reps; document.getElementById('btn-save-workout').innerText = "ATUALIZAR"; document.getElementById('btn-cancel-edit').classList.remove('hidden'); }
        function cancelEditWorkout() { editingWorkoutId = null; document.getElementById('btn-save-workout').innerText = "SALVAR"; document.getElementById('btn-cancel-edit').classList.add('hidden'); document.getElementById('in-name').value = ''; }
        function toggleEdit() { document.getElementById('edit-form').classList.toggle('hidden'); }
        function closePhotoZoom() { document.getElementById('photo-zoom').style.display = 'none'; document.getElementById('edit-caption-box').classList.add('hidden'); }
        function closeUserProfile() { document.getElementById('modal-user-profile').style.display = 'none'; }
        function toggleMacros() { document.getElementById('section-macros').classList.toggle('hidden'); }
        function toggleChart() { document.getElementById('section-chart').classList.toggle('hidden'); loadWorkouts(); }
        async function loadLoadChart(ex) { const { data } = await _supabase.from('workouts').select('weight, created_at').eq('user_id', currentUser.id).eq('exercise_name', ex).order('created_at'); const ctx = document.getElementById('performanceChart').getContext('2d'); if(myChart) myChart.destroy(); myChart = new Chart(ctx, { type: 'line', data: { labels: data.map(d => new Date(d.created_at).toLocaleDateString()), datasets: [{ label:'Kg', data: data.map(d => parseFloat(d.weight)), borderColor:'#3b82f6', tension: 0.3 }] } }); }
        function calcMacros() { const w = document.getElementById('m-weight').value; document.getElementById('res-p').innerText = (w*2.2).toFixed(0)+'g'; document.getElementById('res-c').innerText = (document.getElementById('m-goal').value==='lose'?w*1.5:w*4.5).toFixed(0)+'g'; document.getElementById('res-g').innerText = (w*0.8).toFixed(0)+'g'; document.getElementById('m-res').classList.remove('hidden'); }
        async function deleteEx(id) { if(confirm("Apagar?")) { await _supabase.from('workouts').delete().eq('id', id); loadWorkouts(); } }
        async function uploadEvolution() { const f = document.getElementById('file-post').files[0], c = document.getElementById('in-caption').value; const name = `shape_${Date.now()}.jpg`; await _supabase.storage.from('shapes').upload(name, f); const { data: url } = _supabase.storage.from('shapes').getPublicUrl(name); await _supabase.from('evolution_gallery').insert([{ user_id: currentUser.id, photo_url: url.publicUrl, caption: c }]); location.reload(); }
        async function uploadAvatar() { const f = document.getElementById('file-avatar').files[0]; await _supabase.storage.from('shapes').upload(`avatar_${currentUser.id}.jpg`, f, { upsert: true }); const { data: url } = _supabase.storage.from('shapes').getPublicUrl(`avatar_${currentUser.id}.jpg`); await _supabase.from('profiles').update({ avatar_url: url.publicUrl }).eq('id', currentUser.id); location.reload(); }
        async function handleSignIn() { const u = document.getElementById('login-user').value.trim().replace('@',''), p = document.getElementById('login-pass').value; await _supabase.auth.signInWithPassword({ email: `${u}@sanjafit.com`, password: p }); location.reload(); }
        async function handleSignUp() { const u = document.getElementById('login-user').value.trim().replace('@',''), p = document.getElementById('login-pass').value; const { data } = await _supabase.auth.signUp({ email: `${u}@sanjafit.com`, password: p }); await _supabase.from('profiles').upsert({ id: data.user.id, instagram: `@${u}` }); alert("Criado!"); }
        async function handleSignOut() { await _supabase.auth.signOut(); location.reload(); }
        function addTab() { const n = prompt("Ficha:"); if(n) { const t = JSON.parse(localStorage.getItem('tabs_'+currentUser.id)||"[]"); t.push(n.toUpperCase()); localStorage.setItem('tabs_'+currentUser.id, JSON.stringify(t)); renderTabs(); } }
    </script>
</body>
</html>
