<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SanjaFit | Arena Classic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), 
                        url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=1470&auto=format&fit=crop'); 
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed;
            color: #fff; 
            min-height: 100vh; 
        }
        .nav-bottom { background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); border-top: 2px solid #3b82f6; position: fixed; bottom: 0; width: 100%; height: 70px; z-index: 1000; display: grid; grid-template-columns: repeat(4, 1fr); align-items: center; justify-items: center; }
        .active-nav { color: #3b82f6; transform: scale(1.2); text-shadow: 0 0 10px #3b82f6; }
        .glass-card { background: rgba(20, 20, 20, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 15px; }
        .btn-blue { background: #3b82f6; border-radius: 8px; font-weight: 900; width: 100%; padding: 12px; text-transform: uppercase; letter-spacing: 1px; }
        input, select { background: rgba(30, 30, 30, 0.9) !important; border: 1px solid #444 !important; color: white !important; border-radius: 8px; padding: 10px; width: 100%; margin-bottom: 10px; }
        .workout-done { border-left: 5px solid #059669 !important; background: rgba(5, 150, 105, 0.1) !important; opacity: 0.6; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-24">

    <header class="p-6 text-center">
        <h1 class="text-3xl font-black italic uppercase tracking-tighter">SANJA<span class="text-blue-500">FIT</span></h1>
        <p class="text-[10px] text-gray-400 font-bold uppercase tracking-[3px]">Arena de Treino</p>
    </header>

    <div id="view-trophies" class="p-4 space-y-4">
        <div class="glass-card text-center mb-6">
            <p class="text-blue-500 font-black text-xs uppercase">Seu Progresso</p>
            <h2 id="my-xp-display" class="text-4xl font-black italic">0 XP</h2>
        </div>
        <div id="ranking-list" class="space-y-3">
            </div>
    </div>

    <div id="view-calc" class="hidden p-4 space-y-4">
        <div class="glass-card">
            <h3 class="font-black mb-4 uppercase italic text-blue-500">Calculadora de Macros</h3>
            <input id="m-weight" type="number" placeholder="Seu Peso (kg)">
            <select id="m-goal">
                <option value="lose">Cutting (Perda)</option>
                <option value="gain">Bulking (Ganho)</option>
            </select>
            <button onclick="calcMacros()" class="btn-blue">Calcular Dieta</button>
            
            <div id="m-res" class="hidden grid grid-cols-3 gap-2 mt-4 text-center">
                <div class="bg-blue-600/20 p-2 rounded">
                    <p class="text-[9px] font-bold uppercase">Proteína</p>
                    <p id="res-p" class="font-black"></p>
                </div>
                <div class="bg-green-600/20 p-2 rounded">
                    <p class="text-[9px] font-bold uppercase">Carbo</p>
                    <p id="res-c" class="font-black"></p>
                </div>
                <div class="bg-yellow-600/20 p-2 rounded">
                    <p class="text-[9px] font-bold uppercase">Gordura</p>
                    <p id="res-g" class="font-black"></p>
                </div>
            </div>
        </div>
    </div>

    <div id="view-stats" class="hidden p-4 space-y-4">
        <div class="flex gap-2 overflow-x-auto mb-4" id="tabs-container">
            <button onclick="changeLetter('A')" class="px-6 py-2 rounded-full glass-card font-black text-xs active-nav">A</button>
            <button onclick="changeLetter('B')" class="px-6 py-2 rounded-full glass-card font-black text-xs">B</button>
            <button onclick="changeLetter('C')" class="px-6 py-2 rounded-full glass-card font-black text-xs">C</button>
            <button onclick="changeLetter('D')" class="px-6 py-2 rounded-full glass-card font-black text-xs">D</button>
        </div>

        <div class="glass-card mb-6">
            <input id="in-name" type="text" placeholder="Nome do Exercício">
            <div class="flex gap-2">
                <input id="in-weight" type="number" placeholder="Kg">
                <input id="in-reps" type="text" placeholder="Reps">
            </div>
            <button onclick="saveWorkout()" class="btn-blue">Adicionar à Tabela</button>
        </div>

        <div id="list-workouts" class="space-y-2"></div>
    </div>

    <div id="view-charts" class="hidden p-4 space-y-4">
        <div class="glass-card">
            <h3 class="font-black mb-4 uppercase italic text-blue-500">Evolução de Carga</h3>
            <select id="chart-select" onchange="updateChart(this.value)" class="text-xs"></select>
            <canvas id="performanceChart"></canvas>
        </div>
    </div>

    <nav class="nav-bottom">
        <button onclick="switchView('trophies')" id="nav-trophies" class="active-nav text-2xl">🏆</button>
        <button onclick="switchView('calc')" id="nav-calc" class="text-2xl">⚖️</button>
        <button onclick="switchView('stats')" id="nav-stats" class="text-2xl">📋</button>
        <button onclick="switchView('charts')" id="nav-charts" class="text-2xl">📈</button>
    </nav>

    <script>
        const SUPABASE_URL = 'https://dazgtsobkykxwsvbmjfn.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRhemd0c29ia3lreHdzdmJtamZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxOTg4NTYsImV4cCI6MjA4ODc3NDg1Nn0.Ci_Hzqzf9Px8LTg7dNOXcu1dcTzBYWioH2yaFP2h6rI';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null, currentLetter = 'A', myChart = null;

        window.onload = async () => {
            const { data: { user } } = await _supabase.auth.getUser();
            if(user) { currentUser = user; initApp(); } 
            else { window.location.href = "login.html"; } // Certifique-se de ter a página de login ou adicione o modal aqui
        };

        async function initApp() {
            loadRanking();
            loadWorkouts();
            updateMyXP();
        }

        function switchView(v) {
            ['trophies','calc','stats','charts'].forEach(id => {
                document.getElementById('view-'+id).classList.add('hidden');
                document.getElementById('nav-'+id).classList.remove('active-nav');
            });
            document.getElementById('view-'+v).classList.remove('hidden');
            document.getElementById('nav-'+v).classList.add('active-nav');
            if(v === 'charts') loadChartOptions();
        }

        async function updateMyXP() {
            const { data } = await _supabase.from('profiles').select('xp').eq('id', currentUser.id).single();
            if(data) document.getElementById('my-xp-display').innerText = `${data.xp || 0} XP`;
        }

        async function loadRanking() {
            const { data } = await _supabase.from('profiles').select('*').order('xp', {ascending: false});
            document.getElementById('ranking-list').innerHTML = (data || []).map((p, i) => `
                <div class="glass-card flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <span class="font-black italic text-blue-500">${i+1}º</span>
                        <p class="font-bold uppercase text-xs">${p.instagram}</p>
                    </div>
                    <p class="text-[10px] font-black">${p.xp || 0} XP</p>
                </div>
            `).join('');
        }

        async function loadWorkouts() {
            const { data } = await _supabase.from('workouts').select('*').eq('user_id', currentUser.id).eq('category', currentLetter).order('created_at');
            document.getElementById('list-workouts').innerHTML = (data || []).map(ex => `
                <div class="glass-card flex justify-between items-center mb-2 ${ex.done ? 'workout-done' : ''}">
                    <div class="flex items-center gap-3">
                        <input type="checkbox" onchange="toggleDone('${ex.id}', this.checked)" ${ex.done ? 'checked' : ''} class="w-5 h-5 accent-blue-500">
                        <div>
                            <p class="font-black uppercase text-sm">${ex.exercise_name}</p>
                            <p class="text-blue-500 text-[10px] font-bold">${ex.weight}kg x ${ex.reps}</p>
                        </div>
                    </div>
                    <button onclick="deleteWorkout('${ex.id}')" class="text-red-500 font-black text-xs">REMOVER</button>
                </div>
            `).join('');
        }

        async function saveWorkout() {
            const name = document.getElementById('in-name').value;
            const weight = document.getElementById('in-weight').value;
            const reps = document.getElementById('in-reps').value;
            if(!name) return;
            await _supabase.from('workouts').insert([{ user_id: currentUser.id, category: currentLetter, exercise_name: name, weight, reps }]);
            document.getElementById('in-name').value = '';
            loadWorkouts();
        }

        async function toggleDone(id, status) {
            await _supabase.from('workouts').update({ done: status }).eq('id', id);
            if(status) {
                const { data } = await _supabase.from('profiles').select('xp').eq('id', currentUser.id).single();
                await _supabase.from('profiles').update({ xp: (data.xp || 0) + 1 }).eq('id', currentUser.id);
            }
            loadWorkouts();
            updateMyXP();
        }

        async function deleteWorkout(id) {
            if(confirm("Deseja excluir este exercício?")) {
                await _supabase.from('workouts').delete().eq('id', id);
                loadWorkouts();
            }
        }

        function changeLetter(l) {
            currentLetter = l;
            loadWorkouts();
        }

        function calcMacros() {
            const w = document.getElementById('m-weight').value;
            if(!w) return;
            const goal = document.getElementById('m-goal').value;
            document.getElementById('res-p').innerText = (w * 2.2).toFixed(0) + 'g';
            document.getElementById('res-c').innerText = (goal === 'lose' ? w * 1.5 : w * 4).toFixed(0) + 'g';
            document.getElementById('res-g').innerText = (w * 0.8).toFixed(0) + 'g';
            document.getElementById('m-res').classList.remove('hidden');
        }

        async function loadChartOptions() {
            const { data } = await _supabase.from('workouts').select('exercise_name').eq('user_id', currentUser.id);
            const unique = [...new Set(data.map(d => d.exercise_name))];
            document.getElementById('chart-select').innerHTML = '<option value="">Selecione o exercício...</option>' + unique.map(u => `<option value="${u}">${u}</option>`).join('');
        }

        async function updateChart(ex) {
            const { data } = await _supabase.from('workouts').select('weight, created_at').eq('user_id', currentUser.id).eq('exercise_name', ex).order('created_at');
            const ctx = document.getElementById('performanceChart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(d => new Date(d.created_at).toLocaleDateString()),
                    datasets: [{
                        label: 'Peso (Kg)',
                        data: data.map(d => parseFloat(d.weight)),
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: { scales: { y: { beginAtZero: false }, x: { grid: { display: false } } } }
            });
        }
    </script>
</body>
</html>
