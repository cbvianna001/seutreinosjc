<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SanjaFit | Professional Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.95)), 
                        url('https://images.unsplash.com/photo-1540497077202-7c8a3999166f?q=80&w=2070&auto=format&fit=crop');
            background-size: cover; background-position: center; background-attachment: fixed;
        }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .active-tab { background: #3b82f6 !important; box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); border: none !important; }
        .active-view { border-bottom: 3px solid #3b82f6; color: white !important; }
        input::placeholder { color: #64748b; }
    </style>
</head>
<body class="text-white min-h-screen pb-20">

    <div id="auth-section" class="flex flex-col items-center justify-center min-h-screen p-6">
        <h1 class="text-6xl font-black italic text-blue-500 uppercase mb-2 tracking-tighter">SANJA<span class="text-white">FIT</span></h1>
        <div class="glass p-8 rounded-[2.5rem] w-full max-w-md shadow-2xl">
            <input id="insta-user" type="text" placeholder="@seu_instagram ou admsanjafit" class="w-full p-4 mb-4 rounded-xl bg-black/40 border border-white/10 outline-none focus:border-blue-500">
            <input id="password" type="password" placeholder="Sua Senha" class="w-full p-4 mb-8 rounded-xl bg-black/40 border border-white/10 outline-none focus:border-blue-500">
            <button onclick="handleSignIn()" class="w-full bg-blue-600 hover:bg-blue-700 p-4 rounded-xl font-black uppercase tracking-widest shadow-lg">Entrar</button>
            <button onclick="handleSignUp()" class="w-full mt-6 text-[9px] text-gray-500 uppercase font-bold tracking-widest">Criar Conta Atleta</button>
        </div>
    </div>

    <div id="app-section" class="hidden max-w-2xl mx-auto p-4">
        <header class="flex justify-between items-center py-8">
            <h2 id="user-display-name" class="text-2xl font-black italic uppercase tracking-tighter">@USUARIO</h2>
            <div class="flex gap-2">
                <button id="admin-btn" onclick="openAdmin()" class="hidden glass bg-yellow-600/20 text-yellow-500 border border-yellow-600/50 px-3 py-1 rounded-lg text-[9px] font-black italic">GERENCIAR ALUNOS</button>
                <button onclick="logout()" class="text-red-400 text-[10px] font-black uppercase">Sair</button>
            </div>
        </header>

        <div id="user-view">
             <div class="grid grid-cols-4 gap-3 mb-8">
                <button onclick="changeTab('A', this)" class="tab-btn p-5 rounded-2xl glass font-black text-xl active-tab">A</button>
                <button onclick="changeTab('B', this)" class="tab-btn p-5 rounded-2xl glass font-black text-xl">B</button>
                <button onclick="changeTab('C', this)" class="tab-btn p-5 rounded-2xl glass font-black text-xl">C</button>
                <button onclick="changeTab('D', this)" class="tab-btn p-5 rounded-2xl glass font-black text-xl">D</button>
            </div>

            <div class="glass rounded-[2.5rem] p-6 mb-8 border border-white/10">
                <h3 class="text-xs font-black uppercase mb-4 text-blue-500 italic">Treino <span id="current-tab-label">A</span></h3>
                <div id="exercise-list" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <div id="admin-panel" class="hidden fixed inset-0 bg-black/98 p-6 z-50 overflow-y-auto">
        <div class="flex justify-between items-center mb-8 max-w-3xl mx-auto">
            <h2 class="text-3xl font-black text-yellow-500 uppercase italic underline decoration-yellow-600/30">Sanja Hub Admin</h2>
            <button onclick="closeAdmin()" class="text-white text-5xl font-thin">&times;</button>
        </div>

        <div id="admin-content" class="max-w-3xl mx-auto space-y-6">
            </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://dazgtsobkykxwsvbmjfn.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRhemd0c29ia3lreHdzdmJtamZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxOTg4NTYsImV4cCI6MjA4ODc3NDg1Nn0.Ci_Hzqzf9Px8LTg7dNOXcu1dcTzBYWioH2yaFP2h6rI'; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentTab = 'A';
        let loggedUser = null;

        async function handleSignIn() {
            const u = document.getElementById('insta-user').value.trim();
            const p = document.getElementById('password').value;

            // Lógica de Admin Fixo
            if(u === 'admsanjafit' && p === 'Lecv221018') {
                const { data } = await _supabase.auth.signInWithPassword({ email: 'jean@sanjafit.admin', password: p });
                initApp(data.user, { role: 'admin' });
                return;
            }

            const { data, error } = await _supabase.auth.signInWithPassword({ 
                email: `${u.replace('@','')}@sanjafit.com`, password: p 
            });
            if (error) return alert("Credenciais inválidas.");
            const { data: profile } = await _supabase.from('profiles').select('*').eq('id', data.user.id).single();
            initApp(data.user, profile);
        }

        async function handleSignUp() {
            const u = document.getElementById('insta-user').value.trim().replace('@','');
            const p = document.getElementById('password').value;
            const { error } = await _supabase.auth.signUp({ email: `${u}@sanjafit.com`, password: p, options: { data: { instagram: `@${u}` } } });
            if (error) alert(error.message); else alert("Conta Criada! Faça Login.");
        }

        function initApp(user, profile) {
            loggedUser = user;
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('app-section').classList.remove('hidden');
            document.getElementById('user-display-name').innerText = user.user_metadata.instagram || "Admin";
            if(profile?.role === 'admin') document.getElementById('admin-btn').classList.remove('hidden');
            loadExercises(user.id);
        }

        // CARREGAR TREINOS (PARA ALUNO OU ADMIN VENDO ALUNO)
        async function loadExercises(userId) {
            const { data } = await _supabase.from('workouts').select('*').eq('user_id', userId).eq('category', currentTab).order('created_at', {ascending: true});
            const list = document.getElementById('exercise-list');
            list.innerHTML = data.map(ex => `
                <div class="glass p-5 rounded-3xl border border-white/5 flex justify-between items-center">
                    <div>
                        <h4 class="font-black uppercase text-sm italic">${ex.exercise_name}</h4>
                        <p class="text-[10px] text-blue-500 font-bold">${ex.weight}kg • ${ex.reps || '3x12'}</p>
                        ${ex.notes ? `<p class="text-[9px] text-gray-500 mt-1 italic">${ex.notes}</p>` : ''}
                    </div>
                </div>
            `).join('') || '<p class="text-center py-5 text-gray-600 text-xs italic">Aba Vazia</p>';
        }

        // PAINEL ADMIN
        async function openAdmin() {
            document.getElementById('admin-panel').classList.remove('hidden');
            const { data: profiles } = await _supabase.from('profiles').select('*').neq('role', 'admin');
            const container = document.getElementById('admin-content');
            
            container.innerHTML = profiles.map(u => `
                <div class="glass p-6 rounded-[2rem] border border-white/10 shadow-xl">
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <h3 class="text-xl font-black italic text-blue-400 uppercase tracking-tighter underline">${u.instagram}</h3>
                            <p class="text-[8px] text-gray-500 italic mt-1">ID Atleta: ${u.id}</p>
                        </div>
                        <button onclick="deleteUser('${u.id}')" class="bg-red-900/20 text-red-500 px-3 py-1 rounded-lg text-[9px] font-black border border-red-900/30 uppercase">Excluir Aluno</button>
                    </div>

                    <div class="bg-black/30 p-4 rounded-2xl mb-4 space-y-3">
                        <p class="text-[9px] font-black uppercase text-gray-500 mb-2">Prescrever Novo Exercício:</p>
                        <div class="grid grid-cols-2 gap-2">
                            <select id="cat-${u.id}" class="bg-gray-900 text-xs p-2 rounded-lg border border-white/5 outline-none">
                                <option value="A">Aba A</option><option value="B">Aba B</option><option value="C">Aba C</option><option value="D">Aba D</option>
                            </select>
                            <input id="ex-${u.id}" type="text" placeholder="Nome do Exercício" class="bg-gray-900 text-xs p-2 rounded-lg border border-white/5 outline-none">
                            <input id="w-${u.id}" type="number" placeholder="Peso (kg)" class="bg-gray-900 text-xs p-2 rounded-lg border border-white/5 outline-none">
                            <input id="r-${u.id}" type="text" placeholder="Séries x Reps" class="bg-gray-900 text-xs p-2 rounded-lg border border-white/5 outline-none">
                            <input id="n-${u.id}" type="text" placeholder="Observações/Dicas" class="col-span-2 bg-gray-900 text-xs p-2 rounded-lg border border-white/5 outline-none">
                        </div>
                        <button onclick="adminSaveWorkout('${u.id}')" class="w-full bg-blue-600 p-2 rounded-xl text-[10px] font-black uppercase tracking-widest mt-2 hover:bg-blue-500 transition-all">Salvar Treino para Aluno</button>
                    </div>

                    <button onclick="toggleWorkoutList('${u.id}')" class="text-[9px] text-gray-400 font-bold uppercase underline">Ver/Limpar Treinos Atuais</button>
                    <div id="list-${u.id}" class="hidden mt-4 space-y-2 border-t border-white/5 pt-4"></div>
                </div>
            `).join('');
        }

        // SALVAR TREINO PELO ADMIN
        async function adminSaveWorkout(userId) {
            const cat = document.getElementById(`cat-${userId}`).value;
            const name = document.getElementById(`ex-${userId}`).value;
            const w = document.getElementById(`w-${userId}`).value;
            const r = document.getElementById(`r-${userId}`).value;
            const n = document.getElementById(`n-${userId}`).value;

            if(!name) return alert("Digite o nome do exercício.");

            const { error } = await _supabase.from('workouts').insert([{
                user_id: userId, category: cat, exercise_name: name, weight: w, reps: r, notes: n
            }]);

            if(error) alert(error.message);
            else { alert("Treino enviado!"); openAdmin(); }
        }

        // VER E DELETAR TREINOS DE ALUNOS NO PAINEL ADMIN
        async function toggleWorkoutList(userId) {
            const listDiv = document.getElementById(`list-${userId}`);
            if(!listDiv.classList.contains('hidden')) {
                listDiv.classList.add('hidden');
                return;
            }
            listDiv.classList.remove('hidden');
            const { data } = await _supabase.from('workouts').select('*').eq('user_id', userId).order('category');
            listDiv.innerHTML = data.map(ex => `
                <div class="flex justify-between items-center bg-white/5 p-2 rounded-lg text-[9px]">
                    <span>[${ex.category}] ${ex.exercise_name}</span>
                    <button onclick="deleteWorkoutAdmin('${ex.id}', '${userId}')" class="text-red-500 font-black ml-2 uppercase underline">Excluir</button>
                </div>
            `).join('') || '<p class="text-[9px] text-gray-600 italic">Nenhum treino prescrito.</p>';
        }

        async function deleteWorkoutAdmin(id, userId) {
            if(!confirm("Excluir este exercício do aluno?")) return;
            await _supabase.from('workouts').delete().eq('id', id);
            toggleWorkoutList(userId); // Recarrega a sublista
        }

        async function deleteUser(userId) {
            if(!confirm("ATENÇÃO: Isso excluirá o cadastro e todos os treinos do aluno permanentemente. Confirmar?")) return;
            // No Supabase real, deletar da auth requer Admin API. 
            // Aqui deletamos o perfil, o que 'desativa' o login se houver RLS.
            await _supabase.from('profiles').delete().eq('id', userId);
            openAdmin();
        }

        // AUXILIARES
        function showView(v) { document.getElementById('user-view').classList.toggle('hidden', v !== 'workouts'); }
        function changeTab(tab, btn) { currentTab = tab; document.getElementById('current-tab-label').innerText = tab; document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active-tab')); btn.classList.add('active-tab'); if(loggedUser) loadExercises(loggedUser.id); }
        function closeAdmin() { document.getElementById('admin-panel').classList.add('hidden'); }
        function logout() { window.location.reload(); }
    </script>
</body>
</html>
