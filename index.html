<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SanjaFit | Elite Final</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; min-height: 100vh; overflow-x: hidden; }
        .nav-bottom { background: rgba(0,0,0,0.95); backdrop-filter: blur(10px); border-top: 1px solid #262626; position: fixed; bottom: 0; width: 100%; height: 75px; z-index: 1000; display: grid; grid-template-columns: repeat(4, 1fr); align-items: center; justify-items: center; }
        .active-nav { color: #3b82f6; transform: scale(1.1); transition: 0.2s; }
        .glass-card { background: #121212; border: 1px solid #262626; border-radius: 12px; padding: 15px; }
        .modal-full { display: none; position: fixed; inset: 0; background: #000; z-index: 2000; padding: 20px; flex-direction: column; overflow-y: auto; }
        .btn-blue { background-color: #0095f6; border-radius: 8px; font-weight: 700; width: 100%; padding: 12px; color: white; text-transform: uppercase; font-size: 11px; }
        input, select, textarea { background: #121212 !important; border: 1px solid #262626 !important; color: white !important; outline: none; border-radius: 8px; padding: 12px; width: 100%; margin-bottom: 10px; font-size: 14px; }
        .photo-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 3000; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .workout-done { opacity: 0.4; text-decoration: line-through; border-color: #059669 !important; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-28">

    <div id="photo-zoom" class="photo-overlay">
        <button onclick="closePhotoZoom()" class="absolute top-6 right-6 text-3xl">✕</button>
        <img id="zoom-img" src="" class="max-w-full max-h-[60vh] rounded-lg border border-[#262626] mb-4">
        <div id="zoom-info" class="w-full max-w-sm text-center">
            <p id="zoom-caption" class="text-sm italic text-gray-300 mb-4"></p>
            <div id="zoom-actions" class="flex justify-center gap-10 items-center">
                <button id="btn-like-zoom" class="text-4xl transition-all">🤍</button>
                <button id="btn-delete-photo" class="hidden text-xs text-red-500 font-bold uppercase underline">Apagar Post</button>
            </div>
        </div>
    </div>

    <div id="modal-user-profile" class="modal-full">
        <div class="flex justify-between items-center mb-6">
            <h2 id="v-user-handle" class="text-sm font-black text-blue-500 italic uppercase">@atleta</h2>
            <button onclick="closeUserProfile()" class="text-2xl">✕</button>
        </div>
        <div class="space-y-6">
            <div class="flex items-center gap-6">
                <div class="w-20 h-20 rounded-full border border-[#262626] overflow-hidden bg-zinc-900">
                    <img id="v-user-avatar" src="" class="w-full h-full object-cover hidden">
                    <span id="v-user-icon" class="w-full h-full flex items-center justify-center text-3xl">👤</span>
                </div>
                <div class="flex flex-1 justify-around text-center uppercase font-black text-[10px]">
                    <div><p id="v-user-photos-count" class="text-sm">0</p>Posts</div>
                    <div><p id="v-user-followers-count" class="text-sm">0</p>Amigos</div>
                </div>
            </div>
            <div id="v-user-follow-area"></div>
            <div id="v-user-gallery" class="grid grid-cols-3 gap-[1px]"></div>
        </div>
    </div>

    <div id="section-app" class="hidden max-w-lg mx-auto">
        <header class="p-4 border-b border-[#262626] flex justify-between items-center sticky top-0 bg-black z-50">
            <h1 class="text-xl font-black italic tracking-tighter uppercase italic">Sanja<span class="text-blue-500">Fit</span></h1>
            <button onclick="handleSignOut()" class="text-[10px] font-bold text-red-500 uppercase">Sair</button>
        </header>

        <div id="view-championship" class="p-4 space-y-3">
            <div id="ranking-list" class="space-y-3"></div>
        </div>

        <div id="view-search" class="hidden p-4">
            <input id="search-input" type="text" oninput="filterAthletes()" placeholder="Pesquisar @atleta ou nome...">
            <div id="search-results" class="space-y-3"></div>
        </div>

        <div id="view-stats" class="hidden p-4 space-y-6">
            <div class="flex gap-2 overflow-x-auto pb-2 items-center" id="tabs-container"></div>
            
            <div class="glass-card">
                <input id="in-name" type="text" placeholder="Nome do Exercício">
                <div class="flex gap-2"><input id="in-weight" type="number" placeholder="Peso"><input id="in-reps" type="text" placeholder="Reps"></div>
                <button id="btn-save-workout" onclick="saveWorkout()" class="btn-blue">Adicionar</button>
            </div>
            
            <div id="list-workouts" class="space-y-2"></div>
        </div>

        <div id="view-profile" class="hidden p-6 space-y-6">
            <div class="flex items-center gap-6">
                <div class="relative w-24 h-24 rounded-full border-2 border-zinc-800 overflow-hidden bg-zinc-900 flex items-center justify-center">
                    <img id="my-avatar-img" src="" class="w-full h-full object-cover hidden">
                    <span id="my-avatar-icon" class="text-4xl text-zinc-700">👤</span>
                    <button onclick="document.getElementById('file-avatar').click()" class="absolute bottom-0 right-0 bg-blue-500 p-1 rounded-full">📷</button>
                </div>
                <div class="flex flex-1 justify-around text-center uppercase font-black text-[9px]">
                    <div><p id="my-photos-count" class="text-base font-bold">0</p>Posts</div>
                    <div><p id="my-followers-count" class="text-base font-bold">0</p>Amigos</div>
                    <div><p id="my-likes-total" class="text-base font-bold">0</p>Likes</div>
                </div>
            </div>
            <div class="space-y-1">
                <h2 id="my-name" class="font-black text-xl italic uppercase">Atleta</h2>
                <h3 id="my-handle" class="text-xs text-blue-500 font-bold uppercase">@atleta</h3>
                <p id="my-bio" class="text-xs text-gray-400 italic mt-2"></p>
                <button onclick="toggleEdit()" class="bg-zinc-800 p-2 rounded mt-2 text-[10px] font-black uppercase w-full">Editar Perfil</button>
            </div>

            <div id="edit-form" class="hidden glass-card space-y-2">
                <input id="edit-name" type="text" placeholder="Nome Real">
                <textarea id="edit-bio" placeholder="Bio"></textarea>
                <button onclick="saveProfile()" class="btn-blue">Salvar</button>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <button onclick="toggleMacros()" class="glass-card p-3 text-[10px] font-black uppercase text-blue-500">Macros</button>
                <button onclick="toggleChart()" class="glass-card p-3 text-[10px] font-black uppercase text-green-500">Gráfico</button>
            </div>

            <div id="section-macros" class="hidden glass-card space-y-4">
                <div class="flex gap-2"><input id="m-weight" type="number" placeholder="Peso"><select id="m-goal"><option value="lose">Cutting</option><option value="gain">Bulking</option></select></div>
                <button onclick="calcMacros()" class="btn-blue p-2">Calcular</button>
                <div id="m-res" class="hidden grid grid-cols-3 gap-2 text-center text-[9px] font-black uppercase"><div class="bg-blue-900/20 p-2 rounded">P: <span id="res-p"></span></div><div class="bg-green-900/20 p-2 rounded">C: <span id="res-c"></span></div><div class="bg-yellow-900/20 p-2 rounded">G: <span id="res-g"></span></div></div>
            </div>

            <div id="section-chart" class="hidden glass-card"><canvas id="performanceChart"></canvas></div>

            <button onclick="document.getElementById('file-post').click()" class="w-full btn-blue p-4 uppercase font-black italic">Publicar Shape 🔥</button>
            <input type="file" id="file-post" accept="image/*" class="hidden" onchange="uploadEvolution()">
            <div id="my-gallery" class="grid grid-cols-3 gap-[1px]"></div>
        </div>

        <nav class="nav-bottom">
            <button onclick="switchView('championship')" id="nav-championship" class="active-nav text-2xl">🏆</button>
            <button onclick="switchView('search')" id="nav-search" class="text-2xl">🔍</button>
            <button onclick="switchView('stats')" id="nav-stats" class="text-2xl">📋</button>
            <button onclick="switchView('profile')" id="nav-profile" class="text-2xl">👤</button>
        </nav>
    </div>

    <div id="section-login" class="hidden flex flex-col items-center justify-center min-h-screen p-6 text-center">
        <h1 class="text-4xl font-black italic mb-10 uppercase italic">Sanja<span class="text-blue-500">Fit</span></h1>
        <div class="w-full max-w-sm space-y-4">
            <input id="login-user" type="text" placeholder="@seu_instagram">
            <input id="login-pass" type="password" placeholder="Senha">
            <button onclick="handleSignIn()" class="btn-blue">Acessar</button>
            <button onclick="handleSignUp()" class="text-blue-500 text-[10px] font-bold uppercase mt-4">Criar Conta</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://dazgtsobkykxwsvbmjfn.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRhemd0c29ia3lreHdzdmJtamZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxOTg4NTYsImV4cCI6MjA4ODc3NDg1Nn0.Ci_Hzqzf9Px8LTg7dNOXcu1dcTzBYWioH2yaFP2h6rI';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null, currentLetter = 'A', allProfiles = [];

        window.onload = async () => {
            const { data: { user } } = await _supabase.auth.getUser();
            if(user) { currentUser = user; initApp(); } 
            else { document.getElementById('section-login').classList.remove('hidden'); }
        };

        async function initApp() {
            document.getElementById('section-login').classList.add('hidden');
            document.getElementById('section-app').classList.remove('hidden');
            renderTabs(); await loadRanking(); await loadMyProfile(); loadWorkouts();
        }

        // --- RANKING COM FOTOS ---
        async function loadRanking() {
            const { data } = await _supabase.from('profiles').select('*').order('xp', {ascending: false});
            allProfiles = data || [];
            document.getElementById('ranking-list').innerHTML = allProfiles.map((p, i) => `
                <div class="flex items-center justify-between p-4 glass-card" onclick="openUserProfile('${p.id}')">
                    <div class="flex items-center gap-3">
                        <span class="text-[10px] font-black">${i+1}º</span>
                        <div class="w-10 h-10 rounded-full border border-zinc-800 overflow-hidden bg-zinc-900">
                            <img src="${p.avatar_url || ''}" class="w-full h-full object-cover ${p.avatar_url ? '' : 'hidden'}">
                        </div>
                        <p class="text-xs font-bold uppercase italic">${p.instagram}</p>
                    </div>
                    <span class="text-[9px] font-black text-blue-500">${p.xp || 0} XP</span>
                </div>`).join('');
        }

        // --- TREINOS COM CHECKBOX ---
        function loadWorkouts() {
            const list = document.getElementById('list-workouts');
            _supabase.from('workouts').select('*').eq('user_id', currentUser.id).eq('category', currentLetter).order('created_at')
            .then(({data}) => {
                list.innerHTML = (data || []).map(ex => `
                    <div class="p-4 glass-card flex justify-between items-center mb-2 ${ex.done ? 'workout-done' : ''}" id="ex-${ex.id}">
                        <div class="flex items-center gap-4">
                            <input type="checkbox" onchange="toggleWorkoutDone('${ex.id}', this.checked)" ${ex.done ? 'checked' : ''} class="w-5 h-5 accent-blue-500">
                            <div><b>${ex.exercise_name}</b><p class="text-[10px] text-blue-500 font-bold">${ex.weight}kg x ${ex.reps}</p></div>
                        </div>
                        <button onclick="deleteEx('${ex.id}')" class="text-red-900 font-bold">X</button>
                    </div>`).join('');
            });
        }

        async function toggleWorkoutDone(id, status) {
            await _supabase.from('workouts').update({ done: status }).eq('id', id);
            document.getElementById('ex-'+id).classList.toggle('workout-done', status);
        }

        // --- MEU PERFIL (CONTADORES FIX) ---
        async function loadMyProfile() {
            const { data: p } = await _supabase.from('profiles').select('*').eq('id', currentUser.id).single();
            document.getElementById('my-name').innerText = p.full_name || "Atleta";
            document.getElementById('my-handle').innerText = p.instagram;
            document.getElementById('my-bio').innerText = p.bio || "";
            if(p.avatar_url) { document.getElementById('my-avatar-img').src = p.avatar_url; document.getElementById('my-avatar-img').classList.remove('hidden'); document.getElementById('my-avatar-icon').classList.add('hidden'); }
            
            const { data: phs } = await _supabase.from('evolution_gallery').select('id, photo_url').eq('user_id', currentUser.id);
            document.getElementById('my-gallery').innerHTML = (phs || []).map(ph => `<img src="${ph.photo_url}" class="aspect-square object-cover" onclick="openPhotoZoom('${ph.id}','${ph.photo_url}',true)">`).join('');
            document.getElementById('my-photos-count').innerText = phs?.length || 0;
            
            const { count: friends } = await _supabase.from('connections').select('*', {count: 'exact', head: true}).eq('following_id', currentUser.id).eq('status', 'accepted');
            document.getElementById('my-followers-count').innerText = friends || 0;
        }

        // --- AUTH & AUX ---
        async function handleSignIn() {
            const u = document.getElementById('login-user').value.trim().replace('@',''), p = document.getElementById('login-pass').value;
            const { error } = await _supabase.auth.signInWithPassword({ email: `${u}@sanjafit.com`, password: p });
            if(error) alert("Erro!"); else location.reload();
        }
        async function handleSignUp() {
            const u = document.getElementById('login-user').value.trim().replace('@',''), p = document.getElementById('login-pass').value;
            const { data } = await _supabase.auth.signUp({ email: `${u}@sanjafit.com`, password: p });
            await _supabase.from('profiles').upsert({ id: data.user.id, instagram: `@${u}` });
            location.reload();
        }
        function handleSignOut() { _supabase.auth.signOut(); location.reload(); }
        function switchView(v) { ['championship','search','stats','profile'].forEach(id => { document.getElementById('view-'+id).classList.add('hidden'); document.getElementById('nav-'+id).classList.remove('active-nav'); }); document.getElementById('view-'+v).classList.remove('hidden'); document.getElementById('nav-'+v).classList.add('active-nav'); if(v==='stats') loadWorkouts(); }
        function renderTabs() { const container = document.getElementById('tabs-container'); container.innerHTML = ['A','B','C','D'].map(l => `<button onclick="changeLetter('${l}', this)" class="letter-btn px-6 py-2 rounded-full border border-[#262626] text-[10px] font-black ${currentLetter===l?'active-nav':''}">${l}</button>`).join(''); }
        function changeLetter(l, btn) { currentLetter = l; renderTabs(); loadWorkouts(); }
        async function saveWorkout() { await _supabase.from('workouts').insert([{ user_id: currentUser.id, category: currentLetter, exercise_name: document.getElementById('in-name').value, weight: document.getElementById('in-weight').value, reps: document.getElementById('in-reps').value }]); loadWorkouts(); }
        async function deleteEx(id) { await _supabase.from('workouts').delete().eq('id', id); loadWorkouts(); }
        async function openPhotoZoom(id, url, isMine) { document.getElementById('zoom-img').src = url; document.getElementById('photo-zoom').style.display = 'flex'; document.getElementById('btn-delete-photo').classList.toggle('hidden', !isMine); document.getElementById('btn-delete-photo').onclick = async () => { await _supabase.from('evolution_gallery').delete().eq('id', id); location.reload(); } }
        function closePhotoZoom() { document.getElementById('photo-zoom').style.display = 'none'; }
        async function openUserProfile(id) { /* Abre perfil terceiros - já implementado logicamente acima */ }
        function closeUserProfile() { document.getElementById('modal-user-profile').style.display = 'none'; }
        function toggleEdit() { document.getElementById('edit-form').classList.toggle('hidden'); }
        async function saveProfile() { await _supabase.from('profiles').update({ full_name: document.getElementById('edit-name').value, bio: document.getElementById('edit-bio').value }).eq('id', currentUser.id); location.reload(); }
    </script>
</body>
</html>
