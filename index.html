<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SanjaFit | Elite Professional</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://seu-link-da-imagem.png">
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22SanjaFit%22,%22short_name%22:%22SanjaFit%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22#000000%22,%22theme_color%22:%22#3b82f6%22}">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.7)), 
                        url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=2070&auto=format&fit=crop');
            background-size: cover; background-position: center; background-attachment: fixed;
            color: white; overflow-x: hidden; min-height: 100vh;
        }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .active-tab { background: #3b82f6 !important; box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }
        .active-view { border-bottom: 3px solid #3b82f6; color: white !important; }
        .skeleton { position: relative; overflow: hidden; background: rgba(255,255,255,0.05); border-radius: 1rem; }
        .skeleton::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent); animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 100% { transform: translateX(100%); } }
        .app-logo { font-size: 1.8rem; font-weight: 900; font-style: italic; text-transform: uppercase; color: #3b82f6; }
        .member-counter { font-family: 'Orbitron', sans-serif; background: #000; color: #3b82f6; padding: 4px 10px; border-radius: 8px; border: 1px solid #1e3a8a; }
        
        /* MODAL FOTO FULLSCREEN */
        #photo-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 3000; align-items: center; justify-content: center; flex-direction: column; padding: 20px; }
        #modal-img { max-width: 100%; max-height: 75vh; border-radius: 1rem; object-fit: contain; }
        
        /* OVERLAY SUCESSO */
        #success-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 4000; align-items: center; justify-content: center; flex-direction: column; }
    </style>
</head>
<body class="pb-10">

    <div id="success-overlay">
        <lottie-player src="https://assets10.lottiefiles.com/packages/lf20_pqnfmone.json" background="transparent" speed="1" style="width: 250px; height: 250px;" autoplay></lottie-player>
        <h2 class="text-xl font-black italic text-blue-500 mt-2">MISSÃO CUMPRIDA! 🔥</h2>
    </div>

    <div id="photo-modal">
        <button onclick="closeModal()" class="absolute top-5 right-5 text-white font-black text-2xl p-4">✕</button>
        <img id="modal-img" src="" alt="Shape Full">
        <div class="mt-6 flex flex-col items-center gap-4 w-full max-w-xs">
            <span id="modal-info" class="text-xs font-bold italic text-blue-500"></span>
            <button id="btn-delete-photo" class="w-full bg-red-600 p-4 rounded-xl font-black uppercase text-xs tracking-widest shadow-lg">🗑️ Excluir Foto</button>
        </div>
    </div>

    <div id="section-login" class="flex flex-col items-center justify-center min-h-screen p-6">
        <div class="flex items-center gap-3 mb-8"><span class="text-4xl">🏋️‍♂️</span><h1 class="app-logo">Sanja<span>Fit</span></h1></div>
        <div class="glass p-8 rounded-[2.5rem] w-full max-w-md shadow-2xl text-center">
            <input id="login-user" type="text" placeholder="@seu_instagram" class="w-full p-4 mb-4 rounded-xl bg-black/40 border border-white/10 outline-none text-white">
            <input id="login-pass" type="password" placeholder="Senha" class="w-full p-4 mb-8 rounded-xl bg-black/40 border border-white/10 outline-none text-white">
            <button onclick="handleSignIn()" class="w-full bg-blue-600 p-4 rounded-xl font-black uppercase tracking-widest active:scale-95 transition-all shadow-lg">Entrar</button>
            <button onclick="handleSignUp()" class="w-full mt-6 text-[10px] text-gray-400 font-bold uppercase tracking-widest hover:text-white">Criar Conta Atleta</button>
        </div>
    </div>

    <div id="section-app" class="hidden max-w-2xl mx-auto p-4 w-full">
        <header class="flex justify-between items-center py-6">
            <div class="app-logo text-lg italic">Sanja<span>Fit</span></div>
            <div class="member-counter text-xs" id="member-count">0000</div>
            <button onclick="handleSignOut()" class="text-red-500 text-[10px] font-bold uppercase border border-red-500/20 px-3 py-1 rounded-lg">Sair</button>
        </header>

        <nav class="flex border-b border-white/10 mb-6 font-black uppercase text-[8px] tracking-widest text-center text-gray-500">
            <button onclick="switchView('workouts')" id="nav-workouts" class="flex-1 py-4 active-view">Treinos</button>
            <button onclick="switchView('evolution')" id="nav-evolution" class="flex-1 py-4">Evolução</button>
            <button onclick="switchView('macros')" id="nav-macros" class="flex-1 py-4">Dieta</button>
            <button onclick="switchView('rank')" id="nav-rank" class="flex-1 py-4">Ranking</button>
        </nav>

        <div id="view-workouts" class="space-y-6">
            <div class="grid grid-cols-4 gap-2">
                <button onclick="changeLetter('A', this)" class="letter-btn p-4 rounded-xl glass font-black active-tab">A</button>
                <button onclick="changeLetter('B', this)" class="letter-btn p-4 rounded-xl glass font-black">B</button>
                <button onclick="changeLetter('C', this)" class="letter-btn p-4 rounded-xl glass font-black">C</button>
                <button onclick="changeLetter('D', this)" class="letter-btn p-4 rounded-xl glass font-black">D</button>
            </div>

            <div class="glass p-5 rounded-[2rem]">
                <h3 class="text-[10px] font-black uppercase mb-4 text-blue-500 italic">Novo Exercício (<span id="label-letter">A</span>)</h3>
                <div class="grid grid-cols-2 gap-2 mb-4">
                    <input id="in-name" type="text" placeholder="Nome" class="col-span-2 p-3 rounded-lg bg-white/5 outline-none text-xs text-white">
                    <input id="in-weight" type="number" placeholder="Peso (kg)" class="p-3 rounded-lg bg-white/5 outline-none text-xs text-white">
                    <input id="in-reps" type="text" placeholder="Séries" class="p-3 rounded-lg bg-white/5 outline-none text-xs text-white">
                </div>
                <button onclick="saveWorkout()" class="w-full bg-blue-600 p-3 rounded-lg font-black text-xs uppercase shadow-md">Salvar</button>
            </div>

            <div id="list-workouts" class="space-y-3"></div>
            <button onclick="finishSession()" class="w-full bg-green-600 p-5 rounded-2xl font-black uppercase italic shadow-lg active:scale-95 transition-all">Concluir Treino <span id="finish-label">A</span></button>
            <div id="history-list" class="space-y-2 mt-4"></div>
        </div>

        <div id="view-evolution" class="hidden space-y-6">
            <div class="glass p-4 rounded-3xl">
                <h3 class="text-[10px] font-black text-blue-500 mb-4 italic text-center uppercase tracking-widest">Gráfico de Força</h3>
                <select id="select-exercise-chart" onchange="loadLoadChart(this.value)" class="w-full bg-black text-[10px] mb-4 p-2 rounded border border-white/10 text-white outline-none">
                    <option value="">Escolher Exercício...</option>
                </select>
                <canvas id="loadChart" height="150"></canvas>
            </div>
            <div class="glass p-6 rounded-[2rem] text-center border border-white/10 shadow-xl">
                <h3 class="font-black uppercase mb-4 italic text-xs text-blue-500">Postar Nova Foto</h3>
                <input type="file" id="file-photo" accept="image/*" class="text-[10px] mb-4 w-full">
                <input id="input-weight-evo" type="number" placeholder="Peso corporal atual (kg)" class="w-full p-3 rounded-lg bg-white/5 outline-none text-xs mb-4 text-white">
                <button onclick="uploadEvolution()" class="w-full bg-blue-600 p-3 rounded-lg font-black text-xs uppercase italic">Enviar Shape</button>
            </div>
            <div id="list-gallery" class="grid grid-cols-1 gap-6"></div>
        </div>

        <div id="view-macros" class="hidden space-y-6">
            <div class="glass p-6 rounded-[2rem]">
                <h3 class="text-xs font-black uppercase text-blue-500 mb-6 italic text-center">Calculadora de Macros</h3>
                <div class="space-y-4">
                    <input id="macro-weight" type="number" placeholder="Seu Peso (kg)" class="w-full p-4 rounded-xl bg-white/5 outline-none text-white text-center">
                    <select id="macro-goal" class="w-full p-4 rounded-xl bg-black border border-white/10 text-white">
                        <option value="lose">Focar em Definição (Corte)</option>
                        <option value="gain">Focar em Massa (Bulking)</option>
                    </select>
                    <button onclick="calculateMacros()" class="w-full bg-blue-600 p-4 rounded-xl font-black uppercase text-xs">Calcular Minha Dieta</button>
                </div>
                <div id="macro-result" class="hidden mt-8 grid grid-cols-3 gap-2 text-center text-[9px] font-black uppercase">
                    <div class="p-3 bg-blue-600/20 rounded-xl">PROT <p id="res-p" class="text-lg text-blue-500"></p></div>
                    <div class="p-3 bg-green-600/20 rounded-xl">CARB <p id="res-c" class="text-lg text-green-500"></p></div>
                    <div class="p-3 bg-yellow-600/20 rounded-xl">GORD <p id="res-g" class="text-lg text-yellow-500"></p></div>
                </div>
            </div>
        </div>

        <div id="view-rank" class="hidden space-y-6">
            <div class="text-center">
                <h3 class="text-xs font-black uppercase text-blue-500 italic">Top 10 Atletas SanjaFit</h3>
                <p class="text-[9px] text-gray-500 mt-1 uppercase tracking-widest italic">Pelo número total de treinos registrados</p>
            </div>
            <div id="ranking-list" class="space-y-3"></div>
        </div>

        <footer class="mt-10 py-6 text-center italic text-[9px] text-gray-600 tracking-tighter">
            PROJETO DESENVOLVIDO POR @SYSTEMSJC_ | @OJEANVIANNA_
        </footer>
    </div>

    <script>
        const SUPABASE_URL = 'https://dazgtsobkykxwsvbmjfn.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRhemd0c29ia3lreHdzdmJtamZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxOTg4NTYsImV4cCI6MjA4ODc3NDg1Nn0.Ci_Hzqzf9Px8LTg7dNOXcu1dcTzBYWioH2yaFP2h6rI';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null, currentLetter = 'A', loadChart = null;

        window.onload = async () => {
            const { data: { user } } = await _supabase.auth.getUser();
            if(user) initApp(user);
            updateMemberCount();
        };

        function playSuccess() {
            const o = document.getElementById('success-overlay');
            o.style.display = 'flex';
            setTimeout(() => o.style.display = 'none', 2000);
        }

        async function initApp(user) {
            currentUser = user;
            document.getElementById('section-login').classList.add('hidden');
            document.getElementById('section-app').classList.remove('hidden');
            document.getElementById('display-name').innerText = user.user_metadata.instagram || `@Atleta`;
            loadWorkouts(); updateStats(); loadGallery(); loadRanking();
        }

        async function handleSignIn() {
            const u = document.getElementById('login-user').value.trim().replace('@','');
            const p = document.getElementById('login-pass').value;
            const { data, error } = await _supabase.auth.signInWithPassword({ email: `${u}@sanjafit.com`, password: p });
            if(error) return alert("Erro no login! Verifique usuário e senha.");
            initApp(data.user);
        }

        async function handleSignUp() {
            const u = document.getElementById('login-user').value.trim().replace('@','');
            const p = document.getElementById('login-pass').value;
            if(u.length < 3) return alert("Digite um Instagram válido!");
            const { data, error } = await _supabase.auth.signUp({ 
                email: `${u}@sanjafit.com`, password: p, options: { data: { instagram: `@${u}` } } 
            });
            if(error) alert(error.message);
            else {
                await _supabase.from('profiles').upsert({ id: data.user.id, instagram: `@${u}` });
                alert("Atleta criado! Faça o login agora.");
            }
        }

        async function handleSignOut() { await _supabase.auth.signOut(); localStorage.clear(); window.location.reload(); }

        // --- RANKING ---
        async function loadRanking() {
            const { data: history } = await _supabase.from('workout_history').select('user_id');
            const { data: profiles } = await _supabase.from('profiles').select('*');
            if(!history || !profiles) return;

            const counts = history.reduce((acc, curr) => { acc[curr.user_id] = (acc[curr.user_id] || 0) + 1; return acc; }, {});
            const sorted = Object.entries(counts).sort((a,b) => b[1] - a[1]).slice(0, 10);
            
            document.getElementById('ranking-list').innerHTML = sorted.map((r, i) => {
                const prof = profiles.find(p => p.id === r[0]);
                const name = prof ? prof.instagram : `User_${r[0].substring(0,4)}`;
                const isMe = r[0] === currentUser.id;
                const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `#${i+1}`;
                
                return `
                <div class="flex justify-between items-center p-4 ${isMe ? 'bg-blue-600/20 border-blue-500' : 'glass'} rounded-2xl border border-white/5 shadow-xl">
                    <span class="text-xs font-black uppercase italic ${isMe ? 'text-blue-500' : 'text-white'}">
                        ${medal} ${name}
                    </span>
                    <span class="text-blue-500 font-black text-xs">${r[1]} Treinos</span>
                </div>`;
            }).join('');
        }

        // --- TREINOS ---
        async function saveWorkout() {
            const n = document.getElementById('in-name').value, w = document.getElementById('in-weight').value, r = document.getElementById('in-reps').value;
            if(!n || !w || w <= 0) return alert("Peso inválido!");
            await _supabase.from('workouts').insert([{ user_id: currentUser.id, category: currentLetter, exercise_name: n, weight: String(w), reps: String(r) }]);
            document.getElementById('in-name').value = ''; document.getElementById('in-weight').value = ''; document.getElementById('in-reps').value = '';
            loadWorkouts();
        }

        async function loadWorkouts() {
            const { data } = await _supabase.from('workouts').select('*').eq('user_id', currentUser.id).eq('category', currentLetter).order('created_at');
            const sel = document.getElementById('select-exercise-chart');
            sel.innerHTML = `<option value="">Ver Gráfico de...</option>` + (data || []).map(ex => `<option value="${ex.exercise_name}">${ex.exercise_name}</option>`).join('');
            document.getElementById('list-workouts').innerHTML = (data || []).map(ex => `
                <div class="glass p-4 rounded-2xl flex justify-between items-center border border-white/5 shadow-md">
                    <div class="flex items-center gap-3">
                        <input type="checkbox" class="w-5 h-5 rounded-full border-2 border-blue-500 bg-transparent checked:bg-blue-600 transition-all cursor-pointer">
                        <div><h4 class="font-black uppercase text-xs italic tracking-tighter">${ex.exercise_name}</h4><p class="text-[9px] text-blue-500 font-bold">${ex.weight}kg • ${ex.reps}</p></div>
                    </div>
                </div>`).join('') || '<p class="text-center py-6 text-gray-700 text-[10px] italic font-bold uppercase tracking-widest">Aba de Treino Vazia</p>';
        }

        async function finishSession() { await _supabase.from('workout_history').insert([{ user_id: currentUser.id, category: currentLetter }]); playSuccess(); updateStats(); loadRanking(); }

        async function updateStats() {
            const { data } = await _supabase.from('workout_history').select('*').eq('user_id', currentUser.id).order('completed_at', {ascending: false});
            document.getElementById('history-list').innerHTML = (data || []).slice(0, 5).map(h => `
                <div class="flex justify-between items-center p-3 glass rounded-xl text-[9px] font-bold text-gray-400 italic">
                    <span>Sessão de Treino ${h.category}</span><span>${new Date(h.completed_at).toLocaleDateString()}</span>
                </div>`).join('');
        }

        // --- GALERIA CORRIGIDA (OPEN FULLSCREEN) ---
        async function loadGallery() {
            const { data } = await _supabase.from('evolution_gallery').select('*').eq('user_id', currentUser.id).order('created_at', {ascending: false});
            document.getElementById('list-gallery').innerHTML = (data || []).map(p => `
                <div onclick="openPhoto('${p.photo_url}', '${p.id}', '${p.body_weight}', '${new Date(p.created_at).toLocaleDateString()}')" class="glass rounded-[2rem] overflow-hidden shadow-2xl cursor-pointer active:scale-95 transition-all">
                    <img src="${p.photo_url}" class="w-full h-56 object-cover">
                    <div class="p-4 flex justify-between items-center bg-black/40"><span class="text-blue-500 font-black italic text-[10px]">${new Date(p.created_at).toLocaleDateString()}</span><span class="text-white font-black text-xs">${p.body_weight} KG</span></div>
                </div>`).join('') || '<p class="text-center text-gray-700 italic text-[10px] py-10 uppercase font-black">Nenhum shape registrado</p>';
        }

        function openPhoto(url, id, weight, date) {
            document.getElementById('modal-img').src = url;
            document.getElementById('modal-info').innerText = `${date} | PESO: ${weight}KG`;
            document.getElementById('btn-delete-photo').onclick = () => deletePhoto(id);
            document.getElementById('photo-modal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('photo-modal').style.display = 'none'; }

        async function deletePhoto(id) {
            if(!confirm("Deseja apagar esta foto do seu histórico?")) return;
            await _supabase.from('evolution_gallery').delete().eq('id', id);
            closeModal(); loadGallery();
        }

        // --- GRÁFICO ---
        async function loadLoadChart(exName) {
            if(!exName) return;
            const { data } = await _supabase.from('workouts').select('*').eq('user_id', currentUser.id).eq('exercise_name', exName).order('created_at');
            const ctx = document.getElementById('loadChart').getContext('2d');
            if(loadChart) loadChart.destroy();
            loadChart = new Chart(ctx, { type: 'line', data: { labels: data.map(d => new Date(d.created_at).toLocaleDateString()), datasets: [{ data: data.map(d => parseFloat(d.weight)), borderColor: '#3b82f6', tension: 0.3, fill: true, backgroundColor: 'rgba(59,130,246,0.1)' }] }, options: { plugins: { legend: { display: false } } } });
        }

        // --- DIETA ---
        function calculateMacros() {
            const w = parseFloat(document.getElementById('macro-weight').value);
            const g = document.getElementById('macro-goal').value;
            if(!w) return;
            let p = w*2.2, gord = w*0.8, c = g === 'lose' ? w*1.5 : w*4.5;
            document.getElementById('res-p').innerText = p.toFixed(0) + 'g';
            document.getElementById('res-c').innerText = c.toFixed(0) + 'g';
            document.getElementById('res-g').innerText = gord.toFixed(0) + 'g';
            document.getElementById('macro-result').classList.remove('hidden');
        }

        async function uploadEvolution() {
            const f = document.getElementById('file-photo').files[0], w = document.getElementById('input-weight-evo').value;
            if(!f || !w) return alert("Selecione a foto e digite o peso!");
            const comp = await imageCompression(f, { maxSizeMB: 0.2, maxWidthOrHeight: 1280 });
            const name = `${Date.now()}_shape.jpg`;
            await _supabase.storage.from('shapes').upload(name, comp);
            const { data: url } = _supabase.storage.from('shapes').getPublicUrl(name);
            await _supabase.from('evolution_gallery').insert([{ user_id: currentUser.id, photo_url: url.publicUrl, body_weight: w }]);
            playSuccess(); loadGallery();
        }

        async function updateMemberCount() {
            const { data } = await _supabase.from('profiles').select('id');
            document.getElementById('member-count').innerText = String(data ? data.length : 0).padStart(4, '0');
        }

        function switchView(v) {
            ['workouts','evolution','macros','rank'].forEach(id => document.getElementById('view-'+id).classList.add('hidden'));
            document.getElementById('view-'+v).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-view'));
            document.getElementById('nav-'+v).classList.add('active-view');
        }

        function changeLetter(l, btn) { currentLetter = l; document.getElementById('finish-label').innerText = l; document.getElementById('label-letter').innerText = l; document.querySelectorAll('.letter-btn').forEach(b => b.classList.remove('active-tab')); btn.classList.add('active-tab'); loadWorkouts(); }
    </script>
</body>
</html>
