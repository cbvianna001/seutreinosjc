<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SanjaFit | Social Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; min-height: 100vh; overflow-x: hidden; }
        .nav-bottom { background: #000; border-top: 1px solid #262626; position: fixed; bottom: 0; width: 100%; height: 65px; z-index: 1000; display: flex; justify-content: space-around; align-items: center; }
        .btn-blue { background-color: #0095f6; border-radius: 8px; font-weight: 700; transition: all 0.2s; }
        .active-nav { color: #3b82f6; transform: scale(1.1); }
        .notif-dot { position: absolute; top: 12px; right: 22%; width: 10px; height: 10px; background-color: #ef4444; border-radius: 50%; border: 2px solid #000; }
        .glass-card { background: #121212; border: 1px solid #262626; border-radius: 12px; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-20">

    <div id="section-app" class="hidden max-w-lg mx-auto">
        <header class="sticky top-0 bg-black border-b border-[#262626] p-4 flex justify-between items-center z-50">
            <h1 class="text-xl font-black italic tracking-tighter uppercase">Sanja<span class="text-blue-500">Fit</span></h1>
            <button onclick="handleSignOut()" class="text-[10px] font-bold text-red-500 uppercase">Sair</button>
        </header>

        <div id="view-feed" class="p-0">
            <div id="feed-list" class="divide-y divide-[#262626]"></div>
        </div>

        <div id="view-search" class="hidden p-4 space-y-6">
            <div id="area-requests" class="hidden space-y-3">
                <h3 class="text-[10px] font-black text-blue-500 uppercase tracking-widest">Solicitações Pendentes</h3>
                <div id="requests-list" class="space-y-2"></div>
            </div>
            <div class="space-y-4">
                <input id="search-input" type="text" oninput="filterAthletes()" placeholder="Pesquisar por @ ou nome real..." class="w-full p-3 rounded-xl bg-[#121212] border border-[#262626] text-sm outline-none">
                <div id="ranking-list" class="space-y-4"></div>
            </div>
        </div>

        <div id="view-profile" class="hidden">
            <div class="p-6 space-y-6">
                <div class="flex items-center gap-6">
                    <div class="relative">
                        <div class="w-20 h-20 rounded-full border border-[#262626] overflow-hidden bg-[#121212] flex items-center justify-center">
                            <img id="profile-img-display" src="" class="w-full h-full object-cover hidden">
                            <span id="profile-icon" class="text-3xl">👤</span>
                        </div>
                        <button onclick="document.getElementById('file-avatar').click()" class="absolute bottom-0 right-0 bg-blue-500 p-1 rounded-full text-[10px]">📷</button>
                        <input type="file" id="file-avatar" accept="image/*" class="hidden" onchange="uploadAvatar()">
                    </div>
                    <div class="flex flex-1 justify-around text-center text-xs">
                        <div><p id="stat-photos" class="font-bold">0</p><p class="text-gray-500 uppercase text-[9px]">Posts</p></div>
                        <div><p id="stat-followers" class="font-bold">0</p><p class="text-gray-500 uppercase text-[9px]">Amigos</p></div>
                    </div>
                </div>
                <div>
                    <h2 id="profile-name-real" class="font-black text-lg">Nome Atleta</h2>
                    <h3 id="profile-handle" class="text-xs text-blue-500 font-bold uppercase tracking-widest">@atleta</h3>
                    <p id="profile-bio" class="text-xs text-gray-400 mt-2 italic">Bio...</p>
                    <button onclick="toggleEditProfile()" class="w-full bg-[#262626] p-2 rounded-md text-[10px] font-bold mt-4 uppercase">Editar Perfil</button>
                </div>
                <div id="profile-edit-form" class="hidden space-y-3 glass-card p-4">
                    <input id="edit-full-name" type="text" placeholder="Nome Verdadeiro" class="w-full p-2 text-xs bg-black rounded">
                    <textarea id="edit-bio" class="w-full p-2 text-xs h-16 bg-black rounded" placeholder="Bio..."></textarea>
                    <button onclick="saveProfileData()" class="w-full btn-blue p-2 text-xs uppercase">Salvar Alterações</button>
                </div>
            </div>
            <div id="my-gallery" class="grid grid-cols-3 gap-[1px]"></div>
        </div>

        <nav class="nav-bottom">
            <button onclick="switchView('feed')" id="nav-feed" class="text-2xl active-nav">🏠</button>
            <div class="relative w-full flex justify-center">
                <button onclick="switchView('search')" id="nav-search" class="text-2xl">🔍</button>
                <div id="nav-notif-dot" class="hidden notif-dot"></div>
            </div>
            <button onclick="switchView('profile')" id="nav-profile" class="text-2xl">👤</button>
        </nav>
    </div>

    <div id="section-login" class="flex flex-col items-center justify-center min-h-screen p-6">
        <h1 class="text-3xl font-black italic mb-10 uppercase tracking-tighter">Sanja<span class="text-blue-500">Fit</span></h1>
        <div class="w-full max-w-sm space-y-4">
            <input id="login-user" type="text" placeholder="@seu_instagram" class="w-full p-4 bg-[#121212] border border-[#262626] rounded-lg outline-none">
            <input id="login-pass" type="password" placeholder="Senha" class="w-full p-4 bg-[#121212] border border-[#262626] rounded-lg outline-none">
            <button onclick="handleSignIn()" class="w-full btn-blue p-4 uppercase font-black text-sm">Entrar na Elite</button>
            <button onclick="handleSignUp()" class="w-full text-blue-500 text-xs font-bold mt-4">Criar nova conta</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://dazgtsobkykxwsvbmjfn.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRhemd0c29ia3lreHdzdmJtamZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxOTg4NTYsImV4cCI6MjA4ODc3NDg1Nn0.Ci_Hzqzf9Px8LTg7dNOXcu1dcTzBYWioH2yaFP2h6rI';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null, allProfiles = [];

        window.onload = async () => {
            const { data: { user } } = await _supabase.auth.getUser();
            if(user) initApp(user);
        };

        async function initApp(user) {
            currentUser = user;
            document.getElementById('section-login').classList.add('hidden');
            document.getElementById('section-app').classList.remove('hidden');
            
            // Corrige perfil antigo/faltando
            const { data: prof } = await _supabase.from('profiles').select('*').eq('id', user.id).single();
            if(!prof) await _supabase.from('profiles').insert([{ id: user.id, instagram: user.user_metadata.instagram || '@atleta' }]);
            
            loadPublicFeed(); 
            loadProfileData(); 
            checkNotifications();
        }

        // --- SISTEMA DE FEED (FOTOS CARREGANDO MELHOR) ---
        async function loadPublicFeed() {
            const { data: posts, error } = await _supabase.from('evolution_gallery').select('*, profiles(instagram, full_name, avatar_url), likes(user_id)').order('created_at', {ascending: false});
            if(error) return console.error(error);

            document.getElementById('feed-list').innerHTML = posts.map(p => `
                <div class="post-card">
                    <div class="flex items-center gap-3 p-3">
                        <img src="${p.profiles?.avatar_url || ''}" class="w-8 h-8 rounded-full object-cover bg-[#121212] ${p.profiles?.avatar_url ? '' : 'hidden'}">
                        <div class="${p.profiles?.avatar_url ? 'hidden' : 'w-8 h-8 rounded-full bg-zinc-800 flex items-center justify-center text-[10px]'}">👤</div>
                        <span class="text-xs font-black uppercase italic">${p.profiles?.instagram || '@atleta'}</span>
                    </div>
                    <img src="${p.photo_url}" class="w-full aspect-square object-cover bg-zinc-900" loading="lazy">
                    <div class="p-3"><p class="text-[11px] font-black">${p.likes?.length || 0} curtidas</p></div>
                </div>`).join('') || '<p class="text-center py-20 text-gray-700 text-xs">Nenhum shape postado ainda.</p>';
        }

        // --- NOTIFICAÇÕES E SOLICITAÇÕES ---
        async function checkNotifications() {
            const { data, count } = await _supabase.from('connections').select('*', { count: 'exact' }).eq('following_id', currentUser.id).eq('status', 'pending');
            const dot = document.getElementById('nav-notif-dot');
            if(count > 0) dot.classList.remove('hidden'); else dot.classList.add('hidden');
            return { data, count };
        }

        async function loadRequests() {
            const { data } = await checkNotifications();
            const area = document.getElementById('area-requests');
            if(data && data.length > 0) {
                area.classList.remove('hidden');
                // Busca nomes de quem solicitou
                const requesterIds = data.map(r => r.follower_id);
                const { data: profiles } = await _supabase.from('profiles').select('id, instagram').in('id', requesterIds);
                
                document.getElementById('requests-list').innerHTML = profiles.map(p => `
                    <div class="flex justify-between items-center p-3 glass-card border-blue-500/30">
                        <span class="text-xs font-bold">${p.instagram} quer te seguir</span>
                        <div class="flex gap-2">
                            <button onclick="respondRequest('${p.id}', 'accepted')" class="bg-blue-600 px-3 py-1 rounded text-[10px] font-black">ACEITAR</button>
                            <button onclick="respondRequest('${p.id}', 'rejected')" class="text-gray-500 text-[10px] font-black">RECUSAR</button>
                        </div>
                    </div>`).join('');
            } else {
                area.classList.add('hidden');
            }
        }

        async function respondRequest(fId, status) {
            if(status === 'accepted') await _supabase.from('connections').update({ status }).eq('follower_id', fId).eq('following_id', currentUser.id);
            else await _supabase.from('connections').delete().eq('follower_id', fId).eq('following_id', currentUser.id);
            loadRequests(); checkNotifications();
        }

        // --- BUSCA CORRIGIDA ---
        async function loadRanking() {
            const { data } = await _supabase.from('profiles').select('id, instagram, full_name, avatar_url');
            allProfiles = (data || []).filter(p => p.id !== currentUser.id);
            filterAthletes();
        }

        function filterAthletes() {
            const term = document.getElementById('search-input').value.toLowerCase().trim();
            const list = document.getElementById('ranking-list');
            const filtered = allProfiles.filter(p => (p.instagram?.toLowerCase().includes(term) || p.full_name?.toLowerCase().includes(term)));
            
            list.innerHTML = filtered.map(p => `
                <div class="flex items-center justify-between p-3 glass-card">
                    <div class="flex items-center gap-3">
                        <img src="${p.avatar_url || ''}" class="w-10 h-10 rounded-full bg-zinc-800 object-cover ${p.avatar_url ? '' : 'hidden'}">
                        <div><p class="text-xs font-black uppercase italic">${p.instagram}</p><p class="text-[9px] text-gray-500">${p.full_name || 'Atleta SanjaFit'}</p></div>
                    </div>
                    <button onclick="sendFollowRequest('${p.id}')" class="btn-blue px-4 py-1.5 uppercase text-[10px]">Seguir</button>
                </div>`).join('');
        }

        async function sendFollowRequest(targetId) {
            const { error } = await _supabase.from('connections').insert([{ follower_id: currentUser.id, following_id: targetId, status: 'pending' }]);
            if(error) alert("Solicitação já enviada!"); else alert("Solicitação enviada! 🔥");
        }

        // --- PERFIL E FOTOS ---
        async function loadProfileData() {
            const { data: p } = await _supabase.from('profiles').select('*').eq('id', currentUser.id).single();
            if(!p) return;
            document.getElementById('profile-name-real').innerText = p.full_name || "Atleta SanjaFit";
            document.getElementById('profile-handle').innerText = p.instagram;
            document.getElementById('profile-bio').innerText = p.bio || "Sua bio está vazia...";
            if(p.avatar_url) {
                const img = document.getElementById('profile-img-display');
                img.src = p.avatar_url; img.classList.remove('hidden');
                document.getElementById('profile-icon').classList.add('hidden');
            }
            const { data: posts } = await _supabase.from('evolution_gallery').select('*').eq('user_id', currentUser.id).order('created_at', {ascending: false});
            document.getElementById('stat-photos').innerText = posts?.length || 0;
            document.getElementById('my-gallery').innerHTML = (posts || []).map(m => `<img src="${m.photo_url}" class="aspect-square object-cover bg-zinc-900 border-[0.5px] border-black">`).join('');
            
            const { count } = await _supabase.from('connections').select('*', { count: 'exact' }).eq('following_id', currentUser.id).eq('status', 'accepted');
            document.getElementById('stat-followers').innerText = count || 0;
        }

        async function uploadAvatar() {
            const f = document.getElementById('file-avatar').files[0];
            const comp = await imageCompression(f, { maxSizeMB: 0.1, maxWidthOrHeight: 400 });
            const name = `avatar_${currentUser.id}.jpg`;
            await _supabase.storage.from('shapes').upload(name, comp, { upsert: true });
            const { data: url } = _supabase.storage.from('shapes').getPublicUrl(name);
            await _supabase.from('profiles').update({ avatar_url: url.publicUrl }).eq('id', currentUser.id);
            location.reload();
        }

        // NAVEGAÇÃO
        function switchView(v) {
            ['feed','search','profile'].forEach(id => {
                document.getElementById('view-'+id).classList.add('hidden');
                document.getElementById('nav-'+id).classList.remove('active-nav');
            });
            document.getElementById('view-'+v).classList.remove('hidden');
            document.getElementById('nav-'+v).classList.add('active-nav');
            if(v === 'search') { loadRequests(); loadRanking(); }
            if(v === 'feed') loadPublicFeed();
        }

        function toggleEditProfile() { document.getElementById('profile-edit-form').classList.toggle('hidden'); }
        async function saveProfileData() {
            const full_name = document.getElementById('edit-full-name').value;
            const bio = document.getElementById('edit-bio').value;
            await _supabase.from('profiles').update({ full_name, bio }).eq('id', currentUser.id);
            location.reload();
        }

        async function handleSignIn() {
            const u = document.getElementById('login-user').value.trim().replace('@',''), p = document.getElementById('login-pass').value;
            const { error } = await _supabase.auth.signInWithPassword({ email: `${u}@sanjafit.com`, password: p });
            if(error) alert("Erro!"); else location.reload();
        }
        async function handleSignOut() { await _supabase.auth.signOut(); localStorage.clear(); location.reload(); }
        async function handleSignUp() {
            const u = document.getElementById('login-user').value.trim().replace('@',''), p = document.getElementById('login-pass').value;
            const { data, error } = await _supabase.auth.signUp({ email: `${u}@sanjafit.com`, password: p });
            if(error) return alert(error.message);
            await _supabase.from('profiles').upsert({ id: data.user.id, instagram: `@${u}` });
            alert("Sucesso! Faça o login.");
        }
    </script>
</body>
</html>
