<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViannaFit | Evolution v3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.95)), 
                        url('https://images.unsplash.com/photo-1540497077202-7c8a3999166f?q=80&w=2070&auto=format&fit=crop');
            background-size: cover; background-position: center; background-attachment: fixed;
            font-family: 'Inter', sans-serif;
        }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .active-tab { background: #3b82f6 !important; box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); border: none !important; }
        .trophy-gold { color: #ffd700; filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.5)); }
    </style>
</head>
<body class="text-white min-h-screen pb-10">

    <div id="auth-section" class="flex flex-col items-center justify-center min-h-screen p-6">
        <h1 class="text-6xl font-black italic text-blue-500 uppercase mb-10">Vianna<span class="text-white">Fit</span></h1>
        <div class="glass p-10 rounded-[2rem] w-full max-w-md shadow-2xl">
            <input id="insta-user" type="text" placeholder="@seu_instagram" class="w-full p-4 mb-4 rounded-xl bg-black/40 border border-white/10 outline-none">
            <input id="password" type="password" placeholder="Senha" class="w-full p-4 mb-8 rounded-xl bg-black/40 border border-white/10 outline-none">
            <button onclick="handleSignIn()" class="w-full bg-blue-600 p-4 rounded-xl font-black uppercase tracking-widest">Entrar</button>
            <button onclick="handleSignUp()" class="w-full mt-4 text-[10px] text-gray-500 uppercase font-bold">Criar Conta</button>
        </div>
    </div>

    <div id="app-section" class="hidden max-w-2xl mx-auto p-4">
        <header class="flex justify-between items-center py-8">
            <h2 id="user-display-name" class="text-2xl font-black italic uppercase tracking-tighter">@USUARIO</h2>
            <button onclick="logout()" class="glass px-4 py-2 rounded-xl text-[10px] font-bold text-red-400">SAIR</button>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
            <div class="glass p-6 rounded-3xl">
                <p class="text-[10px] font-black uppercase text-blue-500 mb-2">Meta Mensal (20 Treinos)</p>
                <div class="w-full bg-white/10 rounded-full h-4 mb-2">
                    <div id="goal-bar" class="bg-blue-600 h-4 rounded-full transition-all duration-1000" style="width: 0%"></div>
                </div>
                <p id="goal-text" class="text-right text-xs font-bold text-gray-400">0 / 20</p>
            </div>
            <div class="glass p-6 rounded-3xl flex items-center justify-around">
                <div class="text-center">
                    <span id="trophy-1" class="text-3xl opacity-20 transition-opacity">🏆</span>
                    <p class="text-[8px] uppercase mt-1">Iniciante</p>
                </div>
                <div class="text-center">
                    <span id="trophy-2" class="text-3xl opacity-20 transition-opacity">🔥</span>
                    <p class="text-[8px] uppercase mt-1">Frequente</p>
                </div>
                <div class="text-center">
                    <span id="trophy-3" class="text-3xl opacity-20 transition-opacity">👑</span>
                    <p class="text-[8px] uppercase mt-1">Elite</p>
                </div>
            </div>
        </div>

        <div class="flex gap-2 mb-8">
            <button onclick="changeTab('A', this)" class="tab-btn flex-1 p-5 rounded-2xl glass font-black text-xl active-tab">A</button>
            <button onclick="changeTab('B', this)" class="tab-btn flex-1 p-5 rounded-2xl glass font-black text-xl">B</button>
            <button onclick="changeTab('C', this)" class="tab-btn flex-1 p-5 rounded-2xl glass font-black text-xl">C</button>
            <button onclick="changeTab('D', this)" class="tab-btn flex-1 p-5 rounded-2xl glass font-black text-xl">D</button>
        </div>

        <div class="glass rounded-[2.5rem] p-8 mb-8">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-black italic uppercase">Treino <span class="text-blue-500" id="current-tab-label">A</span></h3>
                <div class="flex gap-2">
                    <button onclick="addExercisePrompt()" class="bg-white text-black px-4 py-2 rounded-full text-[9px] font-black">ADD</button>
                    <button onclick="finishWorkout()" class="bg-green-600 text-white px-4 py-2 rounded-full text-[9px] font-black shadow-lg shadow-green-900/40 italic">CONCLUIR</button>
                </div>
            </div>
            <div id="exercise-list" class="space-y-4"></div>
        </div>

        <div class="glass rounded-[2rem] p-8">
            <h3 class="text-lg font-black italic uppercase mb-4 text-gray-400">Histórico Recente</h3>
            <div id="history-list" class="space-y-2 text-xs">
                </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://dazgtsobkykxwsvbmjfn.supabase.co';
        const SUPABASE_KEY = 'SUA_KEY_ANON_AQUI'; // <--- INSIRA SUA KEY AQUI
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentTab = 'A';

        // AUTH
        async function handleSignIn() {
            const user = document.getElementById('insta-user').value.trim().replace('@', '');
            const pass = document.getElementById('password').value;
            const { data, error } = await _supabase.auth.signInWithPassword({ email: `${user}@viannafit.com`, password: pass });
            if (error) return alert("Erro no Login.");
            initApp(data.user);
        }

        async function handleSignUp() {
            const user = document.getElementById('insta-user').value.trim().replace('@', '');
            const pass = document.getElementById('password').value;
            await _supabase.auth.signUp({ email: `${user}@viannafit.com`, password: pass, options: { data: { instagram: `@${user}` } } });
            alert("Conta Criada! Clique em Entrar.");
        }

        function initApp(user) {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('app-section').classList.remove('hidden');
            document.getElementById('user-display-name').innerText = user.user_metadata.instagram;
            loadExercises();
            updateStats();
        }

        // TREINOS
        async function loadExercises() {
            const { data } = await _supabase.from('workouts').select('*').eq('category', currentTab);
            document.getElementById('exercise-list').innerHTML = data.map(ex => `
                <div class="bg-white/5 p-5 rounded-2xl flex justify-between items-center border border-white/5">
                    <div>
                        <h4 class="font-black uppercase text-sm italic">${ex.exercise_name}</h4>
                        <p class="text-[9px] text-blue-500 font-bold uppercase tracking-widest">${ex.weight}kg • 3x12</p>
                    </div>
                </div>
            `).join('');
        }

        async function addExercisePrompt() {
            const name = prompt("Exercício:");
            const w = prompt("Peso:");
            if(!name) return;
            const { data: { user } } = await _supabase.auth.getUser();
            await _supabase.from('workouts').insert([{ user_id: user.id, category: currentTab, exercise_name: name, weight: w }]);
            loadExercises();
        }

        // HISTÓRICO E METAS
        async function finishWorkout() {
            if(!confirm("Deseja finalizar o treino de hoje?")) return;
            const { data: { user } } = await _supabase.auth.getUser();
            await _supabase.from('workout_history').insert([{ user_id: user.id, category: currentTab }]);
            alert("Treino Concluído! +1 para a meta.");
            updateStats();
        }

        async function updateStats() {
            const { data: history } = await _supabase.from('workout_history').select('*').order('completed_at', {ascending: false});
            
            // Meta Mensal
            const count = history.length;
            const goal = 20;
            const percent = Math.min((count / goal) * 100, 100);
            document.getElementById('goal-bar').style.width = percent + '%';
            document.getElementById('goal-text').innerText = `${count} / ${goal}`;

            // Troféus
            if(count >= 1) document.getElementById('trophy-1').classList.remove('opacity-20');
            if(count >= 10) document.getElementById('trophy-2').classList.remove('opacity-20');
            if(count >= 20) document.getElementById('trophy-3').classList.remove('opacity-20');

            // Lista Histórico
            document.getElementById('history-list').innerHTML = history.slice(0, 5).map(h => `
                <div class="flex justify-between items-center border-b border-white/5 py-2">
                    <span class="font-bold">TREINO ${h.category}</span>
                    <span class="text-gray-500">${new Date(h.completed_at).toLocaleDateString('pt-BR')}</span>
                </div>
            `).join('');
        }

        // AUX
        function changeTab(tab, btn) {
            currentTab = tab;
            document.getElementById('current-tab-label').innerText = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active-tab'));
            btn.classList.add('active-tab');
            loadExercises();
        }
        function logout() { window.location.reload(); }
        function addExercisePrompt() {
            const name = prompt("Exercício:");
            const w = prompt("Peso:");
            if(!name) return;
            _supabase.auth.getUser().then(({data}) => {
                _supabase.from('workouts').insert([{ user_id: data.user.id, category: currentTab, exercise_name: name, weight: w }]).then(() => loadExercises());
            });
        }
    </script>
</body>
</html>
