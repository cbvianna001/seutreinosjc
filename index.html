<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SanjaFit | Premium Evolution</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.95)), 
                        url('https://images.unsplash.com/photo-1540497077202-7c8a3999166f?q=80&w=2070&auto=format&fit=crop');
            background-size: cover; background-position: center; background-attachment: fixed;
        }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .active-tab { background: #3b82f6 !important; box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); border: none !important; }
        .trophy-active { opacity: 1 !important; grayscale: 0% !important; filter: drop-shadow(0 0 8px gold); }
    </style>
</head>
<body class="text-white min-h-screen pb-12">

    <div id="auth-section" class="flex flex-col items-center justify-center min-h-screen p-6 text-center">
        <h1 class="text-6xl font-black italic text-blue-500 uppercase mb-2 tracking-tighter">SANJA<span class="text-white">FIT</span></h1>
        <p class="text-gray-500 text-[10px] tracking-[0.5em] uppercase mb-10 font-bold">Forge Your Body in SJC</p>
        
        <div class="glass p-8 rounded-[2.5rem] w-full max-w-md shadow-2xl">
            <input id="insta-user" type="text" placeholder="@seu_instagram" 
                   class="w-full p-4 mb-4 rounded-xl bg-black/40 border border-white/10 outline-none focus:border-blue-500 transition-all">
            <input id="password" type="password" placeholder="Senha do App" 
                   class="w-full p-4 mb-8 rounded-xl bg-black/40 border border-white/10 outline-none focus:border-blue-500 transition-all">
            
            <button onclick="handleSignIn()" class="w-full bg-blue-600 hover:bg-blue-700 p-4 rounded-xl font-black uppercase tracking-widest shadow-lg active:scale-95 transition-all">Entrar</button>
            <button onclick="handleSignUp()" class="w-full mt-6 text-[10px] text-gray-500 uppercase font-bold hover:text-white transition-colors tracking-widest text-center">Criar Nova Conta</button>
        </div>
    </div>

    <div id="app-section" class="hidden max-w-2xl mx-auto p-4">
        <header class="flex justify-between items-center py-8">
            <div>
                <h2 id="user-display-name" class="text-2xl font-black text-white italic uppercase">@USUARIO</h2>
                <p class="text-blue-500 text-[9px] font-bold uppercase tracking-widest">Sanja Evolution Mode</p>
            </div>
            <div class="flex gap-2">
                <button id="admin-btn" onclick="openAdmin()" class="hidden bg-yellow-600/20 text-yellow-500 border border-yellow-600 px-3 py-1 rounded-lg text-[9px] font-black italic">ADMIN</button>
                <button onclick="logout()" class="glass px-4 py-2 rounded-xl text-[10px] font-bold text-red-400 uppercase tracking-widest">Sair</button>
            </div>
        </header>

        <div id="timer-display" class="hidden glass mb-8 p-6 rounded-3xl flex justify-between items-center border-blue-500/30">
            <div>
                <p class="text-[9px] font-black text-blue-500 uppercase tracking-widest">Descanso em curso</p>
                <h3 id="timer-seconds" class="text-4xl font-black italic text-white">60s</h3>
            </div>
            <button onclick="stopTimer()" class="bg-red-500/20 text-red-500 px-4 py-2 rounded-lg text-[10px] font-black uppercase">Parar</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
            <div class="glass p-6 rounded-3xl">
                <p class="text-[10px] font-black uppercase text-gray-500 mb-3 tracking-widest">Meta Mensal (20 Treinos)</p>
                <div class="w-full bg-white/5 rounded-full h-3 mb-2 overflow-hidden">
                    <div id="goal-bar" class="bg-blue-600 h-full transition-all duration-1000" style="width: 0%"></div>
                </div>
                <div class="flex justify-between text-[10px] font-bold">
                    <span id="goal-text" class="text-blue-400">0 / 20</span>
                    <span id="goal-percent" class="text-gray-500">0%</span>
                </div>
            </div>
            <div class="glass p-6 rounded-3xl flex items-center justify-around">
                <div class="text-center"><span id="trophy-1" class="text-3xl opacity-10 grayscale transition-all">🏆</span><p class="text-[7px] uppercase mt-1 text-gray-500 italic font-black">Bronze</p></div>
                <div class="text-center"><span id="trophy-2" class="text-3xl opacity-10 grayscale transition-all">🔥</span><p class="text-[7px] uppercase mt-1 text-gray-500 italic font-black">Prata</p></div>
                <div class="text-center"><span id="trophy-3" class="text-3xl opacity-10 grayscale transition-all">👑</span><p class="text-[7px] uppercase mt-1 text-gray-500 italic font-black">Ouro</p></div>
            </div>
        </div>

        <div class="flex justify-between gap-3 mb-8">
            <button onclick="changeTab('A', this)" class="tab-btn flex-1 p-5 rounded-2xl glass font-black text-xl active-tab transition-all">A</button>
            <button onclick="changeTab('B', this)" class="tab-btn flex-1 p-5 rounded-2xl glass font-black text-xl transition-all">B</button>
            <button onclick="changeTab('C', this)" class="tab-btn flex-1 p-5 rounded-2xl glass font-black text-xl transition-all">C</button>
            <button onclick="changeTab('D', this)" class="tab-btn flex-1 p-5 rounded-2xl glass font-black text-xl transition-all">D</button>
        </div>

        <div class="glass rounded-[2.5rem] p-8 mb-8 border-t border-white/10 shadow-2xl">
            <div class="flex justify-between items-center mb-8">
                <h3 class="text-2xl font-black italic uppercase italic tracking-tighter">Treino <span id="current-tab-label" class="text-blue-500">A</span></h3>
                <div class="flex gap-2">
                    <button onclick="addExercisePrompt()" class="bg-white text-black px-4 py-2 rounded-full text-[9px] font-black uppercase">Adicionar</button>
                    <button onclick="finishWorkout()" class="bg-green-600 text-white px-4 py-2 rounded-full text-[9px] font-black italic uppercase shadow-lg shadow-green-900/40">Concluir</button>
                </div>
            </div>
            <div id="exercise-list" class="space-y-4"></div>
        </div>

        <div class="glass rounded-[2rem] p-8">
            <h3 class="text-xs font-black italic uppercase mb-6 text-gray-500 tracking-widest">Sessões Recentes</h3>
            <div id="history-list" class="space-y-3"></div>
        </div>
    </div>

    <div id="admin-panel" class="hidden fixed inset-0 bg-black/98 p-8 z-50 overflow-y-auto backdrop-blur-3xl">
        <div class="flex justify-between items-center mb-12 max-w-xl mx-auto">
            <h2 class="text-3xl font-black text-yellow-500 italic uppercase">Admin Control</h2>
            <button onclick="closeAdmin()" class="text-white text-5xl font-thin">&times;</button>
        </div>
        <div id="admin-user-list" class="space-y-4 max-w-xl mx-auto"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://dazgtsobkykxwsvbmjfn.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRhemd0c29ia3lreHdzdmJtamZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxOTg4NTYsImV4cCI6MjA4ODc3NDg1Nn0.Ci_Hzqzf9Px8LTg7dNOXcu1dcTzBYWioH2yaFP2h6rI'; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentTab = 'A';
        let timerInterval;
        const beep = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-software-interface-start-2574.mp3');

        // AUTH
        async function handleSignIn() {
            const userF = document.getElementById('insta-user').value.trim().replace('@', '');
            const passF = document.getElementById('password').value;
            const { data, error } = await _supabase.auth.signInWithPassword({ email: `${userF}@sanjafit.com`, password: passF });
            if (error) return alert("Erro no Login.");
            const { data: profile } = await _supabase.from('profiles').select('*').eq('id', data.user.id).single();
            if (profile?.is_banned) { await _supabase.auth.signOut(); return alert("Acesso suspenso."); }
            initApp(data.user, profile);
        }

        async function handleSignUp() {
            const userF = document.getElementById('insta-user').value.trim().replace('@', '');
            const passF = document.getElementById('password').value;
            const { error } = await _supabase.auth.signUp({
                email: `${userF}@sanjafit.com`, password: passF, options: { data: { instagram: `@${userF}` } }
            });
            if (error) alert(error.message); else alert("Conta Criada! Clique em Entrar.");
        }

        function initApp(user, profile) {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('app-section').classList.remove('hidden');
            document.getElementById('user-display-name').innerText = user.user_metadata.instagram;
            if(profile?.role === 'admin') document.getElementById('admin-btn').classList.remove('hidden');
            loadExercises();
            updateStats();
        }

        // TREINOS
        async function loadExercises() {
            const { data } = await _supabase.from('workouts').select('*').eq('category', currentTab).order('created_at', {ascending: true});
            const list = document.getElementById('exercise-list');
            list.innerHTML = data.length ? data.map(ex => `
                <div class="bg-white/5 p-6 rounded-3xl flex justify-between items-center border border-white/5 hover:border-blue-500/50 transition-all" onclick="startTimer()">
                    <div><h4 class="font-black text-white uppercase text-sm italic italic tracking-tight italic tracking-tighter">${ex.exercise_name}</h4><p class="text-[9px] text-blue-500 font-bold uppercase tracking-widest">${ex.weight}kg • 3x12</p></div>
                    <button onclick="event.stopPropagation(); deleteEx('${ex.id}')" class="text-gray-700 hover:text-red-500 transition-colors text-xl font-thin">&times;</button>
                </div>
            `).join('') : '<p class="text-center py-10 text-gray-700 text-[10px] uppercase font-bold italic tracking-widest">Sem exercícios salvos.</p>';
        }

        async function addExercisePrompt() {
            const n = prompt("Nome do Exercício:");
            const w = prompt("Carga (kg):");
            if(!n) return;
            const { data: { user } } = await _supabase.auth.getUser();
            await _supabase.from('workouts').insert([{ user_id: user.id, category: currentTab, exercise_name: n, weight: w }]);
            loadExercises();
        }

        async function deleteEx(id) {
            if(!confirm("Remover exercício?")) return;
            await _supabase.from('workouts').delete().eq('id', id);
            loadExercises();
        }

        // TIMER
        function startTimer() {
            stopTimer();
            let t = 60;
            document.getElementById('timer-display').classList.remove('hidden');
            document.getElementById('timer-seconds').innerText = t + "s";
            timerInterval = setInterval(() => {
                t--; document.getElementById('timer-seconds').innerText = t + "s";
                if(t <= 0) { stopTimer(); beep.play(); alert("Descanso Finalizado!"); }
            }, 1000);
        }
        function stopTimer() { clearInterval(timerInterval); document.getElementById('timer-display').classList.add('hidden'); }

        // STATS
        async function finishWorkout() {
            if(!confirm("Concluir treino de hoje?")) return;
            const { data: { user } } = await _supabase.auth.getUser();
            await _supabase.from('workout_history').insert([{ user_id: user.id, category: currentTab }]);
            alert("Treino batido!");
            updateStats();
        }

        async function updateStats() {
            const { data: history } = await _supabase.from('workout_history').select('*').order('completed_at', {ascending: false});
            const count = history ? history.length : 0;
            const percent = Math.min((count / 20) * 100, 100);
            
            document.getElementById('goal-bar').style.width = percent + '%';
            document.getElementById('goal-text').innerText = `${count} / 20 Treinos`;
            document.getElementById('goal-percent').innerText = Math.floor(percent) + '%';

            if(count >= 1) document.getElementById('trophy-1').classList.add('trophy-active');
            if(count >= 10) document.getElementById('trophy-2').classList.add('trophy-active');
            if(count >= 20) document.getElementById('trophy-3').classList.add('trophy-active');

            document.getElementById('history-list').innerHTML = history.slice(0, 5).map(h => `
                <div class="bg-white/5 p-4 rounded-2xl flex justify-between items-center text-[10px] italic">
                    <span class="font-black uppercase text-blue-500">Treino ${h.category}</span>
                    <span class="text-gray-500 font-black">${new Date(h.completed_at).toLocaleDateString('pt-BR')}</span>
                </div>
            `).join('');
        }

        // ADMIN
        async function openAdmin() {
            document.getElementById('admin-panel').classList.remove('hidden');
            const { data } = await _supabase.from('profiles').select('*');
            document.getElementById('admin-user-list').innerHTML = data.map(u => `
                <div class="glass p-6 rounded-3xl flex justify-between items-center mb-2">
                    <p class="font-black italic text-blue-400 uppercase tracking-tighter">${u.instagram || 'Anônimo'}</p>
                    <button onclick="toggleBan('${u.id}', ${u.is_banned})" class="${u.is_banned ? 'text-green-500' : 'text-red-500'} font-black text-[9px] uppercase tracking-widest">
                        ${u.is_banned ? '[Ativar]' : '[Banir]'}
                    </button>
                </div>
            `).join('');
        }

        async function toggleBan(id, st) {
            await _supabase.from('profiles').update({ is_banned: !st }).eq('id', id);
            openAdmin();
        }

        function changeTab(tab, btn) {
            currentTab = tab;
            document.getElementById('current-tab-label').innerText = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active-tab'));
            btn.classList.add('active-tab');
            loadExercises();
        }
        function closeAdmin() { document.getElementById('admin-panel').classList.add('hidden'); }
        function logout() { window.location.reload(); }
    </script>
</body>
</html>
