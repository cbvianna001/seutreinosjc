<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SanjaFit | Arena Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; min-height: 100vh; overflow-x: hidden; }
        .nav-bottom { background: rgba(0,0,0,0.95); backdrop-filter: blur(10px); border-top: 1px solid #262626; position: fixed; bottom: 0; width: 100%; height: 75px; z-index: 1000; display: grid; grid-template-columns: repeat(4, 1fr); align-items: center; justify-items: center; }
        .active-nav { color: #3b82f6; transform: scale(1.1); }
        .glass-card { background: #121212; border: 1px solid #262626; border-radius: 12px; }
        .modal-full { display: none; position: fixed; inset: 0; background: #000; z-index: 2000; padding: 20px; flex-direction: column; overflow-y: auto; }
        .photo-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 3000; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        input, select, textarea { background: #121212 !important; border: 1px solid #262626 !important; color: white !important; outline: none; border-radius: 8px; padding: 12px; width: 100%; }
        .btn-blue { background-color: #0095f6; border-radius: 8px; font-weight: 700; transition: 0.2s; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-24">

    <div id="modal-user-profile" class="modal-full">
        <div class="flex justify-between items-center mb-6 sticky top-0 bg-black py-2 z-50">
            <h2 id="v-user-handle" class="text-sm font-black uppercase text-blue-500 italic">@atleta</h2>
            <button onclick="closeUserProfile()" class="text-2xl">✕</button>
        </div>
        <div class="space-y-6">
            <div class="flex items-center gap-6">
                <div class="w-24 h-24 rounded-full border border-[#262626] overflow-hidden bg-zinc-900 flex items-center justify-center">
                    <img id="v-user-avatar" src="" class="w-full h-full object-cover hidden">
                    <span id="v-user-icon" class="text-3xl text-zinc-800">👤</span>
                </div>
                <div class="flex flex-1 justify-around text-center uppercase font-black text-[10px]">
                    <div><p id="v-user-photos-count" class="text-base font-bold">0</p>Posts</div>
                    <div><p id="v-user-followers-count" class="text-base font-bold">0</p>Amigos</div>
                    <div><p id="v-user-likes-count" class="text-base font-bold">0</p>Likes</div>
                </div>
            </div>
            <div class="space-y-1">
                <h2 id="v-user-name" class="font-black text-lg">Nome</h2>
                <p id="v-user-bio" class="text-xs text-gray-400 italic"></p>
                <div id="v-user-follow-area" class="pt-4"></div>
            </div>
            <div id="v-user-gallery" class="grid grid-cols-3 gap-[1px]"></div>
        </div>
    </div>

    <div id="photo-zoom" class="photo-overlay">
        <button onclick="closePhotoZoom()" class="absolute top-6 right-6 text-3xl">✕</button>
        <img id="zoom-img" src="" class="max-w-full max-h-[65vh] rounded-lg border border-[#262626] mb-4">
        <div class="w-full max-w-sm text-center">
            <div id="zoom-actions" class="flex justify-center gap-10 items-center">
                <button id="btn-like-zoom" class="text-4xl">🤍</button>
            </div>
            <p id="zoom-likes-display" class="mt-4 text-[10px] font-black text-gray-600 uppercase"></p>
        </div>
    </div>

    <div id="section-app" class="hidden max-w-lg mx-auto">
        <header class="p-4 border-b border-[#262626] flex justify-between items-center sticky top-0 bg-black z-50">
            <h1 class="text-xl font-black italic tracking-tighter uppercase">Sanja<span class="text-blue-500">Fit</span></h1>
            <button onclick="handleSignOut()" class="text-[10px] font-bold text-red-500 uppercase">Sair</button>
        </header>

        <div id="view-championship" class="p-4">
            <div id="ranking-list" class="space-y-3"></div>
        </div>

        <div id="view-search" class="hidden p-4 space-y-6">
            <input id="search-input" type="text" oninput="filterAthletes()" placeholder="Pesquisar @atleta..." class="glass-card">
            <div id="search-results" class="space-y-3"></div>
        </div>

        <div id="view-stats" class="hidden p-4 space-y-6">
            <div class="flex gap-2">
                <button onclick="changeLetter('A', this)" class="letter-btn px-6 py-2 rounded-full border border-[#262626] text-[10px] font-black active-nav">A</button>
                <button onclick="changeLetter('B', this)" class="letter-btn px-6 py-2 rounded-full border border-[#262626] text-[10px] font-black">B</button>
            </div>
            <div id="list-workouts" class="space-y-2"></div>
        </div>

        <div id="view-profile" class="hidden p-6 text-center">
            <div class="flex justify-center mb-6">
                <div class="w-24 h-24 rounded-full border-2 border-blue-500 overflow-hidden bg-zinc-900">
                    <img id="my-avatar-img" src="" class="w-full h-full object-cover hidden">
                </div>
            </div>
            <h2 id="my-name" class="font-black text-xl uppercase">Carregando...</h2>
            <p id="my-handle" class="text-blue-500 text-xs font-bold mb-6">@atleta</p>
            <div id="my-gallery" class="grid grid-cols-3 gap-1"></div>
        </div>

        <nav class="nav-bottom">
            <button onclick="switchView('championship')" id="nav-championship" class="active-nav text-2xl">🏆</button>
            <button onclick="switchView('search')" id="nav-search" class="text-2xl">🔍</button>
            <button onclick="switchView('stats')" id="nav-stats" class="text-2xl">📋</button>
            <button onclick="switchView('profile')" id="nav-profile" class="text-2xl">👤</button>
        </nav>
    </div>

    <div id="section-login" class="hidden flex flex-col items-center justify-center min-h-screen p-6 text-center">
        <h1 class="text-4xl font-black italic mb-10 uppercase italic">Sanja<span class="text-blue-500">Fit</span></h1>
        <input id="login-user" type="text" placeholder="@seu_instagram" class="rounded-xl mb-4">
        <input id="login-pass" type="password" placeholder="Senha" class="rounded-xl mb-4">
        <button onclick="handleSignIn()" class="w-full btn-blue p-4 uppercase font-black text-sm max-w-xs">Entrar</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://dazgtsobkykxwsvbmjfn.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRhemd0c29ia3lreHdzdmJtamZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxOTg4NTYsImV4cCI6MjA4ODc3NDg1Nn0.Ci_Hzqzf9Px8LTg7dNOXcu1dcTzBYWioH2yaFP2h6rI';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null, currentLetter = 'A', allProfiles = [];

        window.onload = async () => {
            const { data: { user } } = await _supabase.auth.getUser();
            if(user) { currentUser = user; initApp(); } 
            else { document.getElementById('section-login').classList.remove('hidden'); }
        };

        async function initApp() {
            document.getElementById('section-login').classList.add('hidden');
            document.getElementById('section-app').classList.remove('hidden');
            await loadRanking();
            await loadMyProfile();
        }

        async function handleSignIn() {
            const u = document.getElementById('login-user').value.trim().replace('@',''), p = document.getElementById('login-pass').value;
            const { error } = await _supabase.auth.signInWithPassword({ email: `${u}@sanjafit.com`, password: p });
            if(error) alert("Erro!"); else location.reload();
        }

        async function loadRanking() {
            const { data } = await _supabase.from('profiles').select('*').order('xp', {ascending: false});
            allProfiles = data || [];
            document.getElementById('ranking-list').innerHTML = allProfiles.map((p, i) => `
                <div class="flex items-center justify-between p-4 glass-card" onclick="openUserProfile('${p.id}')">
                    <div class="flex items-center gap-3">
                        <span class="text-[10px] font-black">${i+1}º</span>
                        <img src="${p.avatar_url || ''}" class="w-10 h-10 rounded-full object-cover bg-zinc-800 ${p.avatar_url?'':'hidden'}">
                        <p class="text-xs font-bold uppercase italic">${p.instagram}</p>
                    </div>
                    <span class="text-[9px] font-black text-blue-500">${p.xp || 0} XP</span>
                </div>`).join('');
        }

        // --- FUNÇÃO BLINDADA PARA ABRIR PERFIL ---
        async function openUserProfile(userId) {
            try {
                const { data: p, error } = await _supabase.from('profiles').select('*').eq('id', userId).single();
                if(error || !p) return;

                document.getElementById('v-user-handle').innerText = p.instagram;
                document.getElementById('v-user-name').innerText = p.full_name || "Atleta";
                document.getElementById('v-user-bio').innerText = p.bio || "";
                
                const avatar = document.getElementById('v-user-avatar');
                if(p.avatar_url) {
                    avatar.src = p.avatar_url; avatar.classList.remove('hidden');
                    document.getElementById('v-user-icon').classList.add('hidden');
                } else {
                    avatar.classList.add('hidden');
                    document.getElementById('v-user-icon').classList.remove('hidden');
                }

                // Carrega Fotos e Amigos com fallback (se der erro ou vir vazio, vira 0)
                const { data: photos } = await _supabase.from('evolution_gallery').select('*, likes(user_id)').eq('user_id', userId);
                const { count: friends } = await _supabase.from('connections').select('*', {count: 'exact', head: true}).eq('following_id', userId).eq('status', 'accepted');
                
                const photoList = photos || [];
                const totalLikes = photoList.reduce((acc, curr) => acc + (curr.likes?.length || 0), 0);

                document.getElementById('v-user-photos-count').innerText = photoList.length;
                document.getElementById('v-user-followers-count').innerText = friends || 0;
                document.getElementById('v-user-likes-count').innerText = totalLikes;

                document.getElementById('v-user-gallery').innerHTML = photoList.map(ph => `
                    <img src="${ph.photo_url}" class="aspect-square object-cover" onclick="openPhotoZoom('${ph.id}','${ph.photo_url}',false)">
                `).join('');

                // Botão Seguir
                const { data: conn } = await _supabase.from('connections').select('*').or(`and(follower_id.eq.${currentUser.id},following_id.eq.${userId}),and(follower_id.eq.${userId},following_id.eq.${currentUser.id})`).single();
                const status = conn ? conn.status : 'none';
                document.getElementById('v-user-follow-area').innerHTML = userId === currentUser.id ? '' : `
                    <button onclick="toggleFollow('${userId}', '${status}')" class="w-full ${status === 'none' ? 'btn-blue' : 'bg-zinc-800'} p-2 rounded text-[10px] font-black uppercase italic">
                        ${status === 'accepted' ? 'Amigos ✅' : status === 'pending' ? 'Pendente ⏳' : 'Seguir 🔥'}
                    </button>`;

                document.getElementById('modal-user-profile').style.display = 'flex';
            } catch (err) {
                console.error("Erro ao abrir perfil:", err);
            }
        }

        function closeUserProfile() { document.getElementById('modal-user-profile').style.display = 'none'; }

        async function toggleFollow(targetId, currentStatus) {
            if (currentStatus === 'none') {
                await _supabase.from('connections').insert([{ follower_id: currentUser.id, following_id: targetId, status: 'pending' }]);
            } else {
                await _supabase.from('connections').delete().or(`and(follower_id.eq.${currentUser.id},following_id.eq.${targetId}),and(follower_id.eq.${targetId},following_id.eq.${currentUser.id})`);
            }
            openUserProfile(targetId);
        }

        function switchView(v) {
            ['championship','search','stats','profile'].forEach(id => {
                document.getElementById('view-'+id).classList.add('hidden');
                document.getElementById('nav-'+id).classList.remove('active-nav');
            });
            document.getElementById('view-'+v).classList.remove('hidden');
            document.getElementById('nav-'+v).classList.add('active-nav');
        }

        function handleSignOut() { _supabase.auth.signOut(); location.reload(); }
        function openPhotoZoom(id, url) { document.getElementById('zoom-img').src = url; document.getElementById('photo-zoom').style.display = 'flex'; }
        function closePhotoZoom() { document.getElementById('photo-zoom').style.display = 'none'; }
    </script>
</body>
</html>
