<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SanjaFit | Social Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; min-height: 100vh; }
        .nav-bottom { background: #000; border-top: 1px solid #262626; position: fixed; bottom: 0; width: 100%; height: 65px; z-index: 1000; display: flex; justify-content: space-around; align-items: center; }
        .glass-card { background: #121212; border: 1px solid #262626; border-radius: 12px; }
        .active-nav { color: #3b82f6; transform: scale(1.1); transition: 0.2s; }
        input, select, textarea { background: #121212 !important; border: 1px solid #262626 !important; color: white !important; outline: none; }
        .post-card { border-bottom: 1px solid #262626; padding-bottom: 10px; }
    </style>
</head>
<body class="pb-20">

    <div id="section-login" class="flex flex-col items-center justify-center min-h-screen p-6">
        <h1 class="text-3xl font-black italic mb-10 uppercase">Sanja<span class="text-blue-500">Fit</span></h1>
        <div class="w-full max-w-sm space-y-4">
            <input id="login-user" type="text" placeholder="@seu_instagram" class="w-full p-4 rounded-lg">
            <input id="login-pass" type="password" placeholder="Senha" class="w-full p-4 rounded-lg">
            <button onclick="handleSignIn()" class="w-full bg-blue-600 p-4 rounded-lg font-bold uppercase">Entrar</button>
        </div>
    </div>

    <div id="section-app" class="hidden max-w-lg mx-auto">
        <header class="p-4 border-b border-[#262626] flex justify-between items-center sticky top-0 bg-black z-50">
            <h1 class="font-black italic text-xl">Sanja<span class="text-blue-500">Fit</span></h1>
            <button onclick="handleSignOut()" class="text-[10px] text-red-500 font-bold uppercase">Sair</button>
        </header>

        <div id="view-feed" class="p-0 space-y-2">
            <div id="feed-list"></div>
        </div>

        <div id="view-search" class="hidden p-4 space-y-4">
            <input id="search-input" type="text" oninput="filterAthletes()" placeholder="Pesquisar por @ ou nome..." class="w-full p-3 rounded-xl">
            <div id="ranking-list" class="space-y-4"></div>
        </div>

        <div id="view-profile" class="hidden">
            <div class="p-6 space-y-6">
                <div class="flex items-center gap-6">
                    <div class="relative">
                        <div class="w-20 h-20 rounded-full border border-[#262626] overflow-hidden bg-[#121212] flex items-center justify-center">
                            <img id="profile-img-display" src="" class="w-full h-full object-cover hidden">
                            <span id="profile-icon" class="text-3xl">👤</span>
                        </div>
                        <button onclick="document.getElementById('file-avatar').click()" class="absolute bottom-0 right-0 bg-blue-600 p-1.5 rounded-full text-[10px]">📷</button>
                        <input type="file" id="file-avatar" accept="image/*" class="hidden" onchange="uploadAvatar()">
                    </div>
                    <div class="flex flex-1 justify-around text-center text-xs">
                        <div><p id="stat-photos" class="font-bold">0</p><p class="text-gray-500 uppercase">Posts</p></div>
                        <div><p id="stat-likes" class="font-bold">0</p><p class="text-gray-500 uppercase">Likes</p></div>
                    </div>
                </div>
                <div>
                    <h2 id="profile-name-real" class="font-black text-lg">Atleta</h2>
                    <h3 id="profile-handle" class="text-xs text-blue-500 font-bold">@atleta</h3>
                    <p id="profile-bio" class="text-xs text-gray-400 mt-1 italic">Bio vazia...</p>
                    <button onclick="toggleEditProfile()" class="w-full bg-[#262626] p-2 rounded-md text-[10px] font-bold mt-4 uppercase">Editar Perfil</button>
                </div>

                <div id="profile-edit-form" class="hidden space-y-3 glass-card p-4">
                    <input id="edit-full-name" type="text" placeholder="Nome Verdadeiro" class="w-full p-2 text-xs">
                    <textarea id="edit-bio" class="w-full p-2 text-xs h-16" placeholder="Sua bio..."></textarea>
                    <button onclick="saveProfileData()" class="w-full bg-blue-600 p-2 rounded text-xs font-bold">SALVAR</button>
                </div>
            </div>
            <div id="my-gallery" class="grid grid-cols-3 gap-[1px]"></div>
        </div>

        <nav class="nav-bottom">
            <button onclick="switchView('feed')" id="nav-feed" class="text-2xl active-nav">🏠</button>
            <button onclick="switchView('search')" id="nav-search" class="text-2xl">🔍</button>
            <button onclick="switchView('profile')" id="nav-profile" class="text-2xl">👤</button>
        </nav>
    </div>

    <script>
        const SUPABASE_URL = 'https://dazgtsobkykxwsvbmjfn.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRhemd0c29ia3lreHdzdmJtamZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxOTg4NTYsImV4cCI6MjA4ODc3NDg1Nn0.Ci_Hzqzf9Px8LTg7dNOXcu1dcTzBYWioH2yaFP2h6rI';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null, allProfiles = [];

        async function initApp(user) {
            currentUser = user;
            document.getElementById('section-login').classList.add('hidden');
            document.getElementById('section-app').classList.remove('hidden');
            
            // Corrige se o usuário não tem perfil
            const { data: prof } = await _supabase.from('profiles').select('*').eq('id', user.id).single();
            if(!prof) await _supabase.from('profiles').insert([{ id: user.id, instagram: user.user_metadata.instagram || '@atleta' }]);
            
            loadPublicFeed(); loadRanking(); loadProfileData();
        }

        async function loadPublicFeed() {
            const { data: posts, error } = await _supabase.from('evolution_gallery').select('*, profiles(instagram, full_name, avatar_url), likes(user_id)').order('created_at', {ascending: false});
            if(error) return;
            document.getElementById('feed-list').innerHTML = posts.map(p => `
                <div class="post-card">
                    <div class="flex items-center gap-3 p-3">
                        <img src="${p.profiles?.avatar_url || ''}" class="w-8 h-8 rounded-full bg-zinc-800 ${p.profiles?.avatar_url ? '' : 'hidden'}">
                        <span class="text-xs font-bold">${p.profiles?.instagram || '@atleta'}</span>
                    </div>
                    <img src="${p.photo_url}" class="w-full aspect-square object-cover">
                    <div class="p-3"><p class="text-xs font-bold">${p.likes?.length || 0} curtidas</p></div>
                </div>`).join('');
        }

        async function loadRanking() {
            const { data } = await _supabase.from('profiles').select('*');
            allProfiles = data || [];
            filterAthletes();
        }

        function filterAthletes() {
            const term = document.getElementById('search-input').value.toLowerCase();
            const filtered = allProfiles.filter(p => (p.instagram?.toLowerCase().includes(term) || p.full_name?.toLowerCase().includes(term)) && p.id !== currentUser.id);
            document.getElementById('ranking-list').innerHTML = filtered.map(p => `
                <div class="flex items-center justify-between p-3 glass-card">
                    <div class="flex items-center gap-3">
                        <img src="${p.avatar_url || ''}" class="w-10 h-10 rounded-full bg-zinc-800 ${p.avatar_url ? '' : 'hidden'}">
                        <span class="text-xs font-bold">${p.instagram}</span>
                    </div>
                    <button class="bg-blue-600 px-4 py-1 rounded text-[10px] font-bold">VER</button>
                </div>`).join('');
        }

        async function loadProfileData() {
            const { data: p } = await _supabase.from('profiles').select('*').eq('id', currentUser.id).single();
            if(!p) return;
            document.getElementById('profile-name-real').innerText = p.full_name || "Atleta SanjaFit";
            document.getElementById('profile-handle').innerText = p.instagram;
            document.getElementById('profile-bio').innerText = p.bio || "Adicione uma bio...";
            if(p.avatar_url) {
                const img = document.getElementById('profile-img-display');
                img.src = p.avatar_url; img.classList.remove('hidden');
                document.getElementById('profile-icon').classList.add('hidden');
            }
            const { data: myPosts } = await _supabase.from('evolution_gallery').select('*').eq('user_id', currentUser.id);
            document.getElementById('stat-photos').innerText = myPosts?.length || 0;
            document.getElementById('my-gallery').innerHTML = (myPosts || []).map(m => `<img src="${m.photo_url}" class="aspect-square object-cover">`).join('');
        }

        function toggleEditProfile() { document.getElementById('profile-edit-form').classList.toggle('hidden'); }

        async function saveProfileData() {
            const full_name = document.getElementById('edit-full-name').value;
            const bio = document.getElementById('edit-bio').value;
            await _supabase.from('profiles').update({ full_name, bio }).eq('id', currentUser.id);
            location.reload();
        }

        async function uploadAvatar() {
            const f = document.getElementById('file-avatar').files[0];
            const comp = await imageCompression(f, { maxSizeMB: 0.1, maxWidthOrHeight: 400 });
            const name = `avatar_${currentUser.id}.jpg`;
            await _supabase.storage.from('shapes').upload(name, comp, { upsert: true });
            const { data: url } = _supabase.storage.from('shapes').getPublicUrl(name);
            await _supabase.from('profiles').update({ avatar_url: url.publicUrl }).eq('id', currentUser.id);
            location.reload();
        }

        function switchView(v) {
            ['feed','search','profile'].forEach(id => {
                document.getElementById('view-'+id).classList.add('hidden');
                document.getElementById('nav-'+id).classList.remove('active-nav');
            });
            document.getElementById('view-'+v).classList.remove('hidden');
            document.getElementById('nav-'+v).classList.add('active-nav');
        }

        async function handleSignIn() {
            const u = document.getElementById('login-user').value.trim().replace('@',''), p = document.getElementById('login-pass').value;
            const { data, error } = await _supabase.auth.signInWithPassword({ email: `${u}@sanjafit.com`, password: p });
            if(error) alert("Erro!"); else location.reload();
        }

        async function handleSignOut() { await _supabase.auth.signOut(); localStorage.clear(); location.reload(); }

        window.onload = async () => {
            const { data: { user } } = await _supabase.auth.getUser();
            if(user) initApp(user);
        };
    </script>
</body>
</html>
