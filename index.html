<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SanjaFit | Turbo Evolution</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.95)), 
                        url('https://images.unsplash.com/photo-1540497077202-7c8a3999166f?q=80&w=2070&auto=format&fit=crop');
            background-size: cover; background-position: center; background-attachment: fixed;
        }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .active-tab { background: #3b82f6 !important; box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); border: none !important; }
        .active-view { border-bottom: 3px solid #3b82f6; color: white !important; }
        .loader { border-top-color: #3b82f6; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-white min-h-screen pb-20">

    <div id="auth-section" class="flex flex-col items-center justify-center min-h-screen p-6">
        <h1 class="text-6xl font-black italic text-blue-500 uppercase mb-2 tracking-tighter">SANJA<span class="text-white">FIT</span></h1>
        <div class="glass p-8 rounded-[2.5rem] w-full max-w-md shadow-2xl mt-4">
            <input id="insta-user" type="text" placeholder="@seu_instagram" class="w-full p-4 mb-4 rounded-xl bg-black/40 border border-white/10 outline-none focus:border-blue-500">
            <input id="password" type="password" placeholder="Sua Senha" class="w-full p-4 mb-8 rounded-xl bg-black/40 border border-white/10 outline-none focus:border-blue-500">
            <button onclick="handleSignIn()" class="w-full bg-blue-600 hover:bg-blue-700 p-4 rounded-xl font-black uppercase tracking-widest shadow-lg active:scale-95 transition-all">Entrar</button>
            <div class="flex justify-between mt-6">
                <button onclick="handleSignUp()" class="text-[9px] text-gray-500 font-bold uppercase hover:text-white">Criar Conta</button>
                <button onclick="toggleAdminLogin()" class="text-[9px] text-yellow-600 font-black uppercase tracking-tighter hover:text-yellow-400">Admin</button>
            </div>
        </div>
    </div>

    <div id="app-section" class="hidden max-w-2xl mx-auto p-4">
        <header class="flex justify-between items-center py-6">
            <h2 id="user-display-name" class="text-2xl font-black italic uppercase tracking-tighter">@USUARIO</h2>
            <button onclick="logout()" class="text-red-400 text-[10px] font-black uppercase px-3 py-1 border border-red-900/30 rounded-lg">Sair</button>
        </header>

        <div class="flex border-b border-white/10 mb-8 font-black uppercase text-[10px] tracking-widest text-center">
            <button onclick="showView('workouts')" id="nav-workouts" class="flex-1 py-4 text-gray-500 active-view">Treinos</button>
            <button onclick="showView('evolution')" id="nav-evolution" class="flex-1 py-4 text-gray-500">Evolução Shape</button>
        </div>

        <div id="view-workouts">
            <div class="grid grid-cols-4 gap-3 mb-8">
                <button onclick="changeTab('A', this)" class="tab-btn p-5 rounded-2xl glass font-black text-xl active-tab transition-all">A</button>
                <button onclick="changeTab('B', this)" class="tab-btn p-5 rounded-2xl glass font-black text-xl transition-all">B</button>
                <button onclick="changeTab('C', this)" class="tab-btn p-5 rounded-2xl glass font-black text-xl transition-all">C</button>
                <button onclick="changeTab('D', this)" class="tab-btn p-5 rounded-2xl glass font-black text-xl transition-all">D</button>
            </div>
            <div class="glass rounded-[2.5rem] p-8 shadow-2xl mb-8">
                <div class="flex justify-between items-center mb-8">
                    <h3 class="text-2xl font-black italic uppercase tracking-tighter">Treino <span id="current-tab-label" class="text-blue-500">A</span></h3>
                    <button onclick="addExercisePrompt()" class="bg-blue-600 text-white px-4 py-2 rounded-full text-[9px] font-black uppercase">+ Add</button>
                </div>
                <div id="exercise-list" class="space-y-4"></div>
            </div>
        </div>

        <div id="view-evolution" class="hidden">
            <div class="glass p-8 rounded-[2.5rem] mb-8 border border-blue-500/20 shadow-lg">
                <h3 class="text-xl font-black italic uppercase mb-6 text-center">Novo Registro de Shape</h3>
                <div class="space-y-4">
                    <div class="relative">
                        <input type="file" id="photo-file" accept="image/*" class="hidden">
                        <label for="photo-file" class="flex items-center justify-center w-full p-4 rounded-xl bg-black/40 border border-dashed border-white/20 cursor-pointer hover:border-blue-500 transition-all">
                            <span class="text-xs text-gray-400 font-bold uppercase" id="file-label">Selecionar Foto da Galeria</span>
                        </label>
                    </div>
                    <input type="number" id="body-weight" placeholder="Seu Peso Atual (kg)" class="w-full p-4 rounded-xl bg-black/40 border border-white/10 outline-none focus:border-blue-500 transition-all">
                    <button id="upload-btn" onclick="uploadPhoto()" class="w-full bg-green-600 hover:bg-green-700 p-4 rounded-xl font-black uppercase tracking-widest text-xs flex items-center justify-center gap-2">
                        <span>Salvar Evolução</span>
                        <div id="upload-spinner" class="hidden loader ease-linear rounded-full border-2 border-t-2 border-white h-4 w-4"></div>
                    </button>
                </div>
            </div>
            <div id="photo-gallery" class="grid grid-cols-2 gap-4">
                </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://dazgtsobkykxwsvbmjfn.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRhemd0c29ia3lreHdzdmJtamZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxOTg4NTYsImV4cCI6MjA4ODc3NDg1Nn0.Ci_Hzqzf9Px8LTg7dNOXcu1dcTzBYWioH2yaFP2h6rI'; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentTab = 'A';
        let isAdminMode = false;

        // Feedback do nome do arquivo
        document.getElementById('photo-file')?.addEventListener('change', function(e) {
            const fileName = e.target.files[0]?.name || "Selecionar Foto da Galeria";
            document.getElementById('file-label').innerText = fileName;
        });

        async function handleSignIn() {
            const userF = document.getElementById('insta-user').value.trim().replace('@', '');
            const passF = document.getElementById('password').value;
            const email = isAdminMode ? `${userF}@sanjafit.admin` : `${userF}@sanjafit.com`;
            const { data, error } = await _supabase.auth.signInWithPassword({ email, password: passF });
            if (error) return alert("Erro no Login. Verifique credenciais.");
            initApp(data.user);
        }

        async function handleSignUp() {
            const userF = document.getElementById('insta-user').value.trim().replace('@', '');
            const passF = document.getElementById('password').value;
            if(!userF || passF.length < 6) return alert("Preencha @ e senha 6+ dígitos.");
            const { error } = await _supabase.auth.signUp({ email: `${userF}@sanjafit.com`, password: passF, options: { data: { instagram: `@${userF}` } } });
            if (error) alert(error.message); else alert("Conta Criada!");
        }

        function initApp(user) {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('app-section').classList.remove('hidden');
            document.getElementById('user-display-name').innerText = user.user_metadata.instagram;
            loadExercises();
            loadGallery();
        }

        // LÓGICA DE UPLOAD PARA BUCKET 'FORMAS'
        async function uploadPhoto() {
            const fileInput = document.getElementById('photo-file');
            const weight = document.getElementById('body-weight').value;
            const btn = document.getElementById('upload-btn');
            const spinner = document.getElementById('upload-spinner');

            if (!fileInput.files[0] || !weight) return alert("Selecione a foto e informe o peso.");

            btn.disabled = true;
            spinner.classList.remove('hidden');

            const file = fileInput.files[0];
            const fileExt = file.name.split('.').pop();
            const fileName = `${Date.now()}.${fileExt}`;
            const filePath = `${fileName}`;

            // 1. Upload para 'FORMAS'
            const { error: uploadError } = await _supabase.storage
                .from('FORMAS')
                .upload(filePath, file);

            if (uploadError) {
                alert("Erro upload: " + uploadError.message);
                btn.disabled = false; spinner.classList.add('hidden');
                return;
            }

            // 2. URL Pública
            const { data: urlData } = _supabase.storage.from('FORMAS').getPublicUrl(filePath);

            // 3. Salvar na Tabela evolution_gallery
            const { data: { user } } = await _supabase.auth.getUser();
            await _supabase.from('evolution_gallery').insert([{
                user_id: user.id,
                photo_url: urlData.publicUrl,
                body_weight: weight
            }]);

            alert("Evolução registrada com sucesso!");
            fileInput.value = "";
            document.getElementById('body-weight').value = "";
            document.getElementById('file-label').innerText = "Selecionar Foto da Galeria";
            btn.disabled = false; spinner.classList.add('hidden');
            loadGallery();
        }

        async function loadGallery() {
            const { data } = await _supabase.from('evolution_gallery').select('*').order('created_at', {ascending: false});
            const gallery = document.getElementById('photo-gallery');
            if(!data) return;
            gallery.innerHTML = data.map(p => `
                <div class="bg-black/40 rounded-3xl overflow-hidden border border-white/5 shadow-xl">
                    <img src="${p.photo_url}" class="w-full h-40 object-cover grayscale hover:grayscale-0 transition-all">
                    <div class="p-4 text-[10px] font-black uppercase">
                        <p class="text-blue-500">${new Date(p.created_at).toLocaleDateString()}</p>
                        <p class="text-white">${p.body_weight} KG</p>
                    </div>
                </div>
            `).join('');
        }

        function showView(view) {
            document.getElementById('view-workouts').classList.toggle('hidden', view !== 'workouts');
            document.getElementById('view-evolution').classList.toggle('hidden', view !== 'evolution');
            document.getElementById('nav-workouts').classList.toggle('active-view', view === 'workouts');
            document.getElementById('nav-evolution').classList.toggle('active-view', view === 'evolution');
        }

        async function loadExercises() {
            const { data } = await _supabase.from('workouts').select('*').eq('category', currentTab).order('created_at', {ascending: true});
            document.getElementById('exercise-list').innerHTML = data.map(ex => `
                <div class="bg-white/5 p-6 rounded-3xl flex justify-between items-center border border-white/5">
                    <div>
                        <h4 class="font-black text-white uppercase text-sm italic italic tracking-tighter">${ex.exercise_name}</h4>
                        <p class="text-[9px] text-blue-500 font-bold uppercase tracking-widest">${ex.weight}kg • 3x12</p>
                    </div>
                </div>
            `).join('') || '<p class="text-center text-xs text-gray-600 py-10 uppercase font-black italic">Aba de Treino Vazia</p>';
        }

        async function addExercisePrompt() {
            const n = prompt("Exercício:"); const w = prompt("Carga (kg):");
            if(!n) return;
            const { data: { user } } = await _supabase.auth.getUser();
            await _supabase.from('workouts').insert([{ user_id: user.id, category: currentTab, exercise_name: n, weight: w }]);
            loadExercises();
        }

        function toggleAdminLogin() { isAdminMode = !isAdminMode; alert(isAdminMode ? "Modo Admin Ativo" : "Modo Aluno Ativo"); }
        function changeTab(tab, btn) { currentTab = tab; document.getElementById('current-tab-label').innerText = tab; document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active-tab')); btn.classList.add('active-tab'); loadExercises(); }
        function logout() { window.location.reload(); }
    </script>
</body>
</html>
