<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SanjaFit | Social Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; min-height: 100vh; overflow-x: hidden; }
        .nav-bottom { background: #000; border-top: 1px solid #262626; position: fixed; bottom: 0; width: 100%; height: 65px; z-index: 1000; display: flex; justify-content: space-around; align-items: center; }
        .btn-blue { background-color: #0095f6; border-radius: 8px; font-weight: 700; }
        .glass-card { background: #121212; border: 1px solid #262626; border-radius: 12px; }
        .active-nav { color: #3b82f6; transform: scale(1.1); }
        .post-card { border-bottom: 1px solid #262626; padding-bottom: 10px; }
        ::-webkit-scrollbar { display: none; }
        .modal-full { display: none; position: fixed; inset: 0; background: #000; z-index: 2000; padding: 20px; flex-direction: column; overflow-y: auto; }
        .notif-dot { position: absolute; top: 12px; right: 22%; width: 10px; height: 10px; background-color: #ef4444; border-radius: 50%; border: 2px solid #000; }
    </style>
</head>
<body class="pb-20">

    <div id="modal-user-profile" class="modal-full">
        <div class="flex justify-between items-center mb-6">
            <h2 id="view-user-handle" class="text-sm font-black uppercase italic">@atleta</h2>
            <button onclick="closeUserProfile()" class="text-2xl">✕</button>
        </div>
        <div id="user-profile-content" class="space-y-6">
            <div class="flex items-center gap-6">
                <div class="w-20 h-20 rounded-full border border-[#262626] overflow-hidden bg-zinc-900">
                    <img id="view-user-avatar" src="" class="w-full h-full object-cover hidden">
                </div>
                <div class="flex flex-1 justify-around text-center text-[10px] uppercase font-black">
                    <div><p id="view-user-photos" class="text-sm">0</p>Posts</div>
                    <div><p id="view-user-followers" class="text-sm">0</p>Amigos</div>
                </div>
            </div>
            <div>
                <h2 id="view-user-name" class="font-black">Nome</h2>
                <p id="view-user-bio" class="text-xs text-gray-400 mt-1 italic"></p>
            </div>
            <div id="view-user-gallery" class="grid grid-cols-3 gap-[1px]"></div>
        </div>
    </div>

    <div id="section-app" class="hidden max-w-lg mx-auto">
        <header class="sticky top-0 bg-black border-b border-[#262626] p-4 flex justify-between items-center z-50">
            <h1 class="text-xl font-black italic tracking-tighter">Sanja<span class="text-blue-500">Fit</span></h1>
            <button onclick="handleSignOut()" class="text-[10px] font-bold text-red-500 uppercase">Sair</button>
        </header>

        <div id="view-feed" class="p-0"><div id="feed-list" class="divide-y divide-[#262626]"></div></div>

        <div id="view-search" class="hidden p-4 space-y-6">
            <div id="area-requests" class="hidden space-y-2">
                <h3 class="text-[10px] font-bold text-gray-500 uppercase">Solicitações</h3>
                <div id="requests-list" class="space-y-2"></div>
            </div>
            <input id="search-input" type="text" oninput="filterAthletes()" placeholder="Pesquisar @ ou nome..." class="w-full p-3 rounded-xl bg-[#121212] border border-[#262626]">
            <div id="ranking-list" class="space-y-4"></div>
        </div>

        <div id="view-stats" class="hidden p-4 space-y-8">
            <div class="glass-card p-4 space-y-3">
                <h3 class="text-[10px] font-bold text-blue-500 uppercase italic">Calculadora de Macros</h3>
                <div class="flex gap-2">
                    <input id="m-weight" type="number" placeholder="Peso (kg)" class="w-full p-2 text-xs">
                    <select id="m-goal" class="w-full p-2 text-xs"><option value="lose">Cutting</option><option value="gain">Bulking</option></select>
                </div>
                <button onclick="calcMacros()" class="w-full btn-blue p-2 text-[10px] uppercase">Calcular</button>
                <div id="m-res" class="hidden grid grid-cols-3 gap-2 text-center text-[10px] font-black"><div class="bg-zinc-900 p-2 rounded">P: <span id="res-p"></span></div><div class="bg-zinc-900 p-2 rounded">C: <span id="res-c"></span></div><div class="bg-zinc-900 p-2 rounded">G: <span id="res-g"></span></div></div>
            </div>

            <div class="space-y-4">
                <div class="flex gap-2 overflow-x-auto pb-2">
                    <button onclick="changeLetter('A', this)" class="letter-btn px-4 py-2 rounded-full border border-[#262626] text-[10px] font-black active-nav">TREINO A</button>
                    <button onclick="changeLetter('B', this)" class="letter-btn px-4 py-2 rounded-full border border-[#262626] text-[10px] font-black">TREINO B</button>
                    <button onclick="changeLetter('C', this)" class="letter-btn px-4 py-2 rounded-full border border-[#262626] text-[10px] font-black">TREINO C</button>
                </div>
                <div class="glass-card p-4 space-y-3">
                    <input id="in-name" type="text" placeholder="Nome do Exercício" class="w-full p-3 text-sm">
                    <div class="flex gap-2"><input id="in-weight" type="number" placeholder="Peso" class="w-full p-3 text-sm"><input id="in-reps" type="text" placeholder="Reps" class="w-full p-3 text-sm"></div>
                    <button id="btn-save" onclick="saveWorkout()" class="w-full btn-blue p-3 text-xs uppercase">Salvar Exercício</button>
                    <button id="btn-cancel" onclick="cancelEdit()" class="hidden w-full text-[10px] text-gray-500 underline">CANCELAR</button>
                </div>
                <div id="list-workouts" class="space-y-3"></div>
            </div>

            <div class="glass-card p-4">
                <h3 class="text-[10px] font-bold text-gray-500 uppercase mb-4">Progresso de Carga</h3>
                <select id="chart-select" onchange="loadLoadChart(this.value)" class="w-full p-3 text-xs mb-4"></select>
                <canvas id="performanceChart"></canvas>
            </div>
        </div>

        <div id="view-profile" class="hidden">
            <div class="p-6 space-y-6">
                <div class="flex items-center gap-6">
                    <div class="relative">
                        <div class="w-20 h-20 rounded-full border border-[#262626] overflow-hidden bg-zinc-900 flex items-center justify-center">
                            <img id="profile-img-display" src="" class="w-full h-full object-cover hidden">
                            <span id="profile-icon" class="text-3xl">👤</span>
                        </div>
                        <button onclick="document.getElementById('file-avatar').click()" class="absolute bottom-0 right-0 bg-blue-500 p-1 rounded-full text-xs">📷</button>
                        <input type="file" id="file-avatar" accept="image/*" class="hidden" onchange="uploadAvatar()">
                    </div>
                    <div class="flex flex-1 justify-around text-center text-[10px] font-black uppercase">
                        <div><p id="stat-photos" class="text-sm">0</p>Posts</div>
                        <div><p id="stat-followers" class="text-sm">0</p>Amigos</div>
                    </div>
                </div>
                <div>
                    <h2 id="profile-name-real" class="font-black text-lg">Atleta</h2>
                    <h3 id="profile-handle" class="text-xs text-blue-500 font-bold uppercase">@handle</h3>
                    <p id="profile-bio" class="text-xs text-gray-400 mt-2 italic">Sem bio.</p>
                    <button onclick="toggleEditProfile()" class="w-full bg-[#262626] p-2 rounded-md text-[10px] font-bold mt-4 uppercase">Editar Perfil</button>
                </div>
                <div id="profile-edit-form" class="hidden space-y-3 glass-card p-4">
                    <input id="edit-full-name" type="text" placeholder="Nome Real" class="w-full p-2 text-xs">
                    <textarea id="edit-bio" class="w-full p-2 text-xs h-16" placeholder="Sua bio..."></textarea>
                    <button onclick="saveProfileData()" class="w-full btn-blue p-2 text-xs">SALVAR</button>
                </div>
                <button onclick="document.getElementById('file-post').click()" class="w-full btn-blue p-3 text-xs uppercase">Postar Shape 🔥</button>
                <input type="file" id="file-post" accept="image/*" class="hidden" onchange="uploadEvolution()">
            </div>
            <div id="my-gallery" class="grid grid-cols-3 gap-[1px]"></div>
        </div>

        <nav class="nav-bottom">
            <button onclick="switchView('feed')" id="nav-feed" class="text-2xl active-nav">🏠</button>
            <div class="relative"><button onclick="switchView('search')" id="nav-search" class="text-2xl">🔍</button><div id="nav-notif-dot" class="hidden notif-dot"></div></div>
            <button onclick="switchView('stats')" id="nav-stats" class="text-2xl">📋</button>
            <button onclick="switchView('profile')" id="nav-profile" class="text-2xl">👤</button>
        </nav>
    </div>

    <div id="section-login" class="flex flex-col items-center justify-center min-h-screen p-6 text-center">
        <h1 class="text-3xl font-black italic mb-10">Sanja<span class="text-blue-500">Fit</span></h1>
        <div class="w-full max-w-sm space-y-4">
            <input id="login-user" type="text" placeholder="@instagram" class="w-full p-4 bg-[#121212] border border-[#262626] rounded-lg">
            <input id="login-pass" type="password" placeholder="Senha" class="w-full p-4 bg-[#121212] border border-[#262626] rounded-lg">
            <button onclick="handleSignIn()" class="w-full btn-blue p-4 uppercase font-black text-sm">Entrar</button>
            <button onclick="handleSignUp()" class="w-full text-blue-500 text-xs font-bold">Criar nova conta</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://dazgtsobkykxwsvbmjfn.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRhemd0c29ia3lreHdzdmJtamZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxOTg4NTYsImV4cCI6MjA4ODc3NDg1Nn0.Ci_Hzqzf9Px8LTg7dNOXcu1dcTzBYWioH2yaFP2h6rI';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null, currentLetter = 'A', editingId = null, allProfiles = [], myChart = null;

        window.onload = async () => {
            const { data: { user } } = await _supabase.auth.getUser();
            if(user) initApp(user);
        };

        async function initApp(user) {
            currentUser = user;
            document.getElementById('section-login').classList.add('hidden');
            document.getElementById('section-app').classList.remove('hidden');
            await checkProfileRecord(user);
            loadPublicFeed(); loadProfileData(); loadRanking(); checkNotifications();
        }

        async function checkProfileRecord(user) {
            const { data } = await _supabase.from('profiles').select('*').eq('id', user.id).single();
            if(!data) await _supabase.from('profiles').insert([{ id: user.id, instagram: user.user_metadata.instagram || '@atleta' }]);
        }

        // --- FEED ---
        async function loadPublicFeed() {
            const { data: posts } = await _supabase.from('evolution_gallery').select('*, profiles(instagram, full_name, avatar_url), likes(user_id)').order('created_at', {ascending: false});
            document.getElementById('feed-list').innerHTML = (posts || []).map(p => `
                <div class="post-card">
                    <div class="flex items-center gap-3 p-3">
                        <img src="${p.profiles?.avatar_url || ''}" class="w-8 h-8 rounded-full bg-zinc-900 ${p.profiles?.avatar_url ? '' : 'hidden'}">
                        <span onclick="openUserProfile('${p.user_id}')" class="text-xs font-black uppercase italic cursor-pointer">${p.profiles?.instagram}</span>
                    </div>
                    <img src="${p.photo_url}" class="w-full aspect-square object-cover bg-zinc-900">
                    <div class="p-3 flex gap-4 items-center">
                        <span class="text-sm font-black">${p.likes?.length || 0} curtidas</span>
                    </div>
                </div>`).join('');
        }

        // --- BUSCA E VER PERFIL ---
        async function loadRanking() {
            const { data } = await _supabase.from('profiles').select('*');
            allProfiles = (data || []).filter(p => p.id !== currentUser.id);
            filterAthletes();
        }

        function filterAthletes() {
            const term = document.getElementById('search-input').value.toLowerCase();
            const filtered = allProfiles.filter(p => p.instagram?.toLowerCase().includes(term) || p.full_name?.toLowerCase().includes(term));
            document.getElementById('ranking-list').innerHTML = filtered.map(p => `
                <div class="flex items-center justify-between p-3 glass-card border-[#262626]">
                    <div class="flex items-center gap-3" onclick="openUserProfile('${p.id}')">
                        <div class="w-10 h-10 rounded-full bg-zinc-900 overflow-hidden">
                            <img src="${p.avatar_url || ''}" class="w-full h-full object-cover ${p.avatar_url ? '' : 'hidden'}">
                        </div>
                        <div><p class="text-xs font-black uppercase">${p.instagram}</p><p class="text-[9px] text-gray-500">${p.full_name || ''}</p></div>
                    </div>
                    <button onclick="sendFollowRequest('${p.id}')" class="btn-blue px-4 py-1.5 text-[10px]">Seguir</button>
                </div>`).join('');
        }

        async function openUserProfile(id) {
            const { data: p } = await _supabase.from('profiles').select('*').eq('id', id).single();
            if(!p) return;
            document.getElementById('view-user-handle').innerText = p.instagram;
            document.getElementById('view-user-name').innerText = p.full_name || "Atleta";
            document.getElementById('view-user-bio').innerText = p.bio || "";
            if(p.avatar_url) {
                const img = document.getElementById('view-user-avatar');
                img.src = p.avatar_url; img.classList.remove('hidden');
            }
            const { data: photos } = await _supabase.from('evolution_gallery').select('*').eq('user_id', id);
            document.getElementById('view-user-photos').innerText = photos?.length || 0;
            document.getElementById('view-user-gallery').innerHTML = (photos || []).map(ph => `<img src="${ph.photo_url}" class="aspect-square object-cover">`).join('');
            document.getElementById('modal-user-profile').style.display = 'flex';
        }
        function closeUserProfile() { document.getElementById('modal-user-profile').style.display = 'none'; }

        // --- TREINOS ---
        async function saveWorkout() {
            const n = document.getElementById('in-name').value, w = document.getElementById('in-weight').value, r = document.getElementById('in-reps').value;
            if(!n || !w) return;
            const payload = { user_id: currentUser.id, category: currentLetter, exercise_name: n, weight: String(w), reps: String(r) };
            if(editingId) { await _supabase.from('workouts').update(payload).eq('id', editingId); editingId = null; document.getElementById('btn-save').innerText = "Salvar"; document.getElementById('btn-cancel').classList.add('hidden'); }
            else await _supabase.from('workouts').insert([payload]);
            document.getElementById('in-name').value = ''; document.getElementById('in-weight').value = ''; document.getElementById('in-reps').value = '';
            loadWorkouts();
        }

        async function loadWorkouts() {
            const { data } = await _supabase.from('workouts').select('*').eq('user_id', currentUser.id).eq('category', currentLetter).order('created_at');
            document.getElementById('list-workouts').innerHTML = (data || []).map(ex => `
                <div class="glass-card p-4 flex justify-between items-center border-[#262626]">
                    <div><h4 class="text-xs font-black uppercase">${ex.exercise_name}</h4><p class="text-[10px] text-blue-500">${ex.weight}kg • ${ex.reps}</p></div>
                    <button onclick='editEx(${JSON.stringify(ex)})' class="text-blue-500 text-[10px] font-black uppercase underline">Editar</button>
                </div>`).join('');
            const unique = [...new Set((data || []).map(e => e.exercise_name))];
            document.getElementById('chart-select').innerHTML = `<option value="">Ver Gráfico de...</option>` + unique.map(e => `<option value="${e}">${e}</option>`).join('');
        }

        function editEx(ex) { editingId = ex.id; document.getElementById('in-name').value = ex.exercise_name; document.getElementById('in-weight').value = ex.weight; document.getElementById('in-reps').value = ex.reps; document.getElementById('btn-save').innerText = "Atualizar"; document.getElementById('btn-cancel').classList.remove('hidden'); }
        function cancelEdit() { editingId = null; document.getElementById('in-name').value = ''; document.getElementById('in-weight').value = ''; document.getElementById('in-reps').value = ''; document.getElementById('btn-save').innerText = "Salvar"; document.getElementById('btn-cancel').classList.add('hidden'); }

        async function loadLoadChart(exName) {
            const { data } = await _supabase.from('workouts').select('weight, created_at').eq('user_id', currentUser.id).eq('exercise_name', exName).order('created_at');
            const ctx = document.getElementById('performanceChart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, { type: 'line', data: { labels: data.map(d => new Date(d.created_at).toLocaleDateString()), datasets: [{ data: data.map(d => parseFloat(d.weight)), borderColor: '#3b82f6', tension: 0.3, fill: true, backgroundColor: 'rgba(59,130,246,0.1)' }] }, options: { plugins: { legend: { display: false } } } });
        }

        // --- OUTROS ---
        function calcMacros() { const w = document.getElementById('m-weight').value, g = document.getElementById('m-goal').value; if(!w) return; document.getElementById('res-p').innerText = (w*2.2).toFixed(0)+'g'; document.getElementById('res-c').innerText = (g==='lose'?w*1.5:w*4.5).toFixed(0)+'g'; document.getElementById('res-g').innerText = (w*0.8).toFixed(0)+'g'; document.getElementById('m-res').classList.remove('hidden'); }
        async function loadProfileData() {
            const { data: p } = await _supabase.from('profiles').select('*').eq('id', currentUser.id).single();
            if(!p) return;
            document.getElementById('profile-name-real').innerText = p.full_name || "Atleta";
            document.getElementById('profile-handle').innerText = p.instagram;
            document.getElementById('profile-bio').innerText = p.bio || "";
            if(p.avatar_url) { const img = document.getElementById('profile-img-display'); img.src = p.avatar_url; img.classList.remove('hidden'); document.getElementById('profile-icon').classList.add('hidden'); }
            const { data: posts } = await _supabase.from('evolution_gallery').select('*').eq('user_id', currentUser.id);
            document.getElementById('stat-photos').innerText = posts?.length || 0;
            document.getElementById('my-gallery').innerHTML = (posts || []).map(ph => `<img src="${ph.photo_url}" class="aspect-square object-cover">`).join('');
        }
        function switchView(v) { ['feed','search','stats','profile'].forEach(id => { document.getElementById('view-'+id).classList.add('hidden'); document.getElementById('nav-'+id).classList.remove('active-nav'); }); document.getElementById('view-'+v).classList.remove('hidden'); document.getElementById('nav-'+v).classList.add('active-nav'); if(v==='stats') loadWorkouts(); }
        function changeLetter(l, btn) { currentLetter = l; document.querySelectorAll('.letter-btn').forEach(b => b.classList.remove('active-nav')); btn.classList.add('active-nav'); loadWorkouts(); }
        async function handleSignOut() { await _supabase.auth.signOut(); localStorage.clear(); location.reload(); }
        async function handleSignIn() { const u = document.getElementById('login-user').value.trim().replace('@',''), p = document.getElementById('login-pass').value; await _supabase.auth.signInWithPassword({ email: `${u}@sanjafit.com`, password: p }); location.reload(); }
    </script>
</body>
</html>
