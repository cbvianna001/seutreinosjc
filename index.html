<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SanjaFit | Professional Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.95)), 
                        url('https://images.unsplash.com/photo-1540497077202-7c8a3999166f?q=80&w=2070&auto=format&fit=crop');
            background-size: cover; background-position: center; background-attachment: fixed;
        }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .active-tab { background: #3b82f6 !important; border: none !important; box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }
        .active-view { border-bottom: 3px solid #3b82f6; color: white !important; }
        .trophy-on { opacity: 1 !important; grayscale: 0 !important; filter: drop-shadow(0 0 8px gold); }
        .loader { border-top-color: #3b82f6; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-white min-h-screen pb-10">

    <div id="section-login" class="flex flex-col items-center justify-center min-h-screen p-6 text-center">
        <h1 class="text-5xl font-black italic text-blue-500 uppercase mb-8 tracking-tighter">SANJA<span class="text-white">FIT</span></h1>
        <div class="glass p-8 rounded-[2rem] w-full max-w-md shadow-2xl border border-white/5">
            <input id="login-user" type="text" placeholder="@seu_instagram ou admsanjafit" class="w-full p-4 mb-4 rounded-xl bg-black/40 border border-white/10 outline-none focus:border-blue-500">
            <input id="login-pass" type="password" placeholder="Senha" class="w-full p-4 mb-8 rounded-xl bg-black/40 border border-white/10 outline-none focus:border-blue-500">
            <button onclick="handleSignIn()" class="w-full bg-blue-600 hover:bg-blue-700 p-4 rounded-xl font-black uppercase tracking-widest shadow-lg transition-all active:scale-95">Entrar</button>
            <button onclick="handleSignUp()" class="w-full mt-6 text-[10px] text-gray-500 font-bold uppercase hover:text-white">Criar Conta Atleta</button>
        </div>
    </div>

    <div id="section-app" class="hidden max-w-2xl mx-auto p-4">
        <header class="flex justify-between items-center py-6">
            <div>
                <h2 id="display-name" class="text-2xl font-black italic uppercase tracking-tighter">@USUARIO</h2>
                <p id="badge-admin" class="hidden text-yellow-500 text-[9px] font-black border border-yellow-500/30 px-2 py-0.5 rounded italic uppercase">Modo Gestor</p>
            </div>
            <div class="flex gap-2">
                <button id="btn-admin-panel" onclick="openAdmin()" class="hidden glass bg-yellow-600/20 text-yellow-500 px-4 py-2 rounded-xl text-[9px] font-black italic">PAINEL ADM</button>
                <button onclick="location.reload()" class="text-red-400 text-[10px] font-black uppercase border border-red-900/30 px-4 py-2 rounded-xl">Sair</button>
            </div>
        </header>

        <div class="flex border-b border-white/10 mb-8 font-black uppercase text-[10px] tracking-widest text-center">
            <button onclick="switchView('workouts')" id="nav-workouts" class="flex-1 py-4 active-view text-gray-500">Treinos</button>
            <button onclick="switchView('evolution')" id="nav-evolution" class="flex-1 py-4 text-gray-500">Evolução</button>
        </div>

        <div id="view-workouts">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                <div class="glass p-6 rounded-3xl text-center">
                    <p class="text-[9px] font-black uppercase text-gray-500 mb-2">Meta Mensal (20)</p>
                    <div class="w-full bg-white/5 rounded-full h-2 mb-2 overflow-hidden"><div id="bar-goal" class="bg-blue-600 h-full w-0 transition-all duration-1000"></div></div>
                    <p id="txt-goal" class="text-[10px] font-bold text-blue-400">0/20 Treinos</p>
                </div>
                <div class="glass p-6 rounded-3xl flex justify-around items-center">
                    <span id="t1" class="text-2xl opacity-10 grayscale transition-all">🏆</span>
                    <span id="t2" class="text-2xl opacity-10 grayscale transition-all">🔥</span>
                    <span id="t3" class="text-2xl opacity-10 grayscale transition-all">👑</span>
                </div>
            </div>

            <div class="grid grid-cols-4 gap-2 mb-8">
                <button onclick="changeLetter('A', this)" class="letter-btn p-4 rounded-xl glass font-black active-tab">A</button>
                <button onclick="changeLetter('B', this)" class="letter-btn p-4 rounded-xl glass font-black">B</button>
                <button onclick="changeLetter('C', this)" class="letter-btn p-4 rounded-xl glass font-black">C</button>
                <button onclick="changeLetter('D', this)" class="letter-btn p-4 rounded-xl glass font-black">D</button>
            </div>

            <div class="glass rounded-[2rem] p-6 mb-8 border border-white/5">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-black italic uppercase">Treino <span id="current-letter" class="text-blue-500">A</span></h3>
                    <div class="flex gap-2">
                        <button onclick="addExercisePrompt()" class="bg-blue-600 px-4 py-2 rounded-full text-[9px] font-black uppercase">+ Add</button>
                        <button onclick="finishWorkout()" class="bg-green-600 px-4 py-2 rounded-full text-[9px] font-black uppercase shadow-lg shadow-green-900/20 transition-all active:scale-95 italic">Concluir</button>
                    </div>
                </div>
                <div id="list-workouts" class="space-y-4"></div>
            </div>
        </div>

        <div id="view-evolution" class="hidden">
            <div class="glass p-6 rounded-3xl mb-8 border border-blue-500/10"><canvas id="evolutionChart" height="150"></canvas></div>
            <div class="glass p-8 rounded-[2rem] mb-8">
                <h3 class="text-center font-black uppercase mb-6 italic text-xs tracking-widest">Registrar Shape</h3>
                <div class="space-y-4">
                    <input type="file" id="file-photo" accept="image/*" class="text-xs text-gray-400 w-full file:bg-blue-600 file:border-0 file:rounded-full file:text-white file:px-4 file:py-2">
                    <input type="number" id="input-weight" placeholder="Peso Atual (kg)" class="w-full p-4 rounded-xl bg-black/40 border border-white/10 outline-none">
                    <button id="btn-upload" onclick="uploadEvolution()" class="w-full bg-blue-600 p-4 rounded-xl font-black uppercase text-xs flex justify-center items-center gap-2">
                        <span>Salvar</span>
                        <div id="spin-upload" class="hidden loader rounded-full border-2 border-white h-4 w-4"></div>
                    </button>
                </div>
            </div>
            <div id="list-gallery" class="grid grid-cols-2 gap-4"></div>
        </div>
    </div>

    <div id="modal-admin" class="hidden fixed inset-0 bg-black/98 p-6 z-50 overflow-y-auto">
        <div class="flex justify-between items-center mb-10 max-w-3xl mx-auto border-b border-yellow-600/20 pb-4">
            <h2 class="text-2xl font-black text-yellow-500 italic uppercase">Gestão SanjaFit</h2>
            <button onclick="closeAdmin()" class="text-white text-4xl font-thin">&times;</button>
        </div>
        <div id="admin-content" class="max-w-3xl mx-auto space-y-8"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://dazgtsobkykxwsvbmjfn.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRhemd0c29ia3lreHdzdmJtamZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxOTg4NTYsImV4cCI6MjA4ODc3NDg1Nn0.Ci_Hzqzf9Px8LTg7dNOXcu1dcTzBYWioH2yaFP2h6rI';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let currentLetter = 'A';
        let myChart;
        const beep = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-software-interface-start-2574.mp3');

        // --- LOGIN E PERMISSÕES ---
        async function handleSignIn() {
            const user = document.getElementById('login-user').value.trim();
            const pass = document.getElementById('login-pass').value;

            let loginEmail = (user === 'admsanjafit') ? 'jean@sanjafit.admin' : `${user.replace('@','')}@sanjafit.com`;

            const { data, error } = await _supabase.auth.signInWithPassword({ email: loginEmail, password: pass });
            if(error) return alert("Verifique as credenciais.");

            const { data: profile } = await _supabase.from('profiles').select('*').eq('id', data.user.id).single();
            
            // Forçamos a permissão de admin se o login for o admsanjafit
            const isManager = (profile?.role === 'admin' || user === 'admsanjafit');
            initApp(data.user, isManager, profile?.instagram_handle || user);
        }

        async function handleSignUp() {
            const user = document.getElementById('login-user').value.trim().replace('@','');
            const pass = document.getElementById('login-pass').value;
            const { error } = await _supabase.auth.signUp({ 
                email: `${user}@sanjafit.com`, password: pass, 
                options: { data: { instagram_handle: `@${user}` } } 
            });
            if(error) alert(error.message); else alert("Conta Criada! Faça Login.");
        }

        function initApp(user, isAdmin, handle) {
            currentUser = user;
            document.getElementById('section-login').classList.add('hidden');
            document.getElementById('section-app').classList.remove('hidden');
            document.getElementById('display-name').innerText = handle;
            if(isAdmin) {
                document.getElementById('btn-admin-panel').classList.remove('hidden');
                document.getElementById('badge-admin').classList.remove('hidden');
            }
            loadWorkouts();
            updateStats();
            loadGallery();
        }

        // --- TREINOS (ALUNO) ---
        async function loadWorkouts() {
            const { data } = await _supabase.from('workouts').select('*').eq('user_id', currentUser.id).eq('category', currentLetter).order('created_at');
            document.getElementById('list-workouts').innerHTML = data.map(ex => `
                <div class="glass p-5 rounded-2xl border border-white/5 flex justify-between items-center">
                    <div>
                        <h4 class="font-black uppercase text-sm italic tracking-tight italic">${ex.exercise_name}</h4>
                        <div class="flex gap-4 text-[10px] text-blue-500 font-bold mt-1 italic"><span>${ex.weight}kg</span><span>${ex.reps || '3x12'}</span></div>
                        ${ex.notes ? `<p class="text-[9px] text-gray-500 mt-2 italic border-l border-blue-500 pl-2">${ex.notes}</p>` : ''}
                    </div>
                    <div class="flex flex-col gap-2">
                        <button onclick="startTimer()" class="text-[8px] glass px-2 py-1 rounded font-black text-blue-400">DESCANSO</button>
                        <button onclick="deleteEx('${ex.id}')" class="text-[8px] text-red-900 font-black uppercase italic">Excluir</button>
                    </div>
                </div>
            `).join('') || '<p class="text-center py-5 text-gray-700 text-xs italic">Nenhum treino salvo.</p>';
        }

        async function addExercisePrompt() {
            const n = prompt("Exercício:"); const w = prompt("Peso (kg):");
            const r = prompt("Séries x Repetições:");
            if(!n) return;
            await _supabase.from('workouts').insert([{
                user_id: currentUser.id, category: currentLetter, exercise_name: n, weight: w, reps: r
            }]);
            loadWorkouts();
        }

        async function deleteEx(id) { if(confirm("Remover exercício?")) { await _supabase.from('workouts').delete().eq('id', id); loadWorkouts(); } }

        function startTimer() { let t = 60; const timer = setInterval(() => { t--; if(t <= 0) { clearInterval(timer); beep.play(); alert("Descanso Finalizado!"); } }, 1000); }

        async function finishWorkout() {
            if(!confirm("Concluir treino de hoje?")) return;
            await _supabase.from('workout_history').insert([{ user_id: currentUser.id, category: currentLetter }]);
            updateStats();
        }

        // --- EVOLUÇÃO E STATUS ---
        async function updateStats() {
            const { data } = await _supabase.from('workout_history').select('*').eq('user_id', currentUser.id);
            const count = data ? data.length : 0;
            const percent = Math.min((count/20)*100, 100);
            document.getElementById('bar-goal').style.width = percent + '%';
            document.getElementById('txt-goal').innerText = `${count}/20 Treinos`;
            if(count >= 1) document.getElementById('t1').classList.add('trophy-on');
            if(count >= 10) document.getElementById('t2').classList.add('trophy-on');
            if(count >= 20) document.getElementById('t3').classList.add('trophy-on');
            renderChart(data || []);
        }

        function renderChart(history) {
            const counts = [0, 0, 0, 0];
            history.forEach(h => {
                const day = new Date(h.completed_at).getDate();
                const week = Math.min(Math.floor((day - 1) / 7), 3);
                counts[week]++;
            });
            const ctx = document.getElementById('evolutionChart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'line',
                data: { labels: ['S1', 'S2', 'S3', 'S4'], datasets: [{ data: counts, borderColor: '#3b82f6', tension: 0.4, fill: true, backgroundColor: 'rgba(59,130,246,0.1)' }] },
                options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: '#222' } } } }
            });
        }

        async function uploadEvolution() {
            const file = document.getElementById('file-photo').files[0];
            const weight = document.getElementById('input-weight').value;
            if(!file || !weight) return alert("Selecione foto e peso!");
            document.getElementById('spin-upload').classList.remove('hidden');
            const name = `${Date.now()}_${file.name}`;
            await _supabase.storage.from('FORMAS').upload(name, file);
            const { data: urlData } = _supabase.storage.from('FORMAS').getPublicUrl(name);
            await _supabase.from('evolution_gallery').insert([{ user_id: currentUser.id, photo_url: urlData.publicUrl, body_weight: weight }]);
            document.getElementById('spin-upload').classList.add('hidden');
            loadGallery();
        }

        async function loadGallery() {
            const { data } = await _supabase.from('evolution_gallery').select('*').eq('user_id', currentUser.id).order('created_at', {ascending: false});
            document.getElementById('list-gallery').innerHTML = data.map(p => `
                <div class="glass rounded-2xl overflow-hidden border border-white/5">
                    <img src="${p.photo_url}" class="w-full h-32 object-cover">
                    <div class="p-3 text-[9px] font-black uppercase text-center"><p class="text-blue-500">${new Date(p.created_at).toLocaleDateString()}</p><p>${p.body_weight} KG</p></div>
                </div>
            `).join('');
        }

        // --- PORTAL ADMIN ---
        async function openAdmin() {
            document.getElementById('modal-admin').classList.remove('hidden');
            const { data: profiles } = await _supabase.from('profiles').select('*').neq('role', 'admin').order('instagram_handle');
            document.getElementById('admin-content').innerHTML = profiles.map(u => `
                <div class="glass p-6 rounded-[2rem] border border-white/10 shadow-2xl">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-xl font-black text-blue-400 uppercase italic underline underline-offset-4">${u.instagram_handle || '@Aluno'}</h3>
                        <button onclick="deleteUser('${u.id}')" class="text-red-500 text-[9px] font-black uppercase underline">Remover Aluno</button>
                    </div>
                    
                    <div class="bg-black/30 p-5 rounded-2xl space-y-4">
                        <p class="text-[10px] font-black uppercase text-gray-500 tracking-widest italic">Prescrever Treino:</p>
                        <div class="grid grid-cols-2 gap-2">
                            <select id="cat-${u.id}" class="bg-gray-900 text-xs p-3 rounded-xl border border-white/5 text-white"><option value="A">Aba A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option></select>
                            <input id="ex-${u.id}" type="text" placeholder="Exercício" class="bg-gray-900 text-xs p-3 rounded-xl border border-white/5">
                            <input id="w-${u.id}" type="number" placeholder="Peso" class="bg-gray-900 text-xs p-3 rounded-xl border border-white/5">
                            <input id="r-${u.id}" type="text" placeholder="Séries x Reps" class="bg-gray-900 text-xs p-3 rounded-xl border border-white/5">
                            <input id="n-${u.id}" type="text" placeholder="Observações" class="col-span-2 bg-gray-900 text-xs p-3 rounded-xl border border-white/5">
                        </div>
                        <button onclick="adminAddWorkout('${u.id}')" class="w-full bg-blue-600 p-3 rounded-xl font-black text-xs uppercase tracking-widest transition-all">Salvar para o Aluno</button>
                        <button onclick="toggleUserWorkouts('${u.id}')" class="w-full text-gray-500 text-[9px] font-bold uppercase underline mt-2">Ver Treinos Dele</button>
                        <div id="sub-${u.id}" class="hidden space-y-2 mt-4 pt-4 border-t border-white/10"></div>
                    </div>
                </div>
            `).join('');
        }

        async function adminAddWorkout(id) {
            const payload = {
                user_id: id,
                category: document.getElementById(`cat-${id}`).value,
                exercise_name: document.getElementById(`ex-${id}`).value,
                weight: document.getElementById(`w-${id}`).value,
                reps: document.getElementById(`r-${id}`).value,
                notes: document.getElementById(`n-${id}`).value
            };
            await _supabase.from('workouts').insert([payload]);
            alert("Treino enviado!");
        }

        async function toggleUserWorkouts(uid) {
            const div = document.getElementById(`sub-${uid}`);
            if(!div.classList.contains('hidden')) return div.classList.add('hidden');
            div.classList.remove('hidden');
            const { data } = await _supabase.from('workouts').select('*').eq('user_id', uid);
            div.innerHTML = data.map(ex => `
                <div class="flex justify-between items-center text-[9px] bg-white/5 p-2 rounded-lg font-bold uppercase italic">
                    <span>[${ex.category}] ${ex.exercise_name}</span>
                    <button onclick="deleteExAdmin('${ex.id}', '${uid}')" class="text-red-500">EXCLUIR</button>
                </div>
            `).join('') || 'Sem treinos.';
        }

        async function deleteExAdmin(id, uid) { await _supabase.from('workouts').delete().eq('id', id); toggleUserWorkouts(uid); }
        async function deleteUser(id) { if(confirm("Excluir conta?")) { await _supabase.from('profiles').delete().eq('id', id); openAdmin(); } }

        function switchView(v) { 
            document.getElementById('view-workouts').classList.toggle('hidden', v !== 'workouts'); 
            document.getElementById('view-evolution').classList.toggle('hidden', v !== 'evolution'); 
            document.getElementById('nav-workouts').classList.toggle('active-view', v === 'workouts'); 
            document.getElementById('nav-evolution').classList.toggle('active-view', v === 'evolution'); 
        }
        function changeLetter(l, btn) { 
            currentLetter = l; document.getElementById('current-letter').innerText = l; 
            document.querySelectorAll('.letter-btn').forEach(b => b.classList.remove('active-tab')); 
            btn.classList.add('active-tab'); loadWorkouts(); 
        }
        function closeAdmin() { document.getElementById('modal-admin').classList.add('hidden'); }
    </script>
</body>
</html>
