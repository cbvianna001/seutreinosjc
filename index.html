<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SanjaFit | Arena Final</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=1470&auto=format&fit=crop'); background-size: cover; background-position: center; background-attachment: fixed; color: #fff; min-height: 100vh; }
        .nav-bottom { background: rgba(10,10,10,0.95); backdrop-filter: blur(10px); border-top: 1px solid #262626; position: fixed; bottom: 0; width: 100%; height: 75px; z-index: 1000; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; justify-items: center; }
        .active-nav { color: #3b82f6; transform: scale(1.1); text-shadow: 0 0 10px #3b82f6; }
        .glass-card { background: rgba(20, 20, 20, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 15px; }
        .btn-blue { background: #3b82f6; border-radius: 8px; font-weight: 900; width: 100%; padding: 12px; text-transform: uppercase; font-size: 11px; cursor: pointer; transition: 0.2s; border: none; color: white; }
        .btn-blue:active { transform: scale(0.95); }
        input, select { background: rgba(30, 30, 30, 0.9) !important; border: 1px solid #444 !important; color: white !important; border-radius: 8px; padding: 10px; width: 100%; margin-bottom: 10px; }
        .workout-done { border-left: 5px solid #059669 !important; background: rgba(5, 150, 105, 0.1) !important; opacity: 0.5; text-decoration: line-through; }
        .photo-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 3000; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .modal-full { display: none; position: fixed; inset: 0; background: #000; z-index: 2000; padding: 20px; overflow-y: auto; flex-direction: column; }
        ::-webkit-scrollbar { display: none; }
        .gallery-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 6px; background: #1a1a1a; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body class="pb-28">

    <div id="photo-zoom" class="photo-overlay">
        <button onclick="closeZoom()" class="absolute top-6 right-6 text-3xl">✕</button>
        <img id="zoom-img" src="" class="max-w-full max-h-[55vh] rounded-lg border border-zinc-800 mb-6">
        <div class="w-full max-w-sm flex justify-center gap-10 items-center">
            <button id="btn-like-zoom" class="text-4xl transition-transform active:scale-125">🤍</button>
            <button id="btn-delete-photo" class="hidden text-[10px] text-red-500 font-black border border-red-500 p-3 rounded-lg uppercase tracking-widest">Excluir Shape</button>
        </div>
        <p id="zoom-likes-display" class="mt-4 text-[10px] font-black text-blue-500 uppercase tracking-widest"></p>
    </div>

    <div id="modal-friend" class="modal-full">
        <div class="flex justify-between items-center mb-6">
            <h2 id="f-handle" class="font-black italic text-blue-500 uppercase tracking-tighter">@atleta</h2>
            <button onclick="closeFriend()" class="text-2xl">✕</button>
        </div>
        <div class="space-y-6">
            <div class="flex items-center gap-6 glass-card">
                <div class="w-20 h-20 rounded-full border-2 border-blue-500 overflow-hidden bg-zinc-900">
                    <img id="f-avatar" src="" class="w-full h-full object-cover">
                </div>
                <div>
                    <p id="f-xp" class="text-xl font-black italic">0 XP</p>
                    <p id="f-likes-total" class="text-[9px] text-gray-500 font-bold uppercase tracking-widest">0 CURTIDAS TOTAIS</p>
                </div>
            </div>
            <div id="f-gallery" class="grid grid-cols-3 gap-1"></div>
        </div>
    </div>

    <div id="view-login" class="hidden flex flex-col items-center justify-center min-h-screen p-6 text-center">
        <h1 class="text-5xl font-black italic mb-10 uppercase italic text-white tracking-tighter">SANJA<span class="text-blue-500">FIT</span></h1>
        <div class="w-full max-w-sm space-y-4">
            <input id="l-user" type="text" placeholder="@seu_instagram">
            <input id="l-pass" type="password" placeholder="Senha">
            <button onclick="handleSignIn()" class="btn-blue">Entrar Arena</button>
            <button onclick="handleSignUp()" class="text-blue-500 text-[10px] font-bold uppercase mt-4 block mx-auto underline">Registrar Atleta</button>
        </div>
    </div>

    <div id="view-app" class="hidden max-w-lg mx-auto">
        <header class="p-6 flex justify-between items-center">
            <h1 class="text-2xl font-black italic uppercase tracking-tighter italic">Sanja<span class="text-blue-500">Fit</span></h1>
            <button onclick="handleSignOut()" class="text-[10px] font-bold text-red-500 border border-red-500/30 px-3 py-1 rounded">SAIR</button>
        </header>

        <div id="tab-ranking" class="p-4 space-y-3">
            <h2 class="text-[10px] font-black uppercase text-zinc-500 tracking-[4px] mb-4">Elite Ranking</h2>
            <div id="list-ranking" class="space-y-3"></div>
        </div>

        <div id="tab-calc" class="hidden p-4 space-y-4">
            <div class="glass-card">
                <h3 class="font-black mb-4 uppercase text-blue-500 italic">Dieta & Macros</h3>
                <input id="calc-w" type="number" placeholder="Peso Atual (Kg)">
                <select id="calc-g"><option value="lose">Cutting (Definição)</option><option value="gain">Bulking (Massa)</option></select>
                <button onclick="runCalc()" class="btn-blue">Gerar Macros</button>
                <div id="calc-res" class="hidden grid grid-cols-3 gap-2 mt-6 text-center text-[10px] font-black uppercase">
                    <div class="bg-blue-600/20 p-3 rounded">P: <span id="r-p"></span>g</div>
                    <div class="bg-green-600/20 p-3 rounded">C: <span id="r-c"></span>g</div>
                    <div class="bg-yellow-600/20 p-3 rounded">G: <span id="r-g"></span>g</div>
                </div>
            </div>
        </div>

        <div id="tab-train" class="hidden p-4 space-y-4">
            <div class="flex gap-2 overflow-x-auto pb-2" id="train-tabs"></div>
            <div class="glass-card">
                <input id="t-name" type="text" placeholder="Nome do Exercício">
                <div class="flex gap-2"><input id="t-weight" type="number" placeholder="Kg"><input id="t-reps" type="text" placeholder="Séries x Reps"></div>
                <button onclick="saveWorkout()" id="btn-save-train" class="btn-blue">Salvar Exercício</button>
                <button onclick="cancelEdit()" id="btn-cancel-edit" class="hidden w-full mt-2 text-[10px] text-zinc-500 underline">CANCELAR</button>
            </div>
            <div id="list-trains" class="space-y-2"></div>
        </div>

        <div id="tab-charts" class="hidden p-4">
            <div class="glass-card">
                <select id="chart-select" onchange="drawChart(this.value)" class="text-xs mb-4"></select>
                <canvas id="performanceChart"></canvas>
            </div>
        </div>

        <div id="tab-profile" class="hidden p-4 space-y-6">
            <div class="flex items-center gap-6 glass-card">
                <div class="relative w-24 h-24 rounded-full border-2 border-blue-500 overflow-hidden bg-zinc-900 flex items-center justify-center">
                    <img id="my-avatar" src="" class="w-full h-full object-cover hidden">
                    <span id="my-avatar-icon" class="text-4xl">👤</span>
                    <button onclick="document.getElementById('f-avatar-input').click()" class="absolute bottom-0 right-0 bg-blue-500 p-1.5 rounded-full text-xs">📷</button>
                    <input type="file" id="f-avatar-input" class="hidden" onchange="upAvatar()">
                </div>
                <div class="flex-1">
                    <h2 id="my-handle" class="font-black text-xl italic uppercase">@atleta</h2>
                    <p id="my-xp-count" class="text-blue-500 font-bold text-sm">0 XP</p>
                    <button onclick="resetMyXP()" class="text-[8px] font-black text-zinc-600 uppercase mt-1 underline">Resetar XP Pessoal</button>
                </div>
            </div>
            <button onclick="document.getElementById('f-shape-input').click()" class="w-full btn-blue italic font-black">Publicar Novo Post de Evolução 🔥</button>
            <input type="file" id="f-shape-input" class="hidden" onchange="upShape()">
            <div id="my-gallery" class="grid grid-cols-3 gap-1"></div>
        </div>

        <nav class="nav-bottom">
            <button onclick="showTab('ranking')" id="nav-ranking" class="active-nav text-2xl">🏆</button>
            <button onclick="showTab('calc')" id="nav-calc" class="text-2xl">⚖️</button>
            <button onclick="showTab('train')" id="nav-train" class="text-2xl">📋</button>
            <button onclick="showTab('charts')" id="nav-charts" class="text-2xl">📈</button>
            <button onclick="showTab('profile')" id="nav-profile" class="text-2xl">👤</button>
        </nav>
    </div>

    <script>
        const SUPABASE_URL = 'https://dazgtsobkykxwsvbmjfn.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRhemd0c29ia3lreHdzdmJtamZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxOTg4NTYsImV4cCI6MjA4ODc3NDg1Nn0.Ci_Hzqzf9Px8LTg7dNOXcu1dcTzBYWioH2yaFP2h6rI';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null, currentLetter = 'A', chartInstance = null, editingId = null;

        window.onload = async () => {
            const { data: { user } } = await _supabase.auth.getUser();
            if(user) { currentUser = user; startApp(); } 
            else { document.getElementById('view-login').classList.remove('hidden'); }
        };

        async function startApp() {
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('view-app').classList.remove('hidden');
            loadRank(); loadTrain(); loadProfile(); renderLetters();
        }

        function showTab(t) {
            ['ranking','calc','train','charts','profile'].forEach(id => {
                document.getElementById('tab-'+id).classList.add('hidden');
                document.getElementById('nav-'+id).classList.remove('active-nav');
            });
            document.getElementById('tab-'+t).classList.remove('hidden');
            document.getElementById('nav-'+t).classList.add('active-nav');
            if(t==='charts') loadChartOps();
        }

        // --- AUTH ---
        async function handleSignIn() {
            const u = document.getElementById('l-user').value.trim().replace('@',''), p = document.getElementById('l-pass').value;
            const { error } = await _supabase.auth.signInWithPassword({ email: `${u}@sanjafit.com`, password: p });
            if(error) alert("Credenciais incorretas!"); else location.reload();
        }
        async function handleSignUp() {
            const u = document.getElementById('l-user').value.trim().replace('@',''), p = document.getElementById('l-pass').value;
            const { data, error } = await _supabase.auth.signUp({ email: `${u}@sanjafit.com`, password: p });
            if(error) return alert(error.message);
            await _supabase.from('profiles').upsert({ id: data.user.id, instagram: `@${u}`, xp: 0 });
            alert("Cadastro realizado! Entre com seus dados.");
        }
        function handleSignOut() { _supabase.auth.signOut(); location.reload(); }

        // --- RANKING E PERFIL AMIGO ---
        async function loadRank() {
            const { data } = await _supabase.from('profiles').select('*').order('xp', {ascending: false});
            document.getElementById('list-ranking').innerHTML = (data || []).map((p, i) => `
                <div class="glass-card flex justify-between items-center" onclick="openFriend('${p.id}')">
                    <div class="flex items-center gap-3">
                        <span class="font-black text-blue-500 text-xs">${i+1}º</span>
                        <div class="w-10 h-10 rounded-full bg-zinc-900 border border-zinc-800 overflow-hidden"><img src="${p.avatar_url||''}" class="${p.avatar_url?'':'hidden'} w-full h-full object-cover"></div>
                        <p class="font-bold uppercase text-xs italic">${p.instagram}</p>
                    </div>
                    <span class="font-black text-[10px] text-zinc-500">${p.xp || 0} XP</span>
                </div>
            `).join('');
        }

        async function openFriend(id) {
            const { data: p } = await _supabase.from('profiles').select('*').eq('id', id).single();
            document.getElementById('f-handle').innerText = p.instagram;
            document.getElementById('f-xp').innerText = `${p.xp || 0} XP`;
            document.getElementById('f-avatar').src = p.avatar_url || '';
            const { data: phs } = await _supabase.from('evolution_gallery').select('*, likes(user_id)').eq('user_id', id);
            document.getElementById('f-gallery').innerHTML = (phs || []).map(ph => `<img src="${ph.photo_url}" class="gallery-img" onclick="openZoom('${ph.id}','${ph.photo_url}',false)">`).join('');
            document.getElementById('f-likes-total').innerText = (phs?.reduce((acc, curr) => acc + (curr.likes?.length || 0), 0) || 0) + " CURTIDAS TOTAIS";
            document.getElementById('modal-friend').style.display = 'flex';
        }

        // --- ZOOM E LIKES ---
        async function openZoom(photoId, url, isMine) {
            document.getElementById('zoom-img').src = url;
            document.getElementById('photo-zoom').style.display = 'flex';
            const bL = document.getElementById('btn-like-zoom');
            const bD = document.getElementById('btn-delete-photo');
            bD.classList.toggle('hidden', !isMine);
            if(isMine) {
                bD.onclick = async () => { if(confirm("Apagar shape?")) { await _supabase.from('evolution_gallery').delete().eq('id', photoId); closeZoom(); loadProfile(); }};
                bL.style.display = 'none';
            } else {
                bL.style.display = 'block';
                bL.onclick = () => handleLike(photoId);
            }
            const { count } = await _supabase.from('likes').select('*', {count: 'exact', head: true}).eq('post_id', photoId);
            document.getElementById('zoom-likes-display').innerText = `${count || 0} CURTIDAS`;
        }

        async function handleLike(pid) {
            const { data: ex } = await _supabase.from('likes').select('*').eq('post_id', pid).eq('user_id', currentUser.id).single();
            if(ex) await _supabase.from('likes').delete().eq('id', ex.id);
            else await _supabase.from('likes').insert([{ post_id: pid, user_id: currentUser.id }]);
            openZoom(pid, document.getElementById('zoom-img').src, false);
        }

        // --- TREINOS (EDITAR / EXCLUIR / CONCLUIR) ---
        function renderLetters() { document.getElementById('train-tabs').innerHTML = ['A','B','C','D'].map(l => `<button onclick="setLetter('${l}')" class="px-6 py-2 rounded-full glass-card text-xs font-black ${currentLetter===l?'active-nav':''}">${l}</button>`).join(''); }
        function setLetter(l) { currentLetter = l; renderLetters(); loadTrain(); }
        async function loadTrain() {
            const { data } = await _supabase.from('workouts').select('*').eq('user_id', currentUser.id).eq('category', currentLetter).order('created_at');
            document.getElementById('list-trains').innerHTML = (data || []).map(t => `
                <div class="glass-card flex justify-between items-center mb-2 ${t.done?'workout-done':''}">
                    <div class="flex items-center gap-3">
                        <input type="checkbox" onchange="toggleT('${t.id}', this.checked)" ${t.done?'checked':''} class="w-5 h-5 accent-blue-500">
                        <div><p class="font-black uppercase text-xs">${t.exercise_name}</p><p class="text-blue-500 text-[9px] font-bold">${t.weight}kg | ${t.reps}</p></div>
                    </div>
                    <div class="flex gap-3">
                        <button onclick='startEdit(${JSON.stringify(t)})' class="text-blue-400 text-[9px] font-black uppercase">Editar</button>
                        <button onclick="delT('${t.id}')" class="text-red-900 font-bold text-xs">X</button>
                    </div>
                </div>
            `).join('');
        }
        function startEdit(t) {
            editingId = t.id;
            document.getElementById('t-name').value = t.exercise_name;
            document.getElementById('t-weight').value = t.weight;
            document.getElementById('t-reps').value = t.reps;
            document.getElementById('btn-save-train').innerText = "ATUALIZAR";
            document.getElementById('btn-cancel-edit').classList.remove('hidden');
        }
        function cancelEdit() { editingId = null; document.getElementById('t-name').value=''; document.getElementById('btn-save-train').innerText="Salvar Exercício"; document.getElementById('btn-cancel-edit').classList.add('hidden'); }
        async function saveWorkout() {
            const n = document.getElementById('t-name').value, w = document.getElementById('t-weight').value, r = document.getElementById('t-reps').value;
            if(!n) return;
            if(editingId) await _supabase.from('workouts').update({ exercise_name: n, weight: w, reps: r }).eq('id', editingId);
            else await _supabase.from('workouts').insert([{ user_id: currentUser.id, category: currentLetter, exercise_name: n, weight: w, reps: r }]);
            cancelEdit(); loadTrain();
        }
        async function toggleT(id, s) {
            await _supabase.from('workouts').update({ done: s }).eq('id', id);
            const { data: p } = await _supabase.from('profiles').select('xp').eq('id', currentUser.id).single();
            await _supabase.from('profiles').update({ xp: (p.xp || 0) + (s ? 1 : -1) }).eq('id', currentUser.id);
            loadTrain(); loadRank(); loadProfile();
        }
        async function delT(id) { await _supabase.from('workouts').delete().eq('id', id); loadTrain(); }
        async function resetMyXP() { if(confirm("Zerar seu XP?")) { await _supabase.from('profiles').update({ xp: 0 }).eq('id', currentUser.id); loadProfile(); loadRank(); } }

        // --- PERFIL E STORAGE ---
        async function loadProfile() {
            const { data: p } = await _supabase.from('profiles').select('*').eq('id', currentUser.id).single();
            document.getElementById('my-handle').innerText = p.instagram;
            document.getElementById('my-xp-count').innerText = `${p.xp || 0} XP`;
            if(p.avatar_url) { document.getElementById('my-avatar').src = p.avatar_url; document.getElementById('my-avatar').classList.remove('hidden'); document.getElementById('my-avatar-icon').classList.add('hidden'); }
            const { data: phs } = await _supabase.from('evolution_gallery').select('*').eq('user_id', currentUser.id).order('created_at', {ascending: false});
            document.getElementById('my-gallery').innerHTML = (phs || []).map(ph => `<img src="${ph.photo_url}" class="gallery-img" onclick="openZoom('${ph.id}','${ph.photo_url}',true)">`).join('');
        }
        async function upAvatar() {
            const f = document.getElementById('f-avatar-input').files[0];
            const name = `avatar_${currentUser.id}.jpg`;
            await _supabase.storage.from('shapes').upload(name, f, { upsert: true });
            const { data: url } = _supabase.storage.from('shapes').getPublicUrl(name);
            await _supabase.from('profiles').update({ avatar_url: url.publicUrl }).eq('id', currentUser.id);
            loadProfile(); loadRank();
        }
        async function upShape() {
            const f = document.getElementById('f-shape-input').files[0];
            const name = `shape_${currentUser.id}_${Date.now()}.jpg`;
            await _supabase.storage.from('shapes').upload(name, f);
            const { data: url } = _supabase.storage.from('shapes').getPublicUrl(name);
            await _supabase.from('evolution_gallery').insert([{ user_id: currentUser.id, photo_url: url.publicUrl }]);
            loadProfile();
        }

        // --- CALCULADORA ---
        function runCalc() {
            const w = document.getElementById('calc-w').value; if(!w) return;
            const g = document.getElementById('calc-g').value;
            document.getElementById('r-p').innerText = (w * 2.2).toFixed(0);
            document.getElementById('r-c').innerText = (g === 'lose' ? w * 1.5 : w * 4).toFixed(0);
            document.getElementById('r-g').innerText = (w * 0.8).toFixed(0);
            document.getElementById('calc-res').classList.remove('hidden');
        }

        // --- AUXILIARES GERAIS ---
        function closeZoom() { document.getElementById('photo-zoom').style.display = 'none'; }
        function closeFriend() { document.getElementById('modal-friend').style.display = 'none'; }
        async function loadChartOps() {
            const { data } = await _supabase.from('workouts').select('exercise_name').eq('user_id', currentUser.id);
            const uni = [...new Set(data.map(d => d.exercise_name))];
            document.getElementById('chart-select').innerHTML = '<option>Selecione o Exercício...</option>' + uni.map(u => `<option value="${u}">${u}</option>`).join('');
        }
        async function drawChart(ex) {
            const { data } = await _supabase.from('workouts').select('weight, created_at').eq('user_id', currentUser.id).eq('exercise_name', ex).order('created_at');
            if(chartInstance) chartInstance.destroy();
            chartInstance = new Chart(document.getElementById('performanceChart'), {
                type: 'line',
                data: { labels: data.map(d => new Date(d.created_at).toLocaleDateString()), datasets: [{ label: 'Kg', data: data.map(d => d.weight), borderColor: '#3b82f6', tension: 0.3 }] }
            });
        }
    </script>
</body>
</html>
