<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SanjaFit | Meu Treino</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.95)), 
                        url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=2070&auto=format&fit=crop');
            background-size: cover; background-position: center; background-attachment: fixed;
        }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .active-tab { background: #3b82f6 !important; border: none !important; box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }
        .active-view { border-bottom: 3px solid #3b82f6; color: white !important; }
        .trophy-on { opacity: 1 !important; grayscale: 0 !important; filter: drop-shadow(0 0 8px gold); }
    </style>
</head>
<body class="text-white min-h-screen pb-10">

    <div id="section-login" class="flex flex-col items-center justify-center min-h-screen p-6 text-center">
        <h1 class="text-5xl font-black italic text-blue-500 uppercase mb-8 tracking-tighter">SANJA<span class="text-white">FIT</span></h1>
        <div class="glass p-8 rounded-[2rem] w-full max-w-md shadow-2xl">
            <input id="login-user" type="text" placeholder="@seu_instagram" class="w-full p-4 mb-4 rounded-xl bg-black/40 border border-white/10 outline-none focus:border-blue-500">
            <input id="login-pass" type="password" placeholder="Senha" class="w-full p-4 mb-8 rounded-xl bg-black/40 border border-white/10 outline-none focus:border-blue-500">
            <button onclick="handleSignIn()" class="w-full bg-blue-600 hover:bg-blue-700 p-4 rounded-xl font-black uppercase tracking-widest shadow-lg transition-all active:scale-95">Entrar no Treino</button>
            <button onclick="handleSignUp()" class="w-full mt-6 text-[10px] text-gray-400 font-bold uppercase hover:text-white">Criar Conta</button>
        </div>
    </div>

    <div id="section-app" class="hidden max-w-2xl mx-auto p-4">
        <header class="flex justify-between items-center py-6">
            <h2 id="display-name" class="text-2xl font-black italic uppercase tracking-tighter italic text-blue-500">@USUARIO</h2>
            <button onclick="location.reload()" class="text-red-400 text-[10px] font-black uppercase border border-red-900/30 px-4 py-2 rounded-xl">Sair</button>
        </header>

        <div class="flex border-b border-white/10 mb-8 font-black uppercase text-[10px] tracking-widest text-center text-gray-500">
            <button onclick="switchView('workouts')" id="nav-workouts" class="flex-1 py-4 active-view">Meus Treinos</button>
            <button onclick="switchView('evolution')" id="nav-evolution" class="flex-1 py-4">Evolução</button>
        </div>

        <div id="view-workouts">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                <div class="glass p-6 rounded-3xl text-center">
                    <p class="text-[9px] font-black uppercase text-gray-500 mb-2 italic">Meta de Treinos</p>
                    <div class="w-full bg-white/5 rounded-full h-2 mb-2 overflow-hidden"><div id="bar-goal" class="bg-blue-600 h-full w-0 transition-all duration-1000"></div></div>
                    <p id="txt-goal" class="text-[10px] font-bold text-blue-400">0/20 Sessões</p>
                </div>
                <div class="glass p-6 rounded-3xl flex justify-around items-center">
                    <span id="t1" class="text-2xl opacity-10 grayscale transition-all">🏆</span>
                    <span id="t2" class="text-2xl opacity-10 grayscale transition-all">🔥</span>
                    <span id="t3" class="text-2xl opacity-10 grayscale transition-all">👑</span>
                </div>
            </div>

            <div class="grid grid-cols-4 gap-2 mb-8">
                <button onclick="changeLetter('A', this)" class="letter-btn p-4 rounded-xl glass font-black active-tab">A</button>
                <button onclick="changeLetter('B', this)" class="letter-btn p-4 rounded-xl glass font-black">B</button>
                <button onclick="changeLetter('C', this)" class="letter-btn p-4 rounded-xl glass font-black">C</button>
                <button onclick="changeLetter('D', this)" class="letter-btn p-4 rounded-xl glass font-black">D</button>
            </div>

            <div class="glass p-6 rounded-[2rem] mb-8 border border-white/5">
                <h3 class="text-xs font-black uppercase mb-4 text-blue-500 italic">Novo Exercício no Treino <span id="label-letter">A</span></h3>
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <input id="in-name" type="text" placeholder="Nome" class="col-span-2 p-3 rounded-xl bg-black/40 border border-white/10 outline-none text-xs">
                    <input id="in-weight" type="text" placeholder="Peso (kg)" class="p-3 rounded-xl bg-black/40 border border-white/10 outline-none text-xs">
                    <input id="in-reps" type="text" placeholder="Séries x Reps" class="p-3 rounded-xl bg-black/40 border border-white/10 outline-none text-xs">
                    <input id="in-notes" type="text" placeholder="Observações" class="col-span-2 p-3 rounded-xl bg-black/40 border border-white/10 outline-none text-xs">
                </div>
                <button onclick="saveWorkout()" class="w-full bg-blue-600 p-4 rounded-xl font-black uppercase text-xs tracking-widest">Adicionar ao Treino</button>
            </div>

            <div id="list-workouts" class="space-y-4 mb-8"></div>
            
            <button onclick="finishSession()" class="w-full bg-green-600 p-5 rounded-2xl font-black uppercase italic shadow-lg shadow-green-900/20">Finalizar Treino de Hoje</button>
            
            <div class="mt-8 border-t border-white/10 pt-8">
                <h3 class="text-xs font-black uppercase mb-4 text-gray-500 italic">Histórico Recente</h3>
                <div id="history-list" class="space-y-2"></div>
            </div>
        </div>

        <div id="view-evolution" class="hidden">
            <div class="glass p-8 rounded-[2rem] mb-8">
                <h3 class="text-center font-black uppercase mb-6 italic text-xs">Fotos de Evolução</h3>
                <input type="file" id="file-photo" class="text-xs text-gray-400 mb-4 block w-full">
                <button onclick="uploadPhoto()" class="w-full bg-blue-600 p-4 rounded-xl font-black uppercase text-xs">Subir Foto</button>
            </div>
            <div id="list-gallery" class="grid grid-cols-2 gap-4"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://dazgtsobkykxwsvbmjfn.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRhemd0c29ia3lreHdzdmJtamZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxOTg4NTYsImV4cCI6MjA4ODc3NDg1Nn0.Ci_Hzqzf9Px8LTg7dNOXcu1dcTzBYWioH2yaFP2h6rI';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let currentLetter = 'A';

        async function handleSignIn() {
            const user = document.getElementById('login-user').value.trim().replace('@','');
            const pass = document.getElementById('login-pass').value;
            const { data, error } = await _supabase.auth.signInWithPassword({ email: `${user}@sanjafit.com`, password: pass });
            if(error) return alert("Erro no Login.");
            initApp(data.user);
        }

        async function handleSignUp() {
            const user = document.getElementById('login-user').value.trim().replace('@','');
            const pass = document.getElementById('login-pass').value;
            const { error } = await _supabase.auth.signUp({ email: `${user}@sanjafit.com`, password: pass, options: { data: { instagram: `@${user}` } } });
            if(error) alert(error.message); else alert("Sucesso! Logue agora.");
        }

        function initApp(user) {
            currentUser = user;
            document.getElementById('section-login').classList.add('hidden');
            document.getElementById('section-app').classList.remove('hidden');
            document.getElementById('display-name').innerText = user.user_metadata.instagram || "@Atleta";
            loadWorkouts();
            updateStats();
        }

        async function saveWorkout() {
            const name = document.getElementById('in-name').value;
            const weight = document.getElementById('in-weight').value;
            const reps = document.getElementById('in-reps').value;
            const notes = document.getElementById('in-notes').value;

            if(!name) return alert("Digite o nome do exercício!");

            const { error } = await _supabase.from('workouts').insert([{
                user_id: currentUser.id,
                category: currentLetter,
                exercise_name: name,
                weight: weight,
                reps: reps,
                notes: notes
            }]);

            if(error) alert(error.message);
            else {
                document.getElementById('in-name').value = '';
                document.getElementById('in-weight').value = '';
                document.getElementById('in-reps').value = '';
                document.getElementById('in-notes').value = '';
                loadWorkouts();
            }
        }

        async function loadWorkouts() {
            const { data } = await _supabase.from('workouts').select('*').eq('user_id', currentUser.id).eq('category', currentLetter).order('created_at');
            document.getElementById('list-workouts').innerHTML = (data || []).map(ex => `
                <div class="glass p-5 rounded-2xl border border-white/5 flex justify-between items-center">
                    <div>
                        <h4 class="font-black uppercase text-sm italic tracking-tighter">${ex.exercise_name}</h4>
                        <p class="text-[10px] text-blue-500 font-bold mt-1">${ex.weight}kg • ${ex.reps || '3x12'}</p>
                        ${ex.notes ? `<p class="text-[9px] text-gray-500 mt-2 italic border-l border-blue-500 pl-2">Obs: ${ex.notes}</p>` : ''}
                    </div>
                    <button onclick="deleteEx('${ex.id}')" class="text-red-900 text-[10px] font-black uppercase">Excluir</button>
                </div>
            `).join('') || '<p class="text-center py-5 text-gray-700 text-xs italic">Aba Vazia</p>';
        }

        async function finishSession() {
            await _supabase.from('workout_history').insert([{ user_id: currentUser.id, category: currentLetter }]);
            alert("Treino batido!");
            updateStats();
        }

        async function updateStats() {
            const { data } = await _supabase.from('workout_history').select('*').eq('user_id', currentUser.id).order('completed_at', {ascending: false});
            const count = data ? data.length : 0;
            const percent = Math.min((count/20)*100, 100);
            document.getElementById('bar-goal').style.width = percent + '%';
            document.getElementById('txt-goal').innerText = `${count}/20 Sessões`;
            if(count >= 1) document.getElementById('t1').classList.add('trophy-on');
            if(count >= 10) document.getElementById('t2').classList.add('trophy-on');
            if(count >= 20) document.getElementById('t3').classList.add('trophy-on');

            document.getElementById('history-list').innerHTML = data.slice(0, 5).map(h => `
                <div class="flex justify-between items-center text-[10px] bg-white/5 p-2 rounded-lg italic font-bold">
                    <span class="text-blue-500 uppercase">Sessão ${h.category}</span>
                    <span class="text-gray-500">${new Date(h.completed_at).toLocaleDateString()}</span>
                </div>
            `).join('');
        }

        async function deleteEx(id) { if(confirm("Remover?")) { await _supabase.from('workouts').delete().eq('id', id); loadWorkouts(); } }
        function switchView(v) { document.getElementById('view-workouts').classList.toggle('hidden', v !== 'workouts'); document.getElementById('view-evolution').classList.toggle('hidden', v !== 'evolution'); }
        function changeLetter(l, btn) { currentLetter = l; document.getElementById('label-letter').innerText = l; document.querySelectorAll('.letter-btn').forEach(b => b.classList.remove('active-tab')); btn.classList.add('active-tab'); loadWorkouts(); }
    </script>
</body>
</html>
