<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SanjaFit | Arena Elite Sharing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; min-height: 100vh; overflow-x: hidden; }
        .nav-bottom { background: rgba(0,0,0,0.95); backdrop-filter: blur(10px); border-top: 1px solid #262626; position: fixed; bottom: 0; width: 100%; height: 70px; z-index: 1000; display: grid; grid-template-columns: repeat(4, 1fr); align-items: center; justify-items: center; }
        .active-nav { color: #3b82f6; transform: scale(1.1); transition: 0.2s; }
        .glass-card { background: #121212; border: 1px solid #262626; border-radius: 12px; }
        .modal-full { display: none; position: fixed; inset: 0; background: #000; z-index: 2000; padding: 20px; flex-direction: column; overflow-y: auto; }
        .photo-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 3000; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        ::-webkit-scrollbar { display: none; }
        .btn-blue { background-color: #0095f6; border-radius: 8px; font-weight: 700; transition: 0.2s; }
        input, select, textarea { background: #121212 !important; border: 1px solid #262626 !important; color: white !important; outline: none; border-radius: 8px; }
    </style>
</head>
<body class="pb-24">

    <div id="photo-zoom" class="photo-overlay">
        <button onclick="closePhotoZoom()" class="absolute top-6 right-6 text-3xl">✕</button>
        <img id="zoom-img" src="" class="max-w-full max-h-[70vh] rounded-lg border border-[#262626]">
        <div id="zoom-actions" class="mt-6 flex gap-8 items-center">
            <button id="btn-like-zoom" class="text-4xl">🤍</button>
            <button id="btn-delete-photo" class="hidden bg-red-600 px-6 py-2 rounded-full font-bold text-[10px] uppercase italic">Excluir Post</button>
        </div>
    </div>

    <div id="modal-user-profile" class="modal-full">
        <div class="flex justify-between items-center mb-6 sticky top-0 bg-black py-2 z-50 border-b border-white/5">
            <h2 id="v-user-handle" class="text-sm font-black uppercase italic text-blue-500">@atleta</h2>
            <button onclick="closeUserProfile()" class="text-2xl">✕</button>
        </div>
        <div class="space-y-6">
            <div class="flex items-center gap-6">
                <div class="w-20 h-20 rounded-full border border-[#262626] overflow-hidden bg-zinc-900 flex items-center justify-center">
                    <img id="v-user-avatar" src="" class="w-full h-full object-cover hidden">
                    <span id="v-user-icon" class="text-3xl">👤</span>
                </div>
                <div class="flex flex-1 justify-around text-center uppercase font-black text-[10px]">
                    <div><p id="v-user-photos-count" class="text-sm">0</p>Posts</div>
                    <div><p id="v-user-followers-count" class="text-sm">0</p>Amigos</div>
                    <div><p id="v-user-likes-count" class="text-sm">0</p>Likes</div>
                </div>
            </div>
            <div class="space-y-3">
                <div>
                    <h2 id="v-user-name" class="font-black text-lg">Nome</h2>
                    <p id="v-user-bio" class="text-xs text-gray-400 mt-1 italic"></p>
                </div>
                <div id="v-user-insta-link" class="hidden">
                    <a id="v-insta-url" href="#" target="_blank" class="flex items-center gap-2 text-xs font-bold text-pink-500 bg-pink-500/10 p-2 rounded-md w-fit">📸 Seguir no Instagram</a>
                </div>
                <div id="v-user-follow-area" class="mt-4"></div>
            </div>
            <div id="v-user-gallery" class="grid grid-cols-3 gap-[1px]"></div>
        </div>
    </div>

    <div id="section-app" class="hidden max-w-lg mx-auto">
        <header class="p-4 border-b border-[#262626] flex justify-between items-center sticky top-0 bg-black z-50">
            <h1 class="text-xl font-black italic tracking-tighter uppercase">Sanja<span class="text-blue-500">Fit</span></h1>
            <button onclick="handleSignOut()" class="text-[10px] font-bold text-red-500 uppercase italic">Sair</button>
        </header>

        <div id="view-championship" class="p-4 space-y-4">
            <div id="ranking-list" class="space-y-3"></div>
        </div>

        <div id="view-search" class="hidden p-4 space-y-6">
            <input id="search-input" type="text" oninput="filterAthletes()" placeholder="Pesquisar @atleta..." class="w-full p-4 glass-card text-sm">
            <div id="search-results" class="space-y-3"></div>
        </div>

        <div id="view-stats" class="hidden p-4 space-y-6">
            <div class="flex gap-2 overflow-x-auto pb-2">
                <button onclick="changeLetter('A', this)" class="letter-btn px-6 py-2 rounded-full border border-[#262626] text-[10px] font-black active-nav">TREINO A</button>
                <button onclick="changeLetter('B', this)" class="letter-btn px-6 py-2 rounded-full border border-[#262626] text-[10px] font-black">TREINO B</button>
                <button onclick="changeLetter('C', this)" class="letter-btn px-6 py-2 rounded-full border border-[#262626] text-[10px] font-black">TREINO C</button>
            </div>
            <div class="glass-card p-4 space-y-3">
                <input id="in-name" type="text" placeholder="Nome do Exercício" class="w-full p-3 text-sm">
                <div class="flex gap-2"><input id="in-weight" type="number" placeholder="Peso" class="w-full p-3 text-sm"><input id="in-reps" type="text" placeholder="Reps" class="w-full p-3 text-sm"></div>
                <button id="btn-save-workout" onclick="saveWorkout()" class="w-full btn-blue p-3 text-xs uppercase italic">Adicionar</button>
                <button id="btn-cancel-edit" onclick="cancelEditWorkout()" class="hidden w-full text-[10px] text-gray-500 underline uppercase">Cancelar</button>
            </div>
            <div id="list-workouts" class="space-y-2"></div>
        </div>

        <div id="view-profile" class="hidden">
            <div class="p-6 space-y-6">
                <div class="flex items-center gap-6">
                    <div class="relative w-24 h-24 rounded-full border-2 border-[#262626] overflow-hidden bg-zinc-900 flex items-center justify-center">
                        <img id="my-avatar-img" src="" class="w-full h-full object-cover hidden">
                        <span id="my-avatar-icon" class="text-4xl">👤</span>
                        <button onclick="document.getElementById('file-avatar').click()" class="absolute bottom-0 right-0 bg-blue-500 p-1 rounded-full text-[10px]">📷</button>
                        <input type="file" id="file-avatar" accept="image/*" class="hidden" onchange="uploadAvatar()">
                    </div>
                    <div class="flex flex-1 justify-around text-center uppercase font-black text-[9px]">
                        <div><p id="my-photos-count" class="text-sm">0</p>Posts</div>
                        <div><p id="my-followers-count" class="text-sm">0</p>Amigos</div>
                        <div><p id="my-likes-count" class="text-sm">0</p>Likes</div>
                    </div>
                </div>
                <div class="space-y-1">
                    <h2 id="my-name" class="font-black text-xl italic uppercase">Nome</h2>
                    <h3 id="my-handle" class="text-xs text-blue-500 font-bold uppercase">@atleta</h3>
                    <p id="my-bio" class="text-xs text-gray-400 mt-2 italic"></p>
                    <button onclick="toggleEdit()" class="w-full bg-zinc-800 p-2 rounded mt-3 text-[10px] font-black uppercase">Editar Perfil</button>
                </div>

                <div id="edit-form" class="hidden space-y-3 glass-card p-4">
                    <input id="edit-name" type="text" placeholder="Nome Real" class="w-full p-3 text-xs">
                    <textarea id="edit-bio" class="w-full p-3 text-xs" placeholder="Sua bio"></textarea>
                    <input id="edit-insta" type="text" placeholder="Link do seu Instagram" class="w-full p-3 text-xs">
                    <button onclick="saveProfile()" class="w-full btn-blue p-2 text-xs uppercase">Salvar</button>
                    <button onclick="confirmDeleteAccount()" class="w-full text-red-700 text-[10px] font-bold uppercase mt-4">Excluir minha conta permanentemente</button>
                </div>

                <button onclick="document.getElementById('file-post').click()" class="w-full btn-blue p-4 uppercase text-xs font-black italic">Postar Shape 🔥</button>
                <input type="file" id="file-post" accept="image/*" class="hidden" onchange="uploadEvolution()">
                
                <div id="my-gallery" class="grid grid-cols-3 gap-[1px]"></div>

                <footer class="mt-12 py-10 text-center border-t border-[#1a1a1a]">
                    <p class="text-[10px] font-black italic text-gray-600 mb-2 uppercase tracking-widest">Desenvolvido por</p>
                    <a href="https://instagram.com/systemsjc_" target="_blank" class="text-blue-500 font-black text-xs uppercase italic tracking-tighter">@SystemSJC_</a>
                    <div class="mt-4">
                        <a href="https://instagram.com/ojeanvianna_" target="_blank" class="text-gray-500 font-bold text-[10px] uppercase italic">Jean Vianna</a>
                    </div>
                </footer>
            </div>
        </div>

        <nav class="nav-bottom">
            <button onclick="switchView('championship')" id="nav-championship" class="active-nav">🏆</button>
            <button onclick="switchView('search')" id="nav-search">🔍</button>
            <button onclick="switchView('stats')" id="nav-stats">📋</button>
            <button onclick="switchView('profile')" id="nav-profile">👤</button>
        </nav>
    </div>

    <script>
        const SUPABASE_URL = 'https://dazgtsobkykxwsvbmjfn.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRhemd0c29ia3lreHdzdmJtamZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxOTg4NTYsImV4cCI6MjA4ODc3NDg1Nn0.Ci_Hzqzf9Px8LTg7dNOXcu1dcTzBYWioH2yaFP2h6rI';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null, currentLetter = 'A', editingWorkoutId = null, allProfiles = [];

        window.onload = async () => {
            const { data: { user } } = await _supabase.auth.getUser();
            if(user) initApp(user);
        };

        async function initApp(user) {
            currentUser = user;
            document.getElementById('section-login').classList.add('hidden');
            document.getElementById('section-app').classList.remove('hidden');
            loadRanking(); loadMyProfile();
        }

        // --- RANKING ---
        async function loadRanking() {
            const { data } = await _supabase.from('profiles').select('*').order('xp', {ascending: false});
            allProfiles = data || [];
            document.getElementById('ranking-list').innerHTML = allProfiles.map((p, i) => `
                <div class="flex items-center justify-between p-4 glass-card ${i===0?'border-yellow-500/50':''}" onclick="openUserProfile('${p.id}')">
                    <div class="flex items-center gap-3">
                        <span class="text-[10px] font-black">${i+1}º</span>
                        <img src="${p.avatar_url || ''}" class="w-10 h-10 rounded-full bg-zinc-900 ${p.avatar_url?'':'hidden'}">
                        <p class="text-xs font-bold uppercase italic">${p.instagram}</p>
                    </div>
                    <span class="text-[9px] font-black text-blue-500">${p.xp || 0} XP</span>
                </div>`).join('');
        }

        // --- PERFIL DO AMIGO ---
        async function openUserProfile(userId) {
            const { data: p } = await _supabase.from('profiles').select('*').eq('id', userId).single();
            if(!p) return;
            document.getElementById('v-user-handle').innerText = p.instagram;
            document.getElementById('v-user-name').innerText = p.full_name || "Atleta";
            document.getElementById('v-user-bio').innerText = p.bio || "";
            
            // Link Instagram do Amigo
            const instaDiv = document.getElementById('v-user-insta-link');
            if(p.instagram_link) {
                instaDiv.classList.remove('hidden');
                document.getElementById('v-insta-url').href = p.instagram_link;
            } else { instaDiv.classList.add('hidden'); }

            if(p.avatar_url) { document.getElementById('v-user-avatar').src = p.avatar_url; document.getElementById('v-user-avatar').classList.remove('hidden'); document.getElementById('v-user-icon').classList.add('hidden'); }
            
            const { data: photos } = await _supabase.from('evolution_gallery').select('*, likes(user_id)').eq('user_id', userId).order('created_at', {ascending: false});
            const { count: friends } = await _supabase.from('connections').select('*', {count: 'exact'}).eq('following_id', userId).eq('status', 'accepted');
            const totalLikes = photos?.reduce((acc, curr) => acc + (curr.likes?.length || 0), 0) || 0;

            document.getElementById('v-user-photos-count').innerText = photos?.length || 0;
            document.getElementById('v-user-followers-count').innerText = friends || 0;
            document.getElementById('v-user-likes-count').innerText = totalLikes;
            document.getElementById('v-user-gallery').innerHTML = (photos || []).map(ph => `<img src="${ph.photo_url}" class="aspect-square object-cover" onclick="openPhotoZoom('${ph.id}','${ph.photo_url}',false)">`).join('');
            document.getElementById('modal-user-profile').style.display = 'flex';
        }

        // --- EXCLUSÃO DE CONTA ---
        async function confirmDeleteAccount() {
            if(confirm("ATENÇÃO: Isso excluirá permanentemente todos os seus treinos, fotos e perfil. Não há volta. Deseja continuar?")) {
                const { error } = await _supabase.rpc('delete_user_data'); // Requer RPC no Supabase ou deleção manual via API
                // Caso não tenha RPC, deletamos o perfil (o resto cai via Cascade no SQL se configurado)
                await _supabase.from('profiles').delete().eq('id', currentUser.id);
                await _supabase.auth.signOut();
                location.reload();
            }
        }

        // --- MEU PERFIL ---
        async function loadMyProfile() {
            const { data: p } = await _supabase.from('profiles').select('*').eq('id', currentUser.id).single();
            document.getElementById('my-name').innerText = p.full_name || "Atleta";
            document.getElementById('my-handle').innerText = p.instagram;
            document.getElementById('my-bio').innerText = p.bio || "Sem bio.";
            document.getElementById('edit-name').value = p.full_name || "";
            document.getElementById('edit-bio').value = p.bio || "";
            document.getElementById('edit-insta').value = p.instagram_link || "";

            if(p.avatar_url) { document.getElementById('my-avatar-img').src = p.avatar_url; document.getElementById('my-avatar-img').classList.remove('hidden'); document.getElementById('my-avatar-icon').classList.add('hidden'); }
            const { data: posts } = await _supabase.from('evolution_gallery').select('*, likes(user_id)').eq('user_id', currentUser.id);
            const { count: friends } = await _supabase.from('connections').select('*', {count: 'exact'}).eq('following_id', currentUser.id).eq('status', 'accepted');
            
            document.getElementById('my-photos-count').innerText = posts?.length || 0;
            document.getElementById('my-followers-count').innerText = friends || 0;
            document.getElementById('my-likes-count').innerText = posts?.reduce((acc, curr) => acc + (curr.likes?.length || 0), 0) || 0;
            document.getElementById('my-gallery').innerHTML = (posts || []).map(ph => `<img src="${ph.photo_url}" class="aspect-square object-cover" onclick="openPhotoZoom('${ph.id}','${ph.photo_url}',true)">`).join('');
        }

        // --- AUXILIARES (TREINO, ZOOM, AUTH, PERFIL) ---
        async function saveProfile() {
            const n = document.getElementById('edit-name').value, b = document.getElementById('edit-bio').value, i = document.getElementById('edit-insta').value;
            await _supabase.from('profiles').update({ full_name: n, bio: b, instagram_link: i }).eq('id', currentUser.id);
            location.reload();
        }

        function toggleEdit() { document.getElementById('edit-form').classList.toggle('hidden'); }
        function closeUserProfile() { document.getElementById('modal-user-profile').style.display = 'none'; }
        function closePhotoZoom() { document.getElementById('photo-zoom').style.display = 'none'; }
        function switchView(v) { ['championship','search','stats','profile'].forEach(id => { document.getElementById('view-'+id).classList.add('hidden'); document.getElementById('nav-'+id).classList.remove('active-nav'); }); document.getElementById('view-'+v).classList.remove('hidden'); document.getElementById('nav-'+v).classList.add('active-nav'); if(v==='stats') loadWorkouts(); }
        async function handleSignOut() { await _supabase.auth.signOut(); location.reload(); }
        async function handleSignIn() { const u = document.getElementById('login-user').value.trim().replace('@',''); await _supabase.auth.signInWithOtp({ email: `${u}@sanjafit.com` }); alert("Verifique seu login!"); location.reload(); }
        
        // Funções de Treino e Edição mantidas conforme as anteriores...
        async function saveWorkout() {
            const n = document.getElementById('in-name').value, w = document.getElementById('in-weight').value, r = document.getElementById('in-reps').value;
            await _supabase.from('workouts').insert([{ user_id: currentUser.id, category: currentLetter, exercise_name: n, weight: String(w), reps: String(r) }]);
            loadWorkouts();
        }
        async function loadWorkouts() {
            const { data } = await _supabase.from('workouts').select('*').eq('user_id', currentUser.id).eq('category', currentLetter);
            document.getElementById('list-workouts').innerHTML = (data || []).map(ex => `<div class="p-3 glass-card flex justify-between text-xs"><b>${ex.exercise_name}</b><span>${ex.weight}kg x ${ex.reps}</span></div>`).join('');
        }
        function changeLetter(l, btn) { currentLetter = l; document.querySelectorAll('.letter-btn').forEach(b => b.classList.remove('active-nav')); btn.classList.add('active-nav'); loadWorkouts(); }
        async function uploadEvolution() { const f = document.getElementById('file-post').files[0]; const comp = await imageCompression(f, { maxSizeMB: 0.2, maxWidthOrHeight: 1080 }); const name = `shape_${Date.now()}.jpg`; await _supabase.storage.from('shapes').upload(name, comp); const { data: url } = _supabase.storage.from('shapes').getPublicUrl(name); await _supabase.from('evolution_gallery').insert([{ user_id: currentUser.id, photo_url: url.publicUrl }]); location.reload(); }
        async function uploadAvatar() { const f = document.getElementById('file-avatar').files[0]; await _supabase.storage.from('shapes').upload(`avatar_${currentUser.id}.jpg`, f, { upsert: true }); const { data: url } = _supabase.storage.from('shapes').getPublicUrl(`avatar_${currentUser.id}.jpg`); await _supabase.from('profiles').update({ avatar_url: url.publicUrl }).eq('id', currentUser.id); location.reload(); }
        function openPhotoZoom(id, url, isMine) { document.getElementById('zoom-img').src = url; document.getElementById('photo-zoom').style.display = 'flex'; const bD = document.getElementById('btn-delete-photo'); bD.classList.toggle('hidden', !isMine); bD.onclick = async () => { if(confirm("Excluir?")) { await _supabase.from('evolution_gallery').delete().eq('id', id); location.reload(); } } }
    </script>
</body>
</html>
