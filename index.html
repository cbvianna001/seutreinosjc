<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SanjaFit | Private Social Club</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; min-height: 100vh; overflow-x: hidden; }
        .nav-bottom { background: #000; border-top: 1px solid #262626; position: fixed; bottom: 0; width: 100%; height: 65px; z-index: 100; display: flex; justify-content: space-around; align-items: center; }
        .post-card { border-bottom: 1px solid #262626; padding-bottom: 15px; }
        .btn-blue { background-color: #0095f6; border-radius: 8px; font-weight: 700; font-size: 12px; }
        .btn-danger { background-color: #363636; color: #ff4d4d; border-radius: 8px; font-weight: 700; font-size: 11px; }
        .glass-card { background: #121212; border: 1px solid #262626; border-radius: 12px; }
        input, textarea { background: #121212 !important; border: 1px solid #262626 !important; color: white !important; border-radius: 8px !important; outline: none; }
        ::-webkit-scrollbar { display: none; }
        .active-nav { color: #3b82f6; transform: scale(1.1); }
        #modal-followers { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; padding: 20px; }
    </style>
</head>
<body class="pb-20">

    <div id="modal-followers" class="flex-col">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-lg font-black uppercase italic">Seus Seguidores</h2>
            <button onclick="closeFollowers()" class="text-2xl">✕</button>
        </div>
        <div id="followers-list" class="space-y-4 overflow-y-auto flex-1"></div>
    </div>

    <div id="section-app" class="hidden max-w-lg mx-auto">
        <header class="sticky top-0 bg-black border-b border-[#262626] p-4 flex justify-between items-center z-50">
            <h1 class="text-xl font-black italic tracking-tighter">Sanja<span class="text-blue-500">Fit</span></h1>
            <div id="notif-badge" class="hidden w-2 h-2 bg-red-500 rounded-full animate-pulse"></div>
        </header>

        <div id="view-search" class="hidden p-4 space-y-6">
            <div class="space-y-2">
                <h3 class="text-[10px] font-bold text-gray-500 uppercase">Solicitações Pendentes</h3>
                <div id="requests-list" class="space-y-2"></div>
            </div>
            <div class="space-y-4 pt-4 border-t border-[#262626]">
                <input id="search-input" type="text" oninput="filterAthletes()" placeholder="Pesquisar @atleta..." class="w-full p-3 text-sm">
                <div id="ranking-list" class="space-y-4"></div>
            </div>
        </div>

        <div id="view-profile" class="hidden">
            <div class="p-6 space-y-6">
                <div class="flex items-center gap-6">
                    <div class="relative">
                        <div class="w-20 h-20 rounded-full border-2 border-[#262626] overflow-hidden bg-[#121212] flex items-center justify-center">
                            <img id="profile-img-display" src="" class="w-full h-full object-cover hidden">
                            <span id="profile-icon" class="text-3xl">👤</span>
                        </div>
                        <button onclick="document.getElementById('file-avatar').click()" class="absolute bottom-0 right-0 bg-blue-500 p-1.5 rounded-full text-[10px]">📷</button>
                        <input type="file" id="file-avatar" accept="image/*" class="hidden" onchange="uploadAvatar()">
                    </div>
                    <div class="flex flex-1 justify-around text-center">
                        <div onclick="switchView('profile')" class="cursor-pointer"><p id="stat-photos" class="font-bold text-sm">0</p><p class="text-[9px] text-gray-500 font-black">Fotos</p></div>
                        <div onclick="openFollowers()" class="cursor-pointer"><p id="stat-followers" class="font-bold text-sm">0</p><p class="text-[9px] text-gray-500 font-black">Seguidores</p></div>
                        <div><p id="stat-likes" class="font-bold text-sm">0</p><p class="text-[9px] text-gray-500 font-black">Likes</p></div>
                    </div>
                </div>
                <div>
                    <h2 id="profile-name" class="font-bold text-sm">@atleta</h2>
                    <p id="profile-bio" class="text-xs mt-1 text-gray-400">Bio do atleta...</p>
                    <button onclick="toggleBioEdit()" class="w-full bg-[#363636] p-2 rounded-md text-[10px] font-bold mt-4 uppercase">Editar Perfil</button>
                </div>
            </div>
            <div id="my-gallery" class="grid grid-cols-3 gap-[2px]"></div>
        </div>

        <div id="view-feed" class="p-0"><div id="public-feed-list"></div></div>
        <div id="view-workouts" class="hidden p-4">
            <div id="list-workouts"></div>
        </div>

        <nav class="nav-bottom">
            <button onclick="switchView('feed')" id="nav-feed" class="text-2xl active-nav">🏠</button>
            <button onclick="switchView('search')" id="nav-search" class="text-2xl">🔍</button>
            <button onclick="switchView('workouts')" id="nav-workouts" class="text-2xl">📋</button>
            <button onclick="switchView('profile')" id="nav-profile" class="text-2xl">👤</button>
        </nav>
    </div>

    <div id="section-login" class="flex flex-col items-center justify-center min-h-screen p-6">
        <h1 class="text-3xl font-black italic mb-12 uppercase">Sanja<span class="text-blue-500">Fit</span></h1>
        <input id="login-user" type="text" placeholder="@seu_instagram" class="w-full p-4 mb-4">
        <input id="login-pass" type="password" placeholder="Senha" class="w-full p-4 mb-8">
        <button onclick="handleSignIn()" class="w-full btn-blue p-4 text-sm uppercase">Entrar</button>
        <button onclick="handleSignUp()" class="mt-6 text-blue-500 text-xs font-bold">Cadastrar Novo Atleta</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://dazgtsobkykxwsvbmjfn.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRhemd0c29ia3lreHdzdmJtamZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxOTg4NTYsImV4cCI6MjA4ODc3NDg1Nn0.Ci_Hzqzf9Px8LTg7dNOXcu1dcTzBYWioH2yaFP2h6rI';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null, allProfiles = [];

        window.onload = async () => {
            const { data: { user } } = await _supabase.auth.getUser();
            if(user) initApp(user);
        };

        async function initApp(user) {
            currentUser = user;
            document.getElementById('section-login').classList.add('hidden');
            document.getElementById('section-app').classList.remove('hidden');
            await autoFixProfile(user);
            loadPublicFeed(); loadRanking(); loadRequests(); updateFollowersCount();
        }

        async function autoFixProfile(user) {
            const { data: profile } = await _supabase.from('profiles').select('*').eq('id', user.id).single();
            const handle = user.user_metadata.instagram || `@atleta`;
            if(!profile) await _supabase.from('profiles').insert([{ id: user.id, instagram: handle }]);
            document.getElementById('profile-name').innerText = profile?.instagram || handle;
        }

        // --- SISTEMA DE SEGUIDORES E REMOÇÃO ---
        async function updateFollowersCount() {
            const { data } = await _supabase.from('connections').select('follower_id').eq('following_id', currentUser.id).eq('status', 'accepted');
            document.getElementById('stat-followers').innerText = data ? data.length : 0;
        }

        async function openFollowers() {
            document.getElementById('modal-followers').style.display = 'flex';
            const { data: followers } = await _supabase.from('connections').select('follower_id, profiles!connections_follower_id_fkey(instagram, avatar_url)').eq('following_id', currentUser.id).eq('status', 'accepted');
            
            document.getElementById('followers-list').innerHTML = (followers || []).map(f => `
                <div class="flex items-center justify-between p-3 glass-card">
                    <div class="flex items-center gap-3">
                        <img src="${f.profiles?.avatar_url || ''}" class="w-8 h-8 rounded-full bg-[#000] ${f.profiles?.avatar_url ? '' : 'hidden'}">
                        <span class="text-xs font-bold">${f.profiles?.instagram}</span>
                    </div>
                    <button onclick="removeFollower('${f.follower_id}')" class="btn-danger px-3 py-1">Remover</button>
                </div>
            `).join('') || '<p class="text-center text-xs text-gray-600 py-10">Ninguém te segue ainda.</p>';
        }

        function closeFollowers() { document.getElementById('modal-followers').style.display = 'none'; }

        async function removeFollower(id) {
            if(!confirm("Remover este atleta da sua lista de seguidores?")) return;
            await _supabase.from('connections').delete().eq('follower_id', id).eq('following_id', currentUser.id);
            openFollowers(); updateFollowersCount();
        }

        // --- SOLICITAÇÕES PENDENTES ---
        async function loadRequests() {
            const { data: requests } = await _supabase.from('connections').select('follower_id, profiles!connections_follower_id_fkey(instagram)').eq('following_id', currentUser.id).eq('status', 'pending');
            const badge = document.getElementById('notif-badge');
            badge.classList.toggle('hidden', !requests?.length);
            
            document.getElementById('requests-list').innerHTML = (requests || []).map(r => `
                <div class="flex items-center justify-between p-3 bg-blue-500/10 border border-blue-500/30 rounded-xl">
                    <span class="text-xs font-bold">${r.profiles.instagram} quer te seguir</span>
                    <div class="flex gap-2">
                        <button onclick="respondRequest('${r.follower_id}', 'accepted')" class="bg-blue-600 px-3 py-1 rounded text-[10px] font-bold">Aceitar</button>
                        <button onclick="respondRequest('${r.follower_id}', 'rejected')" class="bg-red-900 px-3 py-1 rounded text-[10px] font-bold">Recusar</button>
                    </div>
                </div>`).join('');
        }

        async function respondRequest(followerId, status) {
            if(status === 'accepted') await _supabase.from('connections').update({ status }).eq('follower_id', followerId).eq('following_id', currentUser.id);
            else await _supabase.from('connections').delete().eq('follower_id', followerId).eq('following_id', currentUser.id);
            loadRequests(); updateFollowersCount();
        }

        // --- BUSCA CORRIGIDA ---
        async function loadRanking() {
            const { data } = await _supabase.from('profiles').select('*');
            allProfiles = data || [];
            filterAthletes();
        }

        function filterAthletes() {
            const term = document.getElementById('search-input').value.toLowerCase();
            const list = document.getElementById('ranking-list');
            const filtered = allProfiles.filter(p => p.instagram?.toLowerCase().includes(term) && p.id !== currentUser.id);
            
            list.innerHTML = filtered.map(p => `
                <div class="flex items-center justify-between p-2">
                    <div class="flex items-center gap-3">
                        <img src="${p.avatar_url || ''}" class="w-10 h-10 rounded-full border border-[#262626] ${p.avatar_url ? '' : 'hidden'}">
                        <div><p class="text-xs font-bold">${p.instagram}</p></div>
                    </div>
                    <button onclick="sendFollowRequest('${p.id}')" class="btn-blue px-4 py-1.5">Seguir</button>
                </div>`).join('');
        }

        async function sendFollowRequest(targetId) {
            const { error } = await _supabase.from('connections').insert([{ follower_id: currentUser.id, following_id: targetId, status: 'pending' }]);
            if(error) alert("Solicitação já enviada!"); else alert("Solicitação enviada!");
        }

        // --- FUNÇÕES DE NAVEGAÇÃO E AUXILIARES ---
        function switchView(v) {
            ['feed','search','workouts','profile'].forEach(id => {
                document.getElementById('view-'+id).classList.add('hidden');
                document.getElementById('nav-'+id).classList.remove('active-nav');
            });
            document.getElementById('view-'+v).classList.remove('hidden');
            document.getElementById('nav-'+v).classList.add('active-nav');
            if(v === 'search') { loadRanking(); loadRequests(); }
        }

        async function handleSignIn() {
            const u = document.getElementById('login-user').value.trim().replace('@',''), p = document.getElementById('login-pass').value;
            const { data, error } = await _supabase.auth.signInWithPassword({ email: `${u}@sanjafit.com`, password: p });
            if(error) return alert("Usuário ou senha incorretos.");
            location.reload();
        }
        // Funções de Treino, Foto e Likes permanecem integradas no código completo
        // ... (Mesma lógica das versões anteriores mas com o visual Social Elite)
    </script>
</body>
</html>
